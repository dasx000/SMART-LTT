<div class="bg-gray-100 flex items-center justify-center h-screen font-sans">
    <!-- Spinner saat cek sesi -->
    <div id="viewLoading" class="text-center">
        <i class="fa-solid fa-circle-notch fa-spin text-green-600 text-4xl mb-4"></i>
        <p class="text-gray-500 text-sm">Memuat...</p>
    </div>

    <!-- Form Login -->
    <div id="viewLogin" class="hidden bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm mx-4">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-leaf text-green-600 text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">e-LTT Palawija</h1>
            <p class="text-xs text-gray-500 mt-1">Kementerian Pertanian Republik Indonesia</p>
        </div>

        <form id="formLogin" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-700 mb-1">NIP (Nomor Induk Pegawai)</label>
                <input type="number" id="nip"
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-green-500 focus:ring-2 focus:ring-green-200 outline-none transition"
                    placeholder="Masukkan NIP Anda" required>
            </div>
            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-1">PIN Rahasia</label>
                <input type="password" id="pin"
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-green-500 focus:ring-2 focus:ring-green-200 outline-none transition"
                    placeholder="******" required>
            </div>
            <button type="submit" id="btnLogin"
                class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition flex justify-center items-center gap-2">
                <span id="loginText">Masuk Sekarang</span>
                <i id="loginSpinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-[10px] text-gray-400 font-medium tracking-widest uppercase">
                Versi 1.3.0 • © 2026 e-LTT Palawija
            </p>
        </div>
    </div>
</div>
