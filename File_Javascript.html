    function setTab(el, filter) {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('bg-green-600', 'text-white', 'hover:bg-green-700');
            btn.classList.add('text-gray-500', 'hover:text-green-600');
        });
        el.classList.add('bg-green-600', 'text-white', 'hover:bg-green-700');
        el.classList.remove('text-gray-500', 'hover:text-green-600');

        const wrapperFilter = document.getElementById('wrapperFilterBulan');

        if (filter === 'rekap-padi' || filter === 'jagung' || filter === 'ubi-kayu') {
            document.getElementById('panelDashboard').classList.add('hidden');
            document.getElementById('panelRekap').classList.remove('hidden');
            if (wrapperFilter) wrapperFilter.classList.add('hidden');
            
            currentRekapTab = filter;

            if (filter === 'rekap-padi') {
                document.getElementById('judulPanelRekap').innerText = 'Rekap Padi Harian (e-Pusluh)';
                document.getElementById('filterJenisLTT').classList.remove('hidden');
            } else if (filter === 'jagung') {
                document.getElementById('judulPanelRekap').innerText = 'Rekap Jagung Harian';
                document.getElementById('filterJenisLTT').classList.add('hidden');
            } else if (filter === 'ubi-kayu') {
                document.getElementById('judulPanelRekap').innerText = 'Rekap Ubi Kayu Harian';
                document.getElementById('filterJenisLTT').classList.add('hidden');
            }

            muatRekap();
        } else {
            document.getElementById('panelDashboard').classList.remove('hidden');
            document.getElementById('panelRekap').classList.add('hidden');
            if (wrapperFilter) wrapperFilter.classList.remove('hidden');
        }
    }

            .withFailureHandler(function(err) {
                document.getElementById('verifikasiLoading').classList.add('hidden');
                Swal.fire('Error', err.message, 'error');
            })
            .getAntreanKabupaten();

    function renderTabelVerifikasiKec(result) {
        document.getElementById('angkaPctVerified').innerText = result.pctVerified;
        document.getElementById('angkaMenunggu').innerText = result.countMenunggu;
        dataVerifKec = result.kecList || [];
        filterTabelVerifikasi();
    }

    function filterTabelVerifikasi() {
        const fs = (document.getElementById('filterStatusVerif') || {}).value || '';
        const cari = ((document.getElementById('cariKecVerif') || {}).value || '').toLowerCase();
        const filtered = dataVerifKec.filter(k => {
            const bisaVerif = k.belumBPP === 0 && k.siapVerif > 0;
            const matchStatus = !fs || (fs === 'siap' && bisaVerif) || (fs === 'belum' && !bisaVerif);
            const matchCari = !cari || k.nama.toLowerCase().includes(cari);
            return matchStatus && matchCari;
        });
        const tbody = document.getElementById('tabelVerifikasiKec');
        if (!filtered.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="p-10 text-center text-gray-400">Tidak ada data sesuai filter.</td></tr>';
            return;
        }
        tbody.innerHTML = filtered.map(k => {
            const bisaVerif = k.belumBPP === 0 && k.siapVerif > 0;
            const dot = bisaVerif
                ? '<span class="w-4 h-4 rounded-full bg-green-500 inline-block"></span>'
                : '<span class="w-4 h-4 rounded-full bg-red-500 inline-block"></span>';
            const ket = bisaVerif
                ? '<span class="text-green-600 font-medium text-xs">Sudah bisa diverifikasi</span>'
                : (k.belumBPP > 0
                    ? `<span class="text-red-500 text-xs font-medium">Tidak bisa diverifikasi<br><span class="text-gray-500 font-normal">Terdapat ${k.belumBPP} laporan yang belum diverifikasi oleh Admin BPP</span></span>`
                    : '<span class="text-gray-400 text-xs">Belum ada laporan masuk</span>');
            const idsEncoded = encodeURIComponent(JSON.stringify(k.ids));
            const kecEsc = k.nama.replace(/'/g, "\\'");
            const btnHtml = bisaVerif
                ? `<button onclick="verifikasiKecamatan('${kecEsc}','${idsEncoded}')" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1"><i class="fa-solid fa-check-double"></i> Verifikasi Laporan</button>`
                : `<button disabled class="bg-gray-100 text-gray-400 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 cursor-not-allowed"><i class="fa-solid fa-check-double"></i> Verifikasi Laporan</button>`;
            return `<tr class="border-b border-gray-50 hover:bg-gray-50 transition">
                <td class="p-4">${btnHtml}</td>
                <td class="p-4 text-center">${dot}</td>
                <td class="p-4 font-bold text-gray-800">${k.nama}</td>
                <td class="p-4 text-center"><span class="bg-blue-50 text-blue-700 text-xs font-bold px-2 py-1 rounded-full">${k.totalLaporan}</span></td>
                <td class="p-4">${ket}</td>
                <td class="p-4 text-center font-bold ${k.sudahKab > 0 ? 'text-green-600' : 'text-gray-400'}">${k.sudahKab}</td>
            </tr>`;
        }).join('');
    }

    function verifikasiKecamatan(kecamatan, idsEncoded) {
        const ids = JSON.parse(decodeURIComponent(idsEncoded));
        Swal.fire({
            title: 'Verifikasi Kec. ' + kecamatan + '?',
            html: `<span class="text-gray-600">${ids.length} laporan akan disahkan oleh Kabupaten.</span>`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Ya, Verifikasi',
            cancelButtonText: 'Batal',
            confirmButtonColor: '#16a34a'
        }).then(res => {
            if (res.isConfirmed) {
                google.script.run
                    .withSuccessHandler(() => {
                        Swal.fire({ title: 'Berhasil!', text: 'Laporan Kec. ' + kecamatan + ' telah disahkan.', icon: 'success', timer: 2000, showConfirmButton: false });

                        muatVerifikasi();

                    })
                    .withFailureHandler(err => Swal.fire('Error', err.message, 'error'))
                    .prosesVerifikasiMassal(ids, 'Admin_Kab');

        });

    function muatDaftarUser(force = false) {

    function filterTabelUser() {
        const cari = document.getElementById('cariUser').value.toLowerCase();
        const role = document.getElementById('filterRole').value;
        const kec = document.getElementById('filterKecUser').value;
        const tbody = document.getElementById('tabelUser');

        const filtered = (allUserData || []).filter(u => {
            const nama = (u.nama || '').toLowerCase();
            const nip = (u.nip || '').toString();
            const matchCari = !cari || nama.includes(cari) || nip.includes(cari);
            const matchRole = !role || u.role === role;
            const matchKec = !kec || u.kecamatan === kec;
            return matchCari && matchRole && matchKec;
        });

        const itemsPerPage = parseInt(document.getElementById('itemsPerPageUser').value) || 10;
        const totalItems = filtered.length;
        const maxPage = Math.ceil(totalItems / itemsPerPage) || 1;
        if (currentPageUser > maxPage) currentPageUser = maxPage;
        if (currentPageUser < 1) currentPageUser = 1;

        const startIdx = (currentPageUser - 1) * itemsPerPage;
        const endIdx = Math.min(startIdx + itemsPerPage, totalItems);
        const paginated = filtered.slice(startIdx, endIdx);

        // Update Info Pagination
        document.getElementById('infoStartUser').innerText = totalItems > 0 ? startIdx + 1 : 0;
        document.getElementById('infoEndUser').innerText = endIdx;
        document.getElementById('infoTotalUser').innerText = totalItems;
        document.getElementById('btnPrevUser').disabled = currentPageUser <= 1;
        document.getElementById('btnNextUser').disabled = currentPageUser >= maxPage;

        if (paginated.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="p-12 text-center text-gray-400 italic">Data user tidak ditemukan.</td></tr>';
            return;
        }

        tbody.innerHTML = paginated.map((u, i) => {
            const badgeRole = { 'Admin_Kab': 'bg-purple-100 text-purple-700', 'Admin_BPP': 'bg-blue-100 text-blue-700', 'Penyuluh': 'bg-green-100 text-green-700' };
            const badgeStatus = u.status === 'Aktif' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';
            const wilayah = u.role === 'Admin_Kab' ? 'Kabupaten' : `${u.kecamatan}<br><span class="text-[10px] text-gray-400">${u.desa || '-'}</span>`;

            return `
            <tr class="border-b border-gray-50 hover:bg-gray-50 transition">
                <td class="p-4 text-center text-xs text-gray-500">${startIdx + i + 1}</td>
                <td class="p-4">
                    <div class="font-bold text-gray-800">${u.nama}</div>
                    <div class="text-[10px] text-gray-400 font-mono">${u.nip}</div>
                </td>
                <td class="p-4"><span class="px-2 py-1 ${badgeRole[u.role] || 'bg-gray-100'} text-[10px] font-bold rounded-full">${u.role}</span></td>
                <td class="p-4 text-center text-xs">${wilayah}</td>
                <td class="p-4 text-center"><span class="px-2 py-1 ${badgeStatus} text-[10px] font-bold rounded-full">${u.status}</span></td>
                <td class="p-4 text-center">
                    <div class="flex justify-center gap-2">
                        <button onclick="editUser('${u.id}')" class="w-8 h-8 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-600 hover:text-white transition shadow-sm"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="hapusUser('${u.id}', '${u.nip}')" class="w-8 h-8 bg-red-50 text-red-600 rounded-lg hover:bg-red-600 hover:text-white transition shadow-sm"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </td>
            </tr>`;
        }).join('');
    }

    function simpanUser(e) {
        e.preventDefault();
        
        const id = document.getElementById('userId').value;
        const nama = document.getElementById('userNama').value.trim();
        const nip = document.getElementById('userNIP').value.trim();
        const password = document.getElementById('userPassword').value;
        const role = document.getElementById('userRole').value;
        let kecamatan = document.getElementById('userKec').value;
        const status = document.getElementById('userStatus').value;

        const checkedDesas = document.querySelectorAll('#userDesaContainer input[name="userDesaBinaan"]:checked');
        const desaArr = Array.from(checkedDesas).map(cb => cb.value.trim());
        let desa = desaArr.join(', ');

        // Validasi input
        if (password.length < 4) {
            Swal.fire('Peringatan', 'Password minimal harus 4 karakter.', 'warning');
            return;
        }

        // Pembersihan & validasi data wilayah berdasarkan role
        if (role === 'Admin_Kab') {
            kecamatan = '-';
            desa = '-';
        } else if (role === 'Admin_BPP') {
            if (kecamatan === '-' || kecamatan === '') {
                Swal.fire('Peringatan', 'Silakan pilih kecamatan untuk akun BPP.', 'warning');
                return;
            }
            if (desaArr.length === 0) {
                Swal.fire('Peringatan', 'Silakan pilih minimal satu desa binaan untuk akun BPP.', 'warning');
                return;
            }
        } else if (role === 'Penyuluh') {
            if (kecamatan === '-' || kecamatan === '') {
                Swal.fire('Peringatan', 'Silakan pilih kecamatan untuk akun PPL.', 'warning');
                return;
            }
            if (desaArr.length === 0) {
                Swal.fire('Peringatan', 'Silakan pilih minimal satu desa binaan untuk akun PPL.', 'warning');
                return;
            }
        }

        const btn = document.getElementById('btnSimpanUser');
        const oldText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Menyimpan...';

        const data = { id, nama, nip, password, role, kecamatan, desa, status };

        google.script.run.withSuccessHandler(res => {
            btn.disabled = false;
            btn.innerHTML = oldText;
            if (res.status === 'success') {
                Swal.fire({ icon: 'success', title: 'Berhasil', text: res.message, timer: 2000, showConfirmButton: false });
                tutupModalUser();
                muatDaftarUser(true);
            } else {
                Swal.fire('Gagal', res.message, 'error');
            }
        }).simpanDataUser(data);
    }

        Swal.fire({
            title: 'Hapus User?',

            icon: 'warning',

            confirmButtonColor: '#d33',

            }
        });
    }

    let allLogsData = [];

    function resetPageLogs() { currentPageLogs = 1; renderTabelLogs(); }
    function changePageLogs(dir) { currentPageLogs += dir; renderTabelLogs(); }

    function muatLogsSinkron(forceRefresh = false) {
        // Gunakan cache jika data sudah ada dan tidak dipaksa refresh
        if (allLogsData.length > 0 && !forceRefresh) {
            renderTabelLogs();
            return;
        }

        const btnIcon = document.getElementById('iconRefreshLogs');
        if (btnIcon) btnIcon.classList.add('fa-spin');
        
        const tbody = document.getElementById('tabelLogs');
        tbody.innerHTML = '<tr><td colspan="7" class="p-12 text-center text-gray-400 italic"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-green-500 mb-2 block"></i>Memuat logs...</td></tr>';
        
        google.script.run.withSuccessHandler(logs => {
            if (btnIcon) btnIcon.classList.remove('fa-spin');
            allLogsData = logs || [];
            currentPageLogs = 1;
            renderTabelLogs();
        }).withFailureHandler(err => {
            if (btnIcon) btnIcon.classList.remove('fa-spin');
            tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-red-500">Gagal memuat log: ${err.message}</td></tr>`;
        }).getLogsSinkron();

    function renderTabelLogs() {
        const tbody = document.getElementById('tabelLogs');
        const itemsPerPage = parseInt(document.getElementById('itemsPerPageLogs').value) || 10;
        const totalItems = allLogsData.length;
        const maxPage = Math.ceil(totalItems / itemsPerPage) || 1;
        if (currentPageLogs > maxPage) currentPageLogs = maxPage;
        if (currentPageLogs < 1) currentPageLogs = 1;

        const startIdx = (currentPageLogs - 1) * itemsPerPage;
        const endIdx = Math.min(startIdx + itemsPerPage, totalItems);
        const paginated = allLogsData.slice(startIdx, endIdx);

        // Update Info Pagination
        document.getElementById('infoStartLogs').innerText = totalItems > 0 ? startIdx + 1 : 0;
        document.getElementById('infoEndLogs').innerText = endIdx;
        document.getElementById('infoTotalLogs').innerText = totalItems;
        document.getElementById('btnPrevLogs').disabled = currentPageLogs <= 1;
        document.getElementById('btnNextLogs').disabled = currentPageLogs >= maxPage;

        if (!paginated || paginated.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-gray-400">Belum ada log sinkronisasi.</td></tr>';
            return;
        }

        tbody.innerHTML = paginated.map(log => {
            const statusStr = log.status ? log.status.toString() : '';
            const isSukses = statusStr.indexOf('Sukses') !== -1;
            const hasData = log.dataBerisi > 0;
            
            let rowColor = 'hover:bg-gray-50';
            if (!isSukses) rowColor = 'bg-red-50 hover:bg-red-100';
            else if (hasData) rowColor = 'bg-green-50/30 hover:bg-green-50';
            
            let statusBadge = isSukses 
                ? `<span class="bg-green-100 text-green-700 px-2 py-1 rounded text-[10px] font-bold"><i class="fa-solid fa-check mr-1"></i>Sukses</span>`
                : `<span class="bg-red-100 text-red-700 px-2 py-1 rounded text-[10px] font-bold"><i class="fa-solid fa-xmark mr-1"></i>Error</span>`;
            
            let tglLaporFormat = log.tanggalLaporan || '-';
            if (tglLaporFormat !== '-' && tglLaporFormat.length > 5) {
                tglLaporFormat = tglLaporFormat.split(' ')[0] + ' ' + tglLaporFormat.split(' ')[1] + ' ' + tglLaporFormat.split(' ')[2];
                tglLaporFormat = tglLaporFormat.replace(',', '');
                const parts = tglLaporFormat.split(' ');
                if (parts.length >= 3 && isNaN(parts[0])) {
                    tglLaporFormat = `${parts[1]} ${parts[0]} ${parts[2]}`;
                }
            }

            let waktuFormat = log.waktuSinkron || '-';
            try {
                const dt = new Date(log.waktuSinkron);
                if (log.waktuSinkron && !isNaN(dt)) {
                    waktuFormat = dt.toLocaleString('id-ID', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}).replace(/\./g, ':');
                }
            } catch(e){}

            return `
            <tr class="border-b border-gray-100 transition ${rowColor}">
                <td class="p-4 text-xs font-bold text-gray-700">${waktuFormat}</td>
                <td class="p-4 text-xs text-gray-500 font-mono">${log.idSync}</td>
                <td class="p-4 text-xs text-blue-600 font-bold">${tglLaporFormat}</td>
                <td class="p-4 text-sm font-bold text-gray-800 text-right">${log.totalTarik}</td>
                <td class="p-4 text-sm font-bold ${hasData ? 'text-green-600' : 'text-gray-400'} text-right">${log.dataBerisi}</td>
                <td class="p-4 text-sm font-bold text-gray-400 text-right">${log.dataNihil}</td>
                <td class="p-4 text-center">${statusBadge}</td>
            </tr>`;
        }).join('');
    }

        // 5. Admin User Modal
        const modalUser = document.getElementById('modalUser');
        if (modalUser && !modalUser.classList.contains('hidden')) {
            _tutupModalUserDOM();
            return;
        }

        // 6. Target Modals
        const modalFormTarget = document.getElementById('modalFormTarget');
        if (modalFormTarget && !modalFormTarget.classList.contains('hidden')) {
            tutupFormTarget();
            return;
        }
        const modalTargetBulan = document.getElementById('modalTargetBulan');
        if (modalTargetBulan && !modalTargetBulan.classList.contains('hidden')) {
            tutupModalTargetBulan();
            return;
        }
    });

    // =========================================================================
    // MODUL: TARGET KOMODITAS BULANAN (ADMIN)
    // =========================================================================

    const NAMA_BULAN = ['', 'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const KOMODITAS_LIST = ['Padi', 'Jagung', 'Ubi Kayu'];

    let targetKomoditasAktif = 'Padi';
    let targetBulanAktif = null;
    let targetTabLevel = 'Kabupaten';
    let cacheTargetBulanan = {};  // { [bulan]: { [komoditas]: { data, ts } } }
    let cacheTargetSemua = {};    // { [komoditas]: { data, ts } } — shared by Admin/BPP/PPL
    let jenisLTTCache = {};       // { [komoditas]: [...] } — opsi jenis LTT
    let targetSearchQuery = '';
    let targetPageSize = 10;
    let targetCurrentPage = 1;

    const TARGET_CACHE_TTL = 5 * 60 * 1000; // 5 menit

    function _isCacheValid(entry) {
        return !!(entry && entry.ts && (Date.now() - entry.ts) < TARGET_CACHE_TTL);
    }

    function _invalidasiCacheTarget(komoditas, bulan) {
        delete cacheTargetSemua[komoditas];
        if (bulan && cacheTargetBulanan[bulan]) {
            delete cacheTargetBulanan[bulan][komoditas];
        }
    }

    function setTargetKomoditas(komoditas) {
        targetKomoditasAktif = komoditas;
        KOMODITAS_LIST.forEach(k => {
            const btn = document.getElementById('tgtKom-' + k);
            if (!btn) return;
            const isActive = k === komoditas;
            btn.className = `px-4 py-2 text-sm font-bold rounded-lg transition-all ${isActive ? 'bg-green-600 text-white' : 'text-gray-500 hover:bg-white'}`;
        });
        muatTabelTargetBulan();
    }

    function muatTabelTargetBulan(forceRefresh = false) {
        const tbody = document.getElementById('tabelTargetBulan');
        if (!tbody) return;

        const cacheEntry = cacheTargetSemua[targetKomoditasAktif];
        if (!forceRefresh && _isCacheValid(cacheEntry)) {
            renderTabelTargetBulan(cacheEntry.data);
            return;
        }

        tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-400">
            <i class="fa-solid fa-circle-notch fa-spin text-2xl text-green-500 mb-2 block"></i>Memuat...</td></tr>`;

        const komoditas = targetKomoditasAktif;
        google.script.run
            .withSuccessHandler(data => {
                cacheTargetSemua[komoditas] = { data: data, ts: Date.now() };
                if (targetKomoditasAktif === komoditas) renderTabelTargetBulan(data);
            })
            .withFailureHandler(err => {
                if (targetKomoditasAktif === komoditas) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-red-400">
                        <i class="fa-solid fa-circle-exclamation mr-2"></i>${err.message}</td></tr>`;
                }
            })
            .ambilTargetBulanan({ bulan: 0, komoditas: komoditas });
    }

    function renderTabelTargetBulan(semua) {
        const perBulan = {};
        const allKec = new Set();
        const allDesa = new Set();

        (semua || []).forEach(t => {
            const b = t.bulan;
            if (!perBulan[b]) perBulan[b] = { kab: 0, kecCount: 0, kecTotal: 0, desaCount: 0, desaTotal: 0 };
            if (t.level === 'Kabupaten') {
                perBulan[b].kab += t.totalTarget;
            } else if (t.level === 'Kecamatan') {
                allKec.add(t.namaGeografi);
                perBulan[b].kecCount++;
                perBulan[b].kecTotal += t.totalTarget;
            } else if (t.level === 'Desa') {
                allDesa.add((t.kecamatan || '') + '|' + t.namaGeografi);
                perBulan[b].desaCount++;
                perBulan[b].desaTotal += t.totalTarget;
            }
        });

        const totalKec  = allKec.size;
        const totalDesa = allDesa.size;
        const fmtHa = v => v.toLocaleString('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        const deficitLabel = (total, kab) => {
            if (kab <= 0) return '';
            const selisih = kab - total;
            if (selisih < -0.005) return `<div class="text-xs text-blue-600 font-semibold mt-0.5">Lebih ${fmtHa(Math.abs(selisih))} Ha</div>`;
            if (selisih > 0.005) return `<div class="text-xs text-orange-500 font-semibold mt-0.5">Kekurangan ${fmtHa(selisih)} Ha</div>`;
            return `<div class="text-xs text-green-600 font-semibold mt-0.5">Target Sesuai</div>`;
        };

        const tbody = document.getElementById('tabelTargetBulan');
        let html = '';
        for (let b = 1; b <= 12; b++) {
            const d = perBulan[b] || { kab: 0, kecCount: 0, kecTotal: 0, desaCount: 0, desaTotal: 0 };
            const kabDisplay = d.kab > 0
                ? `<span class="font-bold text-gray-800">${fmtHa(d.kab)} Ha</span>`
                : `<span class="text-gray-300">—</span>`;
            const kecDisplay = totalKec > 0
                ? `${d.kecTotal > 0 ? `<span class="font-bold text-gray-800">${fmtHa(d.kecTotal)} Ha</span>` : '<span class="text-gray-300">—</span>'}${deficitLabel(d.kecTotal, d.kab)}`
                : `<span class="text-gray-300">—</span>`;
            const desaDisplay = totalDesa > 0
                ? `${d.desaTotal > 0 ? `<span class="font-bold text-gray-800">${fmtHa(d.desaTotal)} Ha</span>` : '<span class="text-gray-300">—</span>'}${deficitLabel(d.desaTotal, d.kab)}`
                : `<span class="text-gray-300">—</span>`;

            html += `
            <tr class="border-b border-gray-100 hover:bg-green-50/40 transition-colors cursor-pointer" onclick="bukaDetailTargetBulan(${b})">
                <td class="p-4">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-xl bg-green-100 text-green-700 flex items-center justify-center font-bold text-sm">${b}</div>
                        <span class="font-semibold text-gray-800">${NAMA_BULAN[b]}</span>
                    </div>
                </td>
                <td class="p-4 text-center text-sm">${kabDisplay}</td>
                <td class="p-4 text-center text-sm">${kecDisplay}</td>
                <td class="p-4 text-center text-sm">${desaDisplay}</td>
                <td class="p-4 text-center">
                    <button onclick="event.stopPropagation(); bukaDetailTargetBulan(${b})"
                        class="px-3 py-1.5 bg-white border border-green-200 text-green-700 rounded-lg text-xs font-bold hover:bg-green-50 transition">
                        <i class="fa-solid fa-eye mr-1"></i>Detail
                    </button>
                </td>
            </tr>`;
        }
        tbody.innerHTML = html;
    }

    function bukaDetailTargetBulan(bulan) {
        targetBulanAktif = bulan;
        targetTabLevel = 'Kabupaten';

        document.getElementById('modalTargetBulanTitle').textContent = `Detail Target — ${NAMA_BULAN[bulan]}`;
        document.getElementById('modalTargetBulanSubtitle').textContent = `Komoditas: ${targetKomoditasAktif}`;

        document.getElementById('sectionTarget').classList.add('hidden');
        document.getElementById('sectionDetailTarget').classList.remove('hidden');

        setTabDetailTarget('Kabupaten');
        muatDetailTargetBulan();
    }

    function tutupModalTargetBulan() {
        document.getElementById('sectionDetailTarget').classList.add('hidden');
        document.getElementById('sectionTarget').classList.remove('hidden');
    }

    function setTabDetailTarget(level) {
        targetTabLevel = level;
        const tabIdMap = { Kabupaten: 'tabTgtKab', Kecamatan: 'tabTgtKec', Desa: 'tabTgtDesa' };
        ['Kabupaten', 'Kecamatan', 'Desa'].forEach(l => {
            const btn = document.getElementById(tabIdMap[l]);
            if (!btn) return;
            const isActive = l === level;
            btn.className = `px-5 py-2.5 text-sm font-bold border-b-2 transition ${isActive ? 'border-green-600 text-green-700' : 'border-transparent text-gray-500 hover:text-green-600'}`;
        });

        const labels = { Kabupaten: 'Target Kabupaten / Kota', Kecamatan: 'Target Kecamatan', Desa: 'Target Desa / Kelurahan' };
        document.getElementById('labelTabDetailTarget').textContent = labels[level] || '';
        
        const btnTambah = document.getElementById('btnTambahTarget');
        if (btnTambah) {
            btnTambah.style.display = (level === 'Kecamatan') ? 'none' : 'flex';
        }

        targetSearchQuery = '';
        targetCurrentPage = 1;
        const searchEl = document.getElementById('targetDesaSearch');
        if (searchEl) searchEl.value = '';

        renderDetailTargetTable();
    }

    function muatDetailTargetBulan(forceRefresh = false) {
        const tbody = document.getElementById('tabelDetailTarget');
        const bulan = targetBulanAktif;
        const komoditas = targetKomoditasAktif;

        const cacheEntry = cacheTargetBulanan[bulan] && cacheTargetBulanan[bulan][komoditas];
        if (!forceRefresh && _isCacheValid(cacheEntry)) {
            renderDetailTargetTable();
            renderStatRowTarget(cacheEntry.data);
            return;
        }

        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-400">
            <i class="fa-solid fa-circle-notch fa-spin text-xl text-green-500 mb-2 block"></i>Memuat...</td></tr>`;

        google.script.run
            .withSuccessHandler(data => {
                if (!cacheTargetBulanan[bulan]) cacheTargetBulanan[bulan] = {};
                cacheTargetBulanan[bulan][komoditas] = { data: data, ts: Date.now() };
                if (targetBulanAktif === bulan && targetKomoditasAktif === komoditas) {
                    renderDetailTargetTable();
                    renderStatRowTarget(data);
                }
            })
            .withFailureHandler(err => {
                if (targetBulanAktif === bulan && targetKomoditasAktif === komoditas) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-400">${err.message}</td></tr>`;
                }
            })
            .ambilTargetBulanan({ bulan: bulan, komoditas: komoditas });
    }

    function renderStatRowTarget(data) {
        const kab  = (data || []).filter(t => t.level === 'Kabupaten').reduce((s, t) => s + t.totalTarget, 0);
        const kec  = (data || []).filter(t => t.level === 'Kecamatan').reduce((s, t) => s + t.totalTarget, 0);
        const desa = (data || []).filter(t => t.level === 'Desa').reduce((s, t) => s + t.totalTarget, 0);
        const fmt  = v => v.toLocaleString('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        const selisihKec  = kab - kec;
        const selisihDesa = kab - desa;
        const badgeSelisih = (selisih) => {
            if (selisih === 0) return `<span class="text-xs font-bold text-green-600 bg-green-100 px-2 py-0.5 rounded-full">✓ Sesuai Target</span>`;
            if (selisih > 0)  return `<span class="text-xs font-bold text-orange-600 bg-orange-100 px-2 py-0.5 rounded-full">Kurang ${fmt(selisih)} Ha</span>`;
            return `<span class="text-xs font-bold text-blue-600 bg-blue-100 px-2 py-0.5 rounded-full">Lebih ${fmt(Math.abs(selisih))} Ha</span>`;
        };
        const el = document.getElementById('statRowTargetBulan');
        if (!el) return;
        el.innerHTML = `
            <div class="bg-blue-50 border border-blue-100 rounded-xl sm:rounded-2xl p-2.5 sm:p-4">
                <div class="flex items-center gap-1 sm:gap-2 mb-1">
                    <i class="fa-solid fa-city text-blue-500 text-xs sm:text-sm"></i>
                    <span class="text-[9px] sm:text-xs font-bold text-blue-500 uppercase leading-tight">Target Kab</span>
                </div>
                <p class="text-base sm:text-2xl font-black text-gray-800">${fmt(kab)} <span class="text-xs sm:text-sm font-semibold text-gray-400">Ha</span></p>
            </div>
            <div class="bg-green-50 border border-green-100 rounded-xl sm:rounded-2xl p-2.5 sm:p-4">
                <div class="flex items-center gap-1 sm:gap-2 mb-1">
                    <i class="fa-solid fa-map-location-dot text-green-500 text-xs sm:text-sm"></i>
                    <span class="text-[9px] sm:text-xs font-bold text-green-500 uppercase leading-tight">Total Kec</span>
                </div>
                <p class="text-base sm:text-2xl font-black text-gray-800">${fmt(kec)} <span class="text-xs sm:text-sm font-semibold text-gray-400">Ha</span></p>
                <div class="mt-1">${badgeSelisih(selisihKec)}</div>
            </div>
            <div class="bg-amber-50 border border-amber-100 rounded-xl sm:rounded-2xl p-2.5 sm:p-4">
                <div class="flex items-center gap-1 sm:gap-2 mb-1">
                    <i class="fa-solid fa-house text-amber-500 text-xs sm:text-sm"></i>
                    <span class="text-[9px] sm:text-xs font-bold text-amber-500 uppercase leading-tight">Total Desa</span>
                </div>
                <p class="text-base sm:text-2xl font-black text-gray-800">${fmt(desa)} <span class="text-xs sm:text-sm font-semibold text-gray-400">Ha</span></p>
                <div class="mt-1">${badgeSelisih(selisihDesa)}</div>
            </div>`;
    }

    function renderDetailTargetTable() {
        const cacheEntry = cacheTargetBulanan[targetBulanAktif] && cacheTargetBulanan[targetBulanAktif][targetKomoditasAktif];
        const cached = (cacheEntry && Array.isArray(cacheEntry.data)) ? cacheEntry.data : [];
        let filtered = cached.filter(t => t.level === targetTabLevel);
        if (typeof userAktif !== 'undefined' && userAktif && userAktif.role === 'Admin_BPP') {
            const bppKec = userAktif.kecamatan.toLowerCase();
            filtered = filtered.filter(t => {
                if (t.level === 'Kecamatan') return t.namaGeografi.toLowerCase() === bppKec;
                if (t.level === 'Desa') return t.kecamatan && t.kecamatan.toLowerCase() === bppKec;
                return false;
            });
        }

        const isDesaTab = targetTabLevel === 'Desa';
        const tbody = document.getElementById('tabelDetailTarget');
        const fmt = v => v.toLocaleString('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 2 });

        const btnTambah = document.getElementById('btnTambahTarget');
        if (btnTambah && targetTabLevel === 'Kabupaten') {
            btnTambah.style.display = filtered.length > 0 ? 'none' : 'flex';
        }

        const searchContainer = document.getElementById('targetDesaSearchContainer');
        if (searchContainer) searchContainer.classList.toggle('hidden', !isDesaTab);

        let displayData = filtered;
        if (isDesaTab && targetSearchQuery) {
            const q = targetSearchQuery.toLowerCase();
            displayData = filtered.filter(t =>
                (t.namaGeografi || '').toLowerCase().includes(q) ||
                (t.kecamatan || '').toLowerCase().includes(q)
            );
        }

        if (displayData.length === 0) {
            const tambahBtn = targetTabLevel !== 'Kecamatan'
                ? `<br><button onclick="bukaFormTarget(null)" class="mt-3 px-4 py-2 bg-green-600 text-white rounded-xl text-xs font-bold hover:bg-green-700"><i class="fa-solid fa-plus mr-1"></i>Tambah Sekarang</button>`
                : '';
            const emptyMsg = isDesaTab && targetSearchQuery ? 'Tidak ada desa yang cocok.' : 'Belum ada target untuk level ini.';
            tbody.innerHTML = `<tr><td colspan="6" class="p-10 text-center text-gray-400 italic">${emptyMsg}${tambahBtn}</td></tr>`;
            renderTargetPagination(0);
            return;
        }

        let paginatedData = displayData;
        if (isDesaTab && targetPageSize > 0) {
            const start = (targetCurrentPage - 1) * targetPageSize;
            paginatedData = displayData.slice(start, start + targetPageSize);
        }

        const rows = paginatedData.map(t => {
            const rincian = (t.details || []).map(d =>
                `<span class="inline-flex items-center gap-1 px-2 py-0.5 bg-green-50 text-green-700 rounded-full text-xs font-semibold">${d.jenisLtt}: ${fmt(d.luas)} Ha</span>`
            ).join(' ');

            const kecCell = isDesaTab
                ? `<td class="p-3 text-sm text-gray-500">${t.kecamatan || '—'}</td>`
                : `<td class="p-3 text-center text-gray-300">—</td>`;

            const isKecamatan = targetTabLevel === 'Kecamatan';
            const actionHTML = isKecamatan ? `<span class="text-gray-300">—</span>` : `
                    <div class="flex items-center justify-center">
                        <button onclick="bukaFormTarget(${JSON.stringify(t).replace(/"/g, '&quot;')})"
                            class="p-1.5 text-blue-500 hover:bg-blue-50 rounded-lg transition" title="Edit">
                            <i class="fa-solid fa-pen text-xs"></i>
                        </button>
                    </div>`;

            return `<tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                <td class="p-3 font-semibold text-gray-800">${t.namaGeografi}</td>
                ${kecCell}
                <td class="p-3 text-right font-bold text-green-700">${fmt(t.totalTarget)}</td>
                <td class="p-3 text-xs">${rincian || '<span class="text-gray-300">—</span>'}</td>
                <td class="p-3 text-xs text-gray-500">${t.pembuat || '—'}</td>
                <td class="p-3 text-center">${actionHTML}</td>
            </tr>`;
        }).join('');

        tbody.innerHTML = rows;
        renderTargetPagination(displayData.length);
    }

    function renderTargetPagination(totalFiltered) {
        const container = document.getElementById('targetPaginationContainer');
        if (!container) return;
        const isDesaTab = targetTabLevel === 'Desa';
        container.classList.toggle('hidden', !isDesaTab);
        if (!isDesaTab) return;

        const sizes = [5, 10, 50, 0];
        const sizeHtml = sizes.map(s => {
            const label = s === 0 ? 'Semua' : s;
            const isActive = targetPageSize === s;
            return `<button onclick="setTargetPageSize(${s})" class="px-2.5 py-1 text-xs font-bold rounded-lg transition ${isActive ? 'bg-green-600 text-white' : 'bg-white border border-gray-200 text-gray-500 hover:bg-gray-50'}">${label}</button>`;
        }).join('');

        const totalPages = targetPageSize > 0 ? Math.ceil(totalFiltered / targetPageSize) : 1;
        let navHtml = '';
        if (targetPageSize > 0 && totalPages > 1) {
            const prevDis = targetCurrentPage <= 1 ? 'disabled' : '';
            const nextDis = targetCurrentPage >= totalPages ? 'disabled' : '';
            navHtml = `<div class="flex items-center gap-1">
                <button onclick="setTargetPage(${targetCurrentPage - 1})" ${prevDis}
                    class="px-2 py-1 text-xs rounded-lg border border-gray-200 text-gray-500 hover:bg-gray-50 disabled:opacity-30">
                    <i class="fa-solid fa-chevron-left"></i></button>
                <span class="text-xs text-gray-500 px-1">${targetCurrentPage} / ${totalPages}</span>
                <button onclick="setTargetPage(${targetCurrentPage + 1})" ${nextDis}
                    class="px-2 py-1 text-xs rounded-lg border border-gray-200 text-gray-500 hover:bg-gray-50 disabled:opacity-30">
                    <i class="fa-solid fa-chevron-right"></i></button>
            </div>`;
        }

        const start = targetPageSize > 0 ? (targetCurrentPage - 1) * targetPageSize + 1 : 1;
        const end   = targetPageSize > 0 ? Math.min(targetCurrentPage * targetPageSize, totalFiltered) : totalFiltered;
        const infoHtml = `<span class="text-xs text-gray-400">${start}–${end} dari ${totalFiltered}</span>`;

        container.innerHTML = `<div class="flex items-center gap-1.5">${sizeHtml}</div>${infoHtml}${navHtml}`;
    }

    function onTargetSearch(val) {
        targetSearchQuery = val;
        targetCurrentPage = 1;
        renderDetailTargetTable();
    }

    function setTargetPageSize(size) {
        targetPageSize = size;
        targetCurrentPage = 1;
        renderDetailTargetTable();
    }

    function setTargetPage(page) {
        targetCurrentPage = Math.max(1, page);
        renderDetailTargetTable();
    }

    // ---- Form Target CRUD ----

    let jenisLTTOptions = [];

    let _geoCache = null;

    function bukaFormTarget(targetData) {
        const isEdit = !!targetData;
        document.getElementById('modalFormTargetTitle').textContent = isEdit ? 'Edit Target' : 'Tambah Target';
        document.getElementById('tgtIdTarget').value = isEdit ? targetData.id : '';
        document.getElementById('tgtBulan').value = targetBulanAktif;
        document.getElementById('tgtLevel').value = targetTabLevel;
        document.getElementById('tgtKomoditas').value = targetKomoditasAktif;

        document.getElementById('tgtKomoditasDisplay').textContent = targetKomoditasAktif;
        document.getElementById('tgtBulanDisplay').textContent = NAMA_BULAN[targetBulanAktif];
        document.getElementById('tgtTotalTarget').value = isEdit ? targetData.totalTarget : '';

        // Wilayah: Kabupaten → readonly, Kecamatan/Desa → dropdown
        const wilayahDisplay = document.getElementById('tgtWilayahDisplay');
        const wilayahWrapper = document.getElementById('tgtWilayahSelectWrapper');
        const desaSel = document.getElementById('tgtDesaSelect');

        if (targetTabLevel === 'Kabupaten') {
            wilayahDisplay.classList.remove('hidden');
            wilayahWrapper.classList.add('hidden');
            wilayahDisplay.textContent = isEdit ? targetData.namaGeografi : (typeof userAktif !== 'undefined' && userAktif.kabupaten ? userAktif.kabupaten : 'Kabupaten Way Kanan');
        } else {
            wilayahDisplay.classList.add('hidden');
            wilayahWrapper.classList.remove('hidden');
            desaSel.classList.add('hidden');

            const initDropdown = (geo) => {
                _geoCache = geo;
                const kecSel = document.getElementById('tgtKecamatanFilter');
                
                let allowedKec = geo.kecamatan;
                const isBpp = (typeof userAktif !== 'undefined' && userAktif && userAktif.role === 'Admin_BPP');
                if (isBpp) {
                    allowedKec = geo.kecamatan.filter(k => k.toLowerCase() === userAktif.kecamatan.toLowerCase());
                }
                
                kecSel.innerHTML = '<option value="">— Pilih Kecamatan —</option>' +
                    allowedKec.map(k => `<option value="${k}">${k}</option>`).join('');

                if (isBpp) {
                    kecSel.value = userAktif.kecamatan;
                    if (targetTabLevel === 'Desa') {
                        desaSel.classList.remove('hidden');
                        populateDesaSelect(userAktif.kecamatan, isEdit ? targetData.namaGeografi : '');
                    }
                } else {
                    if (targetTabLevel === 'Kecamatan') {
                        if (isEdit) kecSel.value = targetData.namaGeografi;
                    } else {
                        desaSel.classList.remove('hidden');
                        if (isEdit) {
                            for (const [kec, desas] of Object.entries(geo.desaByKec)) {
                                if (desas.indexOf(targetData.namaGeografi) !== -1) {
                                    kecSel.value = kec;
                                    populateDesaSelect(kec, targetData.namaGeografi);
                                    break;
                                }
                            }
                        }
                    }
                }
            };

            if (_geoCache) {
                initDropdown(_geoCache);
            } else {
                document.getElementById('tgtKecamatanFilter').innerHTML = '<option value="">— Memuat... —</option>';
                google.script.run
                    .withSuccessHandler(initDropdown)
                    .withFailureHandler(() => {
                        document.getElementById('tgtKecamatanFilter').innerHTML = '<option value="">— Gagal memuat —</option>';
                    })
                    .getSemuaGeografi();
            }
        }

        // Desa-specific fields
        const desaSection = document.getElementById('sectionDesaFields');
        if (targetTabLevel === 'Desa') {
            desaSection.classList.remove('hidden');
            document.getElementById('tgtIPEksisting').value = isEdit ? (targetData.ipEksisting || '') : '';
            document.getElementById('tgtLuasBaku').value = isEdit ? (targetData.luasBakuSawah || '') : '';
            document.getElementById('tgtStandingCrop').value = isEdit ? (targetData.luasStandingCrop || '') : '';
        } else {
            desaSection.classList.add('hidden');
        }

        // Jenis LTT section (Padi only)
        const jenisSection = document.getElementById('sectionJenisLTT');
        const container = document.getElementById('containerJenisLTT');
        container.innerHTML = '';

        if (targetKomoditasAktif === 'Padi') {
            jenisSection.classList.remove('hidden');

                jenisLTTOptions = list;
                if (isEdit && targetData.details && targetData.details.length > 0) {
                    targetData.details.forEach(d => tambahBarisJenisLTT(d.jenisLtt, d.luas));
                }
            };
            if (jenisLTTCache['Padi']) {
                _populateJenisLTT(jenisLTTCache['Padi']);
            } else {
                google.script.run
                    .withSuccessHandler(list => {
                        jenisLTTCache['Padi'] = list;
                        _populateJenisLTT(list);
                    })
                    .withFailureHandler(() => { /* jenis LTT gagal dimuat, biarkan kosong */ })
                    .getJenisLTT('Padi');

        const container = document.getElementById('containerJenisLTT');

        const optionsHtml = jenisLTTOptions.map(j =>

    function hitungTotalTargetOtomatis() {
        const container = document.getElementById('containerJenisLTT');
        if (!container) return;
        let total = 0;
        container.querySelectorAll('[name="jenisLttLuas"]').forEach(inp => {
            total += parseFloat(inp.value) || 0;
        });
        if (total > 0) {
            document.getElementById('tgtTotalTarget').value = total.toFixed(2);
        }

    function simpanFormTarget(event) {
        event.preventDefault();
        const btn = document.getElementById('btnSimpanFormTarget');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Menyimpan...';

        const details = [];
        const container = document.getElementById('containerJenisLTT');
        container.querySelectorAll('div').forEach(row => {
            const jenis = row.querySelector('[name="jenisLttNama"]')?.value;
            const luas  = parseFloat(row.querySelector('[name="jenisLttLuas"]')?.value) || 0;
            if (jenis) details.push({ jenisLtt: jenis, luas });
        });

        const level = document.getElementById('tgtLevel').value;
        let namaGeo;
        let kecamatanVal = '';
        if (level === 'Kabupaten') {
            namaGeo = document.getElementById('tgtWilayahDisplay').textContent.trim();
        } else if (level === 'Kecamatan') {
            namaGeo = document.getElementById('tgtKecamatanFilter').value;
            kecamatanVal = namaGeo;
        } else {
            namaGeo = document.getElementById('tgtDesaSelect').value;
            kecamatanVal = document.getElementById('tgtKecamatanFilter').value;
        }
        if (!namaGeo) {
            btn.disabled = false;
            btn.innerHTML = 'Simpan Target';
            Swal.fire('Peringatan', 'Pilih wilayah terlebih dahulu.', 'warning');
            return;
        }

        const formData = {
            id:           document.getElementById('tgtIdTarget').value,
            bulan:        parseInt(document.getElementById('tgtBulan').value),
            level:        document.getElementById('tgtLevel').value,
            namaGeografi: namaGeo,
            kecamatan:    kecamatanVal,
            komoditas:    document.getElementById('tgtKomoditas').value,
            totalTarget:  parseFloat(document.getElementById('tgtTotalTarget').value) || 0,
            ipEksisting:  parseFloat(document.getElementById('tgtIPEksisting').value) || 0,
            luasBakuSawah: parseFloat(document.getElementById('tgtLuasBaku').value) || 0,
            luasStandingCrop: parseFloat(document.getElementById('tgtStandingCrop').value) || 0,
            pembuat:      (typeof userAktif !== 'undefined' ? userAktif.nama : 'Admin'),
            details:      details
        };

        google.script.run
            .withSuccessHandler(res => {
                btn.disabled = false;
                btn.innerHTML = 'Simpan Target';
                if (res.status === 'success') {
                    tutupFormTarget();
                    _invalidasiCacheTarget(targetKomoditasAktif, targetBulanAktif);
                    muatDetailTargetBulan(true);
                    muatTabelTargetBulan(true);
                    Swal.fire({ icon: 'success', title: 'Berhasil!', text: 'Target berhasil disimpan.', timer: 2000, showConfirmButton: false });
                } else {
                    Swal.fire('Gagal', res.message, 'error');
                }
            })
            .withFailureHandler(err => {
                btn.disabled = false;
                btn.innerHTML = 'Simpan Target';
                Swal.fire('Error', err.message, 'error');
            })
            .simpanTargetBulanan(formData);
    }

    function hapusTargetItem(idTarget) {
        Swal.fire({
            title: 'Hapus Target?',
            text: 'Tindakan ini akan menghapus target ini dan memperbarui sinkronisasi secara otomatis.',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Ya, Hapus!',
            cancelButtonText: 'Batal',
            confirmButtonColor: '#dc2626'
        }).then(result => {
            if (!result.isConfirmed) return;
            google.script.run
                .withSuccessHandler(res => {
                    if (res.status === 'success') {
                        _invalidasiCacheTarget(targetKomoditasAktif, targetBulanAktif);
                        muatDetailTargetBulan(true);
                        muatTabelTargetBulan(true);

                        Swal.fire('Gagal', res.message, 'error');

                .hapusTargetBulanan(idTarget);
        });

        const tbody = document.getElementById('tabelBppTargetBulan');

        const komoditas = bppTargetKomoditasAktif;
        const cacheEntry = cacheTargetSemua[komoditas];

            renderBppTargetBulan(cacheEntry.data);

                if (bppTargetKomoditasAktif === komoditas) renderBppTargetBulan(data);
            })
            .withFailureHandler(err => {

    function renderBppTargetBulan(semua) {
        const kecamatan = (typeof userAktif !== 'undefined' && userAktif.kecamatan) ? userAktif.kecamatan.toLowerCase() : '';

        const perBulan = {};
        (semua || []).forEach(t => {

            if (!perBulan[b]) perBulan[b] = { kec: 0, desa: 0, kecId: null };

                perBulan[b].kec += t.totalTarget;
                perBulan[b].kecId = t.id;

            }
        });

        const tbody = document.getElementById('tabelBppTargetBulan');

        const NAMA_BULAN_BPP = ['', 'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',

                    <div class="flex items-center gap-2">

                        <span class="font-semibold text-gray-800 text-sm">${NAMA_BULAN_BPP[b]}</span>
                    </div>
                </td>
                <td class="p-3 text-center text-sm font-semibold text-gray-700">${fmt(d.kec)}</td>
                <td class="p-3 text-center text-sm font-semibold text-gray-700">${fmt(d.desa)}</td>

                        <i class="fa-solid fa-eye mr-1"></i>Detail

            </tr>`;

        tbody.innerHTML = html;

    // =========================================================================
    // LAPORAN LTT — CLIENT LOGIC
    // =========================================================================

    let _laporanLTTData = [];      // Data asli dari GAS
    let _laporanLTTFiltered = [];  // Setelah live search
    let _laporanLTTPage = 1;       // Halaman saat ini
    let _laporanLTTPageSize = 10;  // Jumlah data per halaman
    let _laporanLTTLoaded = false; // Flag agar tidak reload saat navigasi ulang
    let _laporanLTTSort = { field: 'timestamp', dir: 'desc' }; // State sorting
    let _laporanLTTReqId = 0;      // ID request untuk abaikan response stale

    /** Muat data laporan LTT dari GAS */
    function muatLaporanLTT(force = false) {
        const iconRefresh = document.getElementById('iconRefreshLaporan');
        if (iconRefresh) iconRefresh.classList.add('fa-spin');

        document.getElementById('tbodyLaporanLTT').innerHTML =
            '<tr><td colspan="13" class="p-12 text-center text-gray-400 italic"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-green-500 mb-3 block"></i>Memuat data laporan...</td></tr>';

        // Set tanggal ke hari ini jika belum diisi
        const tglEl = document.getElementById('filterTglLaporan');
        if (tglEl && !tglEl.value) {
            const now = new Date();
            tglEl.value = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
        }

        // Selalu baca semua filter (tanggal wajib ada)
        const params = {};
        const tgl  = tglEl ? tglEl.value : '';
        const kom  = document.getElementById('filterKomLaporan').value;
        const kec  = document.getElementById('filterKecLaporan').value;
        const desa = (document.getElementById('filterDesaLaporan').value || '').trim();
        if (tgl)  params.tanggal   = tgl;
        params.komoditas = kom || 'Padi';
        if (kec)  params.kecamatan = kec;
        if (desa) params.desa      = desa;

        // Juga muat dropdown kecamatan kalau belum diisi
        _muatDropdownKecLaporan();

        const myReqId = ++_laporanLTTReqId;

        google.script.run
            .withSuccessHandler(function(res) {
                if (myReqId !== _laporanLTTReqId) return; // abaikan response lama
                if (iconRefresh) iconRefresh.classList.remove('fa-spin');
                if (res.status !== 'success') {
                    document.getElementById('tbodyLaporanLTT').innerHTML =
                        '<tr><td colspan="13" class="p-10 text-center text-red-400"><i class="fa-solid fa-triangle-exclamation mr-2"></i>' + (res.message || 'Gagal memuat data') + '</td></tr>';
                    return;
                }
                _laporanLTTData = res.data || [];
                _laporanLTTLoaded = true;
                _laporanLTTPage = 1;
                _updateStat();
                _applySearchAndRender();
            })
            .withFailureHandler(function(err) {
                if (myReqId !== _laporanLTTReqId) return;
                if (iconRefresh) iconRefresh.classList.remove('fa-spin');
                document.getElementById('tbodyLaporanLTT').innerHTML =
                    '<tr><td colspan="13" class="p-10 text-center text-red-400"><i class="fa-solid fa-triangle-exclamation mr-2"></i>Error: ' + (err.message || err) + '</td></tr>';
            })
            .getLaporanLTT(params);
    }

    /** Muat dropdown kecamatan sekali saja */
    let _kecLaporanLoaded = false;
    function _muatDropdownKecLaporan() {
        if (_kecLaporanLoaded) return;
        google.script.run
            .withSuccessHandler(function(list) {
                _kecLaporanLoaded = true;
                const sel = document.getElementById('filterKecLaporan');
                if (!sel) return;
                const current = sel.value;
                sel.innerHTML = '<option value="">Semua Kecamatan</option>';
                (list || []).forEach(k => {
                    sel.innerHTML += `<option value="${k}" ${k === current ? 'selected' : ''}>${k}</option>`;
                });
            })
            .withFailureHandler(function() { /* gagal tidak masalah */ })
            .getKecamatanLaporan();
    }

    /** Saat kecamatan dipilih: muat dropdown desa sesuai kecamatan */
    function onKecLaporanChange() {
        const kec = document.getElementById('filterKecLaporan').value;
        const selDesa = document.getElementById('filterDesaLaporan');
        if (!kec) {
            selDesa.disabled = true;
            selDesa.innerHTML = '<option value="">— Pilih Kecamatan dulu —</option>';
            return;
        }
        selDesa.disabled = true;
        selDesa.innerHTML = '<option value="">Memuat desa...</option>';
        google.script.run
            .withSuccessHandler(function(list) {
                selDesa.innerHTML = '<option value="">Semua Desa</option>';
                (list || []).forEach(d => {
                    selDesa.innerHTML += `<option value="${d}">${d}</option>`;
                });
                selDesa.disabled = false;
            })
            .withFailureHandler(function() {
                selDesa.innerHTML = '<option value="">Semua Desa</option>';
                selDesa.disabled = false;
            })
            .getDesaLaporan(kec);
    }

    /** Terapkan filter dari form filter bar lalu fetch ulang ke GAS */
    function terapkanFilterLaporan() {
        _laporanLTTLoaded = false;
        muatLaporanLTT(true);
    }

    /** Reset filter ke default */
    function resetFilterLaporan() {
        const now = new Date();
        document.getElementById('filterTglLaporan').value = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
        document.getElementById('filterKomLaporan').value = '';
        document.getElementById('filterKecLaporan').value = '';
        const selDesa = document.getElementById('filterDesaLaporan');
        selDesa.innerHTML = '<option value="">— Pilih Kecamatan dulu —</option>';
        selDesa.disabled = true;
        document.getElementById('searchLaporan').value = '';
        _laporanLTTLoaded = false;
        muatLaporanLTT();
    }

    /** Live search handler */
    function onSearchLaporan() {
        _laporanLTTPage = 1;
        _applySearchAndRender();
    }

    /** Set ukuran halaman */
    function setPageSizeLaporan() {
        const val = parseInt(document.getElementById('pageSizeLaporan').value);
        _laporanLTTPageSize = isNaN(val) ? 10 : val;
        _laporanLTTPage = 1;
        _renderTabelLaporan(_laporanLTTFiltered);
    }

    /** Sorting kolom */
    function sortLaporan(field) {
        if (_laporanLTTSort.field === field) {
            _laporanLTTSort.dir = _laporanLTTSort.dir === 'asc' ? 'desc' : 'asc';
        } else {
            _laporanLTTSort.field = field;
            _laporanLTTSort.dir = 'asc';
        }
        // Update icon sort
        ['timestamp','pelapor','kecamatan','desa','luas_tanam','luas_panen'].forEach(f => {
            const icon = document.getElementById('sortIcon-' + f);
            if (!icon) return;
            if (f === _laporanLTTSort.field) {
                icon.className = 'fa-solid ml-1 ' + (_laporanLTTSort.dir === 'asc' ? 'fa-sort-up text-green-600' : 'fa-sort-down text-green-600');
            } else {
                icon.className = 'fa-solid fa-sort text-gray-300 ml-1';
            }
        });
        _laporanLTTPage = 1;
        _applySearchAndRender();
    }

    /** Terapkan live search ke data dan render */
    function _applySearchAndRender() {
        const q = (document.getElementById('searchLaporan').value || '').toLowerCase().trim();
        if (!q) {
            _laporanLTTFiltered = [..._laporanLTTData];
        } else {
            _laporanLTTFiltered = _laporanLTTData.filter(r =>
                r.pelapor.toLowerCase().includes(q) ||
                r.kecamatan.toLowerCase().includes(q) ||
                r.desa.toLowerCase().includes(q)
            );
        }

        // Sort
        const { field, dir } = _laporanLTTSort;
        _laporanLTTFiltered.sort((a, b) => {
            let va = a[field];
            let vb = b[field];
            if (typeof va === 'number' && typeof vb === 'number') {
                return dir === 'asc' ? va - vb : vb - va;
            }
            va = String(va || '').toLowerCase();
            vb = String(vb || '').toLowerCase();
            const cmp = va.localeCompare(vb, 'id');
            return dir === 'asc' ? cmp : -cmp;
        });

        // Update stat pencarian
        const elCari = document.getElementById('statHasilCari');
        if (elCari) elCari.innerText = _laporanLTTFiltered.length.toLocaleString('id-ID');

        _renderTabelLaporan(_laporanLTTFiltered);
    }

    /** Format tanggal dari "yyyy-MM-dd HH:mm" ke "DD MMM YYYY" */
    function _formatTglLaporan(ts) {
        if (!ts) return '-';
        const tgl = ts.split(' ')[0];
        if (!tgl) return ts;
        const [y, m, d] = tgl.split('-');
        const bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
        return `${parseInt(d)} ${bulan[parseInt(m)-1] || m} ${y}`;
    }

    /** Format angka Ha */
    function _fmtHa(val) {
        const n = parseFloat(val) || 0;
        if (n === 0) return '<span class="text-gray-300">—</span>';
        return n.toLocaleString('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    /** Update statistik ringkasan */
    function _updateStat() {
        const totalData = _laporanLTTData.length;
        const totalTanam = _laporanLTTData.reduce((s, r) => s + (parseFloat(r.luas_tanam) || 0), 0);
        const totalPanen = _laporanLTTData.reduce((s, r) => s + (parseFloat(r.luas_panen) || 0), 0);

        const elTotal = document.getElementById('statTotalLaporan');
        const elTanam = document.getElementById('statTotalTanam');
        const elPanen = document.getElementById('statTotalPanen');
        const elCari  = document.getElementById('statHasilCari');

        if (elTotal) elTotal.innerText = totalData.toLocaleString('id-ID');
        if (elTanam) elTanam.innerText = totalTanam.toLocaleString('id-ID', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' Ha';
        if (elPanen) elPanen.innerText = totalPanen.toLocaleString('id-ID', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' Ha';
        if (elCari)  elCari.innerText = totalData.toLocaleString('id-ID');
    }

    /** Render tabel dengan data yang sudah difilter + pagination */
    function _renderTabelLaporan(data) {
        const tbody = document.getElementById('tbodyLaporanLTT');
        if (!tbody) return;

        const total = data.length;
        const pageSize = _laporanLTTPageSize; // 0 = semua
        const totalPages = pageSize > 0 ? Math.ceil(total / pageSize) : 1;
        if (_laporanLTTPage > totalPages) _laporanLTTPage = 1;
        const page = _laporanLTTPage;

        const start = pageSize > 0 ? (page - 1) * pageSize : 0;
        const end   = pageSize > 0 ? Math.min(start + pageSize, total) : total;
        const sliced = data.slice(start, end);

        if (sliced.length === 0) {
            tbody.innerHTML = '<tr><td colspan="11" class="p-10 text-center text-gray-400 italic"><i class="fa-solid fa-inbox text-3xl text-gray-300 mb-3 block"></i>Tidak ada data yang sesuai.</td></tr>';
        } else {
            const komColor = { 'Padi': 'bg-blue-50 text-blue-700 border-blue-100', 'Jagung': 'bg-yellow-50 text-yellow-700 border-yellow-100', 'Ubi Kayu': 'bg-orange-50 text-orange-700 border-orange-100' };
            tbody.innerHTML = sliced.map((r, idx) => {
                const no = start + idx + 1;
                const komClass = komColor[r.komoditas] || 'bg-gray-50 text-gray-600 border-gray-100';
                const rowBg = idx % 2 === 0 ? '' : 'bg-gray-50/50';
                return `<tr class="hover:bg-green-50/30 transition-colors ${rowBg}">
                    <td class="p-3 text-center text-gray-400 border-r border-gray-100">${no}</td>
                    <td class="p-3 border-r border-gray-100 text-gray-700 font-medium">${_formatTglLaporan(r.timestamp)}</td>
                    <td class="p-3 border-r border-gray-100 font-bold text-gray-800">${r.pelapor || '-'}</td>
                    <td class="p-3 border-r border-gray-100 text-gray-600">${r.kecamatan || '-'}</td>
                    <td class="p-3 border-r border-gray-100 text-gray-600">${r.desa || '-'}</td>
                    <td class="p-3 border-r border-gray-100"><span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold border ${komClass}">${r.komoditas || '-'}</span></td>
                    <td class="p-3 border-r border-gray-100 text-gray-500">${r.jenis_ltt || '<span class="text-gray-300">—</span>'}</td>
                    <td class="p-3 border-r border-gray-100 text-right text-gray-600">${_fmtHa(r.luas_bera)}</td>
                    <td class="p-3 border-r border-gray-100 text-right text-gray-600">${_fmtHa(r.olah_lahan)}</td>
                    <td class="p-3 border-r border-gray-100 text-right font-bold text-blue-700">${_fmtHa(r.luas_tanam)}</td>
                    <td class="p-3 border-r border-gray-100 text-right font-bold text-yellow-700">${_fmtHa(r.luas_panen)}</td>
                    <td class="p-3 border-r border-gray-100 text-gray-500 max-w-[150px] truncate" title="${r.keterangan}">${r.keterangan || '-'}</td>
                    <td class="p-3 text-gray-700 text-[11px]">${r.status || '-'}</td>
                </tr>`;
            }).join('');
        }

        // Info paginasi
        const infoEl = document.getElementById('infoPaginasiLaporan');
        if (infoEl) {
            if (pageSize > 0 && total > 0) {
                infoEl.innerText = `Menampilkan ${start + 1}–${end} dari ${total.toLocaleString('id-ID')} data`;
            } else {
                infoEl.innerText = `Menampilkan ${total.toLocaleString('id-ID')} data`;
            }
        }

        // Render tombol paginasi
        const btnContainer = document.getElementById('btnPaginasiLaporan');
        if (btnContainer && pageSize > 0) {
            btnContainer.innerHTML = '';
            const MAX_BTN = 7;
            let startPage = Math.max(1, page - Math.floor(MAX_BTN / 2));
            let endPage = Math.min(totalPages, startPage + MAX_BTN - 1);
            if (endPage - startPage < MAX_BTN - 1) startPage = Math.max(1, endPage - MAX_BTN + 1);

            const mkBtn = (label, pageNum, active, disabled) => {
                const cls = active
                    ? 'px-3 py-1.5 rounded-lg text-xs font-bold bg-green-600 text-white shadow-sm'
                    : disabled
                        ? 'px-3 py-1.5 rounded-lg text-xs font-bold text-gray-300 cursor-not-allowed'
                        : 'px-3 py-1.5 rounded-lg text-xs font-bold text-gray-600 hover:bg-green-50 border border-gray-200 transition';
                return `<button class="${cls}" ${disabled ? 'disabled' : ''} onclick="_goPageLaporan(${pageNum})">${label}</button>`;
            };

            btnContainer.innerHTML += mkBtn('‹ Prev', page - 1, false, page <= 1);
            for (let p = startPage; p <= endPage; p++) {
                btnContainer.innerHTML += mkBtn(p, p, p === page, false);
            }
            btnContainer.innerHTML += mkBtn('Next ›', page + 1, false, page >= totalPages);
        } else if (btnContainer) {
            btnContainer.innerHTML = '';
        }
    }

    function _goPageLaporan(p) {
        const pageSize = _laporanLTTPageSize;
        const totalPages = pageSize > 0 ? Math.ceil(_laporanLTTFiltered.length / pageSize) : 1;
        if (p < 1 || p > totalPages) return;
        _laporanLTTPage = p;
        _renderTabelLaporan(_laporanLTTFiltered);
    }

    /** Export data ter-filter ke Excel (.xlsx) menggunakan ExcelJS */
    function unduhExcelLaporan() {
        if (_laporanLTTFiltered.length === 0) {
            Swal.fire('Kosong', 'Tidak ada data untuk diunduh. Muat data terlebih dahulu.', 'info');
            return;
        }

        const doExport = async () => {
            await loadExcelJS();
            const now = new Date();
            const tgl = [now.getFullYear(), String(now.getMonth()+1).padStart(2,'0'), String(now.getDate()).padStart(2,'0')].join('');
            const komFilter = document.getElementById('filterKomLaporan').value || 'Semua';
            const filename = `LaporanLTT_${komFilter.replace(' ','_')}_${tgl}.xlsx`;

            const wb = new ExcelJS.Workbook();
            const ws = wb.addWorksheet('Laporan LTT');

            const headers = ['No','Tanggal Laporan','Nama Penyuluh','Kecamatan','Desa','Komoditas',
                             'Jenis LTT','Lahan Bera (Ha)','Olah Lahan (Ha)','Luas Tanam (Ha)','Luas Panen (Ha)',
                             'Keterangan','Status'];
            const colWidths = [4, 20, 22, 18, 18, 10, 14, 12, 12, 12, 12, 28, 12];
            ws.columns = colWidths.map(w => ({ width: w }));

            // Baris judul
            ws.mergeCells('A1:M1');
            const titleCell = ws.getCell('A1');
            titleCell.value = `Laporan LTT ${komFilter} \u2014 Diekspor ${now.toLocaleString('id-ID')}`;
            titleCell.font  = { bold: true, size: 12, color: { argb: 'FFFFFFFF' } };
            titleCell.fill  = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF16a34a' } };
            titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
            ws.getRow(1).height = 24;

            // Baris header
            const headerRow = ws.addRow(headers);
            headerRow.eachCell(c => {
                c.font      = { bold: true, color: { argb: 'FFFFFFFF' } };
                c.fill      = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF15803d' } };
                c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
                c.border    = { top:{style:'thin'}, bottom:{style:'thin'}, left:{style:'thin'}, right:{style:'thin'} };
            });
            ws.getRow(2).height = 20;

            // Baris data
            _laporanLTTFiltered.forEach((r, i) => {
                const row = ws.addRow([
                    i + 1,
                    _formatTglLaporan(r.timestamp),
                    r.pelapor    || '',
                    r.kecamatan  || '',
                    r.desa       || '',
                    r.komoditas  || '',
                    r.jenis_ltt  || '',
                    parseFloat(r.luas_bera)   || 0,
                    parseFloat(r.olah_lahan)  || 0,
                    parseFloat(r.luas_tanam)  || 0,
                    parseFloat(r.luas_panen)  || 0,
                    r.keterangan || '',
                    r.status     || ''
                ]);
                const isEven = i % 2 === 0;
                row.eachCell((c, ci) => {
                    c.border    = { top:{style:'thin'}, bottom:{style:'thin'}, left:{style:'thin'}, right:{style:'thin'} };
                    c.alignment = { vertical: 'middle' };
                    if (isEven) c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF0FDF4' } };
                    if (ci >= 8 && ci <= 11) { c.numFmt = '#,##0.00'; c.alignment = { horizontal: 'right', vertical: 'middle' }; }
                });
            });

            wb.xlsx.writeBuffer().then(buf => {
                const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const url  = URL.createObjectURL(blob);
                const a    = document.createElement('a');
                a.href = url; a.download = filename;
                document.body.appendChild(a); a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });
        };

        doExport().catch(function(err) {
            Swal.fire('Error', err.message || 'Gagal mengekspor Excel.', 'error');
        });
    }

</script>
