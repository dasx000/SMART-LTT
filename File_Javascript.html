<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.41.0/dist/apexcharts.min.js"></script>
<script>
    let userAktif = null;
    let allLaporan = [];
    let allLaporanBPP = [];
    let tabAktif = null;
    let chartTren = null;
    let chartDonut = null;
    let timerLogin = null;
    let lastDashData = null;
    let lastRekapData = null;
    let allUserData = [];
    let daftarPPLLokal = [];
    let daftarDesaKecamatanLokal = [];
    let modePelanAktif = 'ppl';
    let listKecamatan = [];
    let cacheRekap = {}; // Caching untuk tab rekap Padi, Jagung, Ubi Kayu
    let cacheLaporanPPL = { "Padi": null, "Jagung": null, "Ubi Kayu": null };

    // =========================================================================
    // 1. INITIALIZATION & SESSION CHECK
    // =========================================================================
    function loadExcelJS() {
        return new Promise(function(resolve, reject) {
            if (window.ExcelJS) { resolve(); return; }
            const s = document.createElement('script');
            s.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
            s.onload = resolve;
            s.onerror = function() { reject(new Error('Gagal memuat library ExcelJS')); };
            document.head.appendChild(s);
        });
    }

    window.onload = function () {
        cekSesi();
    };

    function cekSesi() {
        const userData = localStorage.getItem('user_eLTT');
        if (!userData) {
            tampilkanLayar('layar-login');
            document.getElementById('viewLoading').classList.add('hidden');
            document.getElementById('viewLogin').classList.remove('hidden');
            return;
        }

        try {
            userAktif = JSON.parse(userData);
            prosesBerhasilLogin(userAktif);
        } catch (e) {
            localStorage.removeItem('user_eLTT');
            tampilkanLayar('layar-login');
            document.getElementById('viewLoading').classList.add('hidden');
            document.getElementById('viewLogin').classList.remove('hidden');
        }
    }

    function tampilkanLayar(idLayar) {
        document.getElementById('layar-login').classList.add('hidden');
        document.getElementById('layar-ppl').classList.add('hidden');
        document.getElementById('layar-bpp').classList.add('hidden');
        document.getElementById('layar-admin').classList.add('hidden');
        
        document.getElementById(idLayar).classList.remove('hidden');
    }

    function toggleSidebar(forceClose = false) {
        const sidebar = document.getElementById('sidebarAdmin');
        const overlay = document.getElementById('sidebarOverlay');
        if (!sidebar || !overlay) return;

        const isDesktop = window.innerWidth >= 768;

        if (isDesktop) {
            // Pada desktop, abaikan forceClose dari klik menu navigasi
            if (!forceClose) {
                sidebar.classList.toggle('md:-ml-64');
            }
        } else {
            // Logika Mobile
            if (forceClose) {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            } else {
                sidebar.classList.toggle('-translate-x-full');
                overlay.classList.toggle('hidden');
            }
        }
    }

    function prosesBerhasilLogin(userData) {
        userAktif = userData;
        localStorage.setItem('user_eLTT', JSON.stringify(userData));

        if (userData.role === 'Penyuluh' || userData.role === 'Admin_BPP') {
            modePelanAktif = 'ppl';
            tampilkanLayar('layar-ppl');
            inisialisasiPPL();
        } else if (userData.role === 'Admin_Kab') {
            tampilkanLayar('layar-admin');
            inisialisasiAdmin();
        } else {
            Swal.fire('Akses Ditolak', 'Role tidak dikenali.', 'error');
            logout();
        }
    }

    // =========================================================================
    // 2. LOGIN LOGIC
    // =========================================================================
    function handleLogin(e) {
        e.preventDefault();
        if (!navigator.onLine) {
            Swal.fire('Koneksi Terputus!', 'Periksa sinyal internet Anda.', 'error');
            return;
        }
        const nip = document.getElementById('nip').value;
        const password = document.getElementById('password').value;

        setBtnState(true, 'Memverifikasi...');
        clearTimeout(timerLogin);
        timerLogin = setTimeout(function () {
            setBtnState(false, 'Masuk Sekarang');
            Swal.fire('Waktu Habis', 'Server tidak merespons. Coba lagi.', 'warning');
        }, 30000);

        google.script.run
            .withSuccessHandler(function (response) {
                clearTimeout(timerLogin);
                setBtnState(false, 'Masuk Sekarang');
                if (response.status === 'success') {
                    prosesBerhasilLogin(response.data);
                } else {
                    Swal.fire('Gagal Login', response.message, 'error');
                }
            })
            .withFailureHandler(function (error) {
                clearTimeout(timerLogin);
                setBtnState(false, 'Masuk Sekarang');
                Swal.fire('Server Error', error.message || error, 'error');
            })
            .prosesLogin(nip, password);
    }

    function setBtnState(loading, text) {
        const btn = document.getElementById('btnLogin');
        if (!btn) return;
        document.getElementById('loginText').innerText = text;
        btn.disabled = loading;
        btn.classList.toggle('opacity-75', loading);
        document.getElementById('loginSpinner').classList.toggle('hidden', !loading);
    }

    // =========================================================================
    // 3. PPL DASHBOARD LOGIC
    // =========================================================================
    function inisialisasiPPL() {
        document.getElementById('namaPenyuluh').innerText = userAktif.nama;
        document.getElementById('wilayahPenyuluh').innerText = "WKPP: " + userAktif.desa;
        jalankanLogikaWaktu();

        // Cek visibilitas tombol jembatan BPP
        const btnJembatan = document.getElementById('btnJembatanBPP');
        if (btnJembatan) {
            if (userAktif.role === 'Admin_BPP') {
                btnJembatan.classList.remove('hidden');
            } else {
                btnJembatan.classList.add('hidden');
            }
        }
    }

    function jalankanLogikaWaktu() {
        const jam = new Date().getHours();
        if (jam >= 24) { // Diubah sementara untuk debugging (sebelumnya 14)
            document.getElementById('statusWaktu').classList.replace('border-green-500', 'border-red-500');
            document.getElementById('teksStatusWaktu').innerText = "Ditutup (Otomatis Nihil)";
            document.getElementById('teksStatusWaktu').classList.replace('text-green-600', 'text-red-600');
            document.getElementById('ikonStatusWaktu').classList.replace('fa-lock-open', 'fa-lock');
            document.getElementById('ikonStatusWaktu').classList.replace('text-green-500', 'text-red-500');

            document.querySelectorAll('.btn-komoditas').forEach(btn => {
                btn.classList.add('opacity-40', 'grayscale');
                btn.onclick = function (e) {
                    e.stopPropagation();
                    Swal.fire('Batas Waktu Habis!', 'Pelaporan ditutup pukul 14:00 WIB.', 'info');
                };
            });
        }
        
        const tanggal = new Date().getDate();
        if (tanggal >= 6 && tanggal <= 24) {
            document.getElementById('bgTarget').classList.add('grayscale', 'opacity-60');
            document.getElementById('ikonGembokTarget').classList.remove('hidden');
        }
    }

    function setNavAktif(idNav) {
        ['navHome', 'navPadi', 'navJagung', 'navUbiKayu', 'navAkun'].forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.toggle('text-green-600', id === idNav);
            el.classList.toggle('text-gray-400', id !== idNav);
        });
    }

    function _tutupSemuaOverlayPPL() {
        const profilArea = document.getElementById('profilArea');
        if (profilArea) profilArea.classList.add('hidden');
        document.getElementById('formArea').classList.add('hidden');
    }

    function tampilkanHomePPL() {
        _tutupSemuaOverlayPPL();
        document.getElementById('headerPPL').classList.remove('hidden');
        document.getElementById('containerHomePPL').classList.remove('hidden');
        setNavAktif('navHome');
    }

    function bukaForm(komoditas) {
        _tutupSemuaOverlayPPL();
        window.history.pushState({ overlay: 'formArea' }, '');
        document.getElementById('headerPPL').classList.add('hidden');
        document.getElementById('containerHomePPL').classList.add('hidden');
        document.getElementById('formArea').classList.remove('hidden');
        document.getElementById('areaPadiReadOnly').classList.add('hidden');
        document.getElementById('judulForm').innerText = komoditas;
        muatRingkasanPPL(komoditas);
        const navMap = { 'Padi': 'navPadi', 'Jagung': 'navJagung', 'Ubi Kayu': 'navUbiKayu' };
        setNavAktif(navMap[komoditas] || 'navHome');
    }

    function renderListLaporan(komoditas, data) {
        const el = document.getElementById('listLaporanHariIni');
        if (data.length === 0) {
            const pesan = komoditas === 'Padi'
                ? 'Belum ada data<br>sinkronisasi Padi hari ini'
                : `Belum ada laporan<br>${komoditas} hari ini`;
            el.innerHTML = `<div class="bg-gray-50 border-2 border-dotted border-gray-200 rounded-2xl p-8 text-center"><i class="fa-solid fa-clipboard-list text-gray-300 text-4xl mb-3 block"></i><p class="text-gray-400 text-xs font-bold uppercase tracking-wider">${pesan}</p></div>`;
            return;
        }
        el.innerHTML = data.map(l => {
            const isTemp = l.id && l.id.startsWith('TEMP-');
            const isSync = l.id && l.id.startsWith('SYNC-');
            const accentColor = isTemp ? 'bg-gray-300' : (l.status === 'Menunggu' ? 'bg-yellow-400' : 'bg-green-500');
            const statusColor = isTemp ? 'bg-gray-50 text-gray-400 border border-gray-100' : (l.status === 'Menunggu' ? 'bg-yellow-50 text-yellow-600 border border-yellow-100' : 'bg-green-50 text-green-600 border border-green-100');
            const statusIcon = isTemp ? 'fa-circle-notch fa-spin' : (isSync ? 'fa-cloud-arrow-down' : (l.status === 'Menunggu' ? 'fa-clock' : 'fa-check-circle'));
            const statusLabel = isTemp ? 'Mengirim...' : (isSync ? (l.jenis_ltt || 'Tersinkron') : (l.status === 'Menunggu' ? 'Menunggu Verifikasi' : l.status));
            const jamDisplay = isSync ? l.jam : `${l.jam} WIB`;
            return `<div class="bg-white border border-gray-200 rounded-2xl p-4 shadow-md animate__animated animate__fadeInUp relative overflow-hidden${isTemp ? ' opacity-60' : ''}">
                <div class="absolute left-0 top-0 bottom-0 w-1 ${accentColor}"></div>
                <div class="pl-2">
                    <div class="flex justify-between items-start mb-1">
                        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">${jamDisplay}</p>
                        <span class="inline-flex items-center text-[8px] px-2 py-0.5 rounded-lg font-bold uppercase tracking-tighter ${statusColor}"><i class="fa-solid ${statusIcon} mr-1"></i>${statusLabel}</span>
                    </div>
                    <h4 class="font-bold text-gray-800 text-base">Desa ${l.desa}</h4>
                    <div class="flex gap-2 mt-3">
                        <div class="bg-blue-50 border border-blue-100 px-3 py-1.5 rounded-xl flex items-center gap-2"><span class="text-[9px] font-bold text-blue-400 uppercase">Tanam</span><span class="text-xs font-black text-blue-700">${l.tanam} <small class="font-bold">Ha</small></span></div>
                        <div class="bg-orange-50 border border-orange-100 px-3 py-1.5 rounded-xl flex items-center gap-2"><span class="text-[9px] font-bold text-orange-400 uppercase">Panen</span><span class="text-xs font-black text-orange-700">${l.panen} <small class="font-bold">Ha</small></span></div>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function tampilkanStealthLoader(show) {
        const el = document.getElementById('stealthLoader');
        if (el) el.classList.toggle('hidden', !show);
    }

    function tampilkanLoadingUtama(show) {
        if (show) document.getElementById('listLaporanHariIni').innerHTML = '<div class="text-center p-8"><i class="fa-solid fa-circle-notch fa-spin text-green-500 text-2xl"></i></div>';
    }

    function updateCacheAndRender(komoditas, newData) {
        tampilkanStealthLoader(false);
        const prev = cacheLaporanPPL[komoditas];
        if (!prev || JSON.stringify(prev.data) !== JSON.stringify(newData)) {
            cacheLaporanPPL[komoditas] = { data: newData, ts: Date.now() };
            renderListLaporan(komoditas, newData);
        }
    }

    function muatRingkasanPPL(komoditas) {
        document.getElementById('areaRingkasanPPL').classList.remove('hidden');
        document.getElementById('formInputan').classList.add('hidden');

        const btnTambah = document.getElementById('btnTambahLaporan');
        if (btnTambah) btnTambah.classList.toggle('hidden', komoditas === 'Padi');

        const cached = cacheLaporanPPL[komoditas];
        if (cached) {
            renderListLaporan(komoditas, cached.data);
            tampilkanStealthLoader(true);
        } else {
            tampilkanLoadingUtama(true);
        }

        if (komoditas === 'Padi') {
            google.script.run
                .withSuccessHandler(function(res) {
                    const dataPadi = res.status === 'sudah' ? res.rows.map(function(r, idx) {
                        return {
                            id: 'SYNC-' + Date.now() + '-' + idx,
                            desa: r.desa,
                            tanam: r.tanam,
                            panen: r.panen,
                            jenis_ltt: r.jenis_ltt,
                            jam: 'Hasil Sync'
                        };
                    }) : [];
                    updateCacheAndRender(komoditas, dataPadi);
                })
                .withFailureHandler(function(err) {
                    tampilkanStealthLoader(false);
                    if (!cached) document.getElementById('listLaporanHariIni').innerHTML = '<p class="text-red-500 text-center text-xs">Error Koneksi: ' + err.message + '</p>';
                })
                .cekStatusPadiHarian(userAktif.desa);
        } else {
            google.script.run
                .withSuccessHandler(function(res) {
                    if (res.status === 'success') {
                        updateCacheAndRender(komoditas, res.data);
                    } else {
                        tampilkanStealthLoader(false);
                        if (!cached) document.getElementById('listLaporanHariIni').innerHTML = '<p class="text-red-500 text-center text-xs">Gagal: ' + res.message + '</p>';
                    }
                })
                .withFailureHandler(function(err) {
                    tampilkanStealthLoader(false);
                    if (!cached) document.getElementById('listLaporanHariIni').innerHTML = '<p class="text-red-500 text-center text-xs">Error Koneksi: ' + err.message + '</p>';
                })
                .getLaporanPPLHariIni(userAktif.nama, komoditas, userAktif.desa);
        }
    }

    function tampilkanFormInput() {
        const komoditas = document.getElementById('judulForm').innerText;
        document.getElementById('areaRingkasanPPL').classList.add('hidden');
        document.getElementById('formInputan').classList.remove('hidden');
        document.getElementById('inputKomoditas').value = komoditas;
        
        const selectDesa = document.getElementById('inputDesa');
        selectDesa.innerHTML = `<option value="" disabled selected>-- Pilih Desa --</option>`;
        userAktif.desa.split(',').forEach(d => {
            selectDesa.innerHTML += `<option value="${d.trim()}">${d.trim()}</option>`;
        });
    }

    function _tutupFormDOM() {
        document.getElementById('formArea').classList.add('hidden');
        document.getElementById('formInputan').reset();
        document.getElementById('headerPPL').classList.remove('hidden');
        document.getElementById('containerHomePPL').classList.remove('hidden');
        setNavAktif('navHome');
    }

    function tutupForm() {
        _tutupFormDOM();
        if (window.history.state && window.history.state.overlay === 'formArea') {
            window.history.back();
        }
    }

    function submitData(e) {
        e.preventDefault();
        const komoditas = document.getElementById('inputKomoditas').value;

        const formData = {
            pelapor: userAktif.nama,
            kecamatan: userAktif.kecamatan,
            desa: document.getElementById('inputDesa').value,
            komoditas: komoditas,
            jenis_ltt: 'LTT',
            target_tanam: 0,
            target_panen: 0,
            luas_bera: 0,
            olah_lahan: 0,
            luas_tanam: parseFloat(document.getElementById('inputTanam').value) || 0,
            luas_panen: parseFloat(document.getElementById('inputPanen').value) || 0,
            keterangan: document.getElementById('inputKeterangan').value || '-'
        };

        const dataOptimis = {
            id: 'TEMP-' + Date.now(),
            desa: formData.desa,
            tanam: formData.luas_tanam,
            panen: formData.luas_panen,
            status: 'Menunggu',
            jam: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
        };

        if (!cacheLaporanPPL[komoditas]) cacheLaporanPPL[komoditas] = { data: [], ts: Date.now() };
        cacheLaporanPPL[komoditas].data.unshift(dataOptimis);
        renderListLaporan(komoditas, cacheLaporanPPL[komoditas].data);

        document.getElementById('formInputan').classList.add('hidden');
        document.getElementById('formInputan').reset();
        document.getElementById('areaRingkasanPPL').classList.remove('hidden');
        Swal.fire({ icon: 'success', title: 'Tersimpan!', timer: 1500, showConfirmButton: false });

        google.script.run
            .withSuccessHandler(function(res) {
                if (res.status === 'success') {
                    muatRingkasanPPL(komoditas);
                } else {
                    cacheLaporanPPL[komoditas].data = cacheLaporanPPL[komoditas].data.filter(l => l.id !== dataOptimis.id);
                    Swal.fire('Gagal!', res.message || 'Data gagal disimpan ke server.', 'error');
                }
            })
            .withFailureHandler(function() {
                cacheLaporanPPL[komoditas].data = cacheLaporanPPL[komoditas].data.filter(l => l.id !== dataOptimis.id);
                Swal.fire('Gagal!', 'Koneksi terputus, data gagal disimpan ke server.', 'error');
            })
            .submitLaporan(formData);
    }

    // =========================================================================
    // 4. ADMIN DASHBOARD LOGIC
    // =========================================================================
    function inisialisasiAdmin() {
        document.getElementById('namaAdmin').innerText = userAktif.nama;
        const d = new Date();
        const today = [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
        if (document.getElementById('tglRekapMulai')) document.getElementById('tglRekapMulai').value = today;
        if (document.getElementById('tglRekapAkhir')) document.getElementById('tglRekapAkhir').value = today;
        generateOpsiFilter();
        muatDashboard(); // muatDashboard sudah memanggil muatChartTarget() secara internal
    }

    function generateOpsiFilter() {
        const sel = document.getElementById('filterBulanDashboard');
        if (!sel) return;
        const namaBulan = ['Januari','Februari','Maret','April','Mei','Juni',
                           'Juli','Agustus','September','Oktober','November','Desember'];
        const now = new Date();
        sel.innerHTML = '';
        for (let i = 0; i <= 2; i++) {
            const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
            const opt = document.createElement('option');
            opt.value = `${d.getFullYear()}-${d.getMonth() + 1}`;
            opt.text = `${namaBulan[d.getMonth()]} ${d.getFullYear()}`;
            sel.appendChild(opt);
        }
    }

    function navigasi(section) {
        ['sectionDashboard', 'sectionVerifikasi', 'sectionManajemen', 'sectionLogs', 'sectionTarget', 'sectionDetailTarget', 'sectionLaporanLTT'].forEach(id => {
            const el = document.getElementById(id);
            if(el) el.classList.add('hidden');
        });
        document.querySelectorAll('.nav-item').forEach(a => a.classList.remove('bg-green-700', 'text-white', 'font-bold'));

        if (section === 'verifikasi') {
            document.getElementById('sectionVerifikasi').classList.remove('hidden');
            document.getElementById('nav-verifikasi').classList.add('bg-green-700', 'text-white', 'font-bold');
            muatVerifikasi();
        } else if (section === 'manajemen') {
            document.getElementById('sectionManajemen').classList.remove('hidden');
            document.getElementById('nav-manajemen').classList.add('bg-green-700', 'text-white', 'font-bold');
            muatDaftarUser();
        } else if (section === 'logs') {
            document.getElementById('sectionLogs').classList.remove('hidden');
            document.getElementById('nav-logs').classList.add('bg-green-700', 'text-white', 'font-bold');
            muatLogsSinkron();
        } else if (section === 'target') {
            document.getElementById('sectionTarget').classList.remove('hidden');
            document.getElementById('nav-target').classList.add('bg-green-700', 'text-white', 'font-bold');
            muatTabelTargetBulan();
        } else if (section === 'laporan-ltt') {
            document.getElementById('sectionLaporanLTT').classList.remove('hidden');
            document.getElementById('nav-laporan-ltt').classList.add('bg-green-700', 'text-white', 'font-bold');
            if (!_laporanLTTLoaded) muatLaporanLTT();
        } else {
            document.getElementById('sectionDashboard').classList.remove('hidden');
            document.getElementById('nav-dashboard').classList.add('bg-green-700', 'text-white', 'font-bold');
        }
    }

    function formatAngkaLTT(val) {
        const num = Number(val);
        if (isNaN(num)) return val;
        if (Number.isInteger(num)) {
            return num.toLocaleString('id-ID');
        } else {
            return num.toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
    }

    function muatDashboard(forceRefresh = false) {
        const sel = document.getElementById('filterBulanDashboard');
        const btnIcon = document.getElementById('iconRefreshDash');
        
        const params = {};
        if (forceRefresh) params.forceRefresh = true;

        if (sel && sel.value) {
            const parts = sel.value.split('-');
            params.tahun = parseInt(parts[0]);
            params.bulan = parseInt(parts[1]);
        }
        
        if (btnIcon) btnIcon.classList.add('fa-spin');
        muatChartTarget(params);
        
        google.script.run
            .withSuccessHandler(function (dash) {
                if (btnIcon) btnIcon.classList.remove('fa-spin');
                lastDashData = dash;
                if (document.getElementById('tanamPadi')) document.getElementById('tanamPadi').innerText = formatAngkaLTT(dash.komposisiTanam['Padi'] || 0) + ' Ha';
                if (document.getElementById('tanamJagung')) document.getElementById('tanamJagung').innerText = formatAngkaLTT(dash.komposisiTanam['Jagung'] || 0) + ' Ha';
                if (document.getElementById('tanamUbi')) document.getElementById('tanamUbi').innerText = formatAngkaLTT(dash.komposisiTanam['Ubi Kayu'] || 0) + ' Ha';
                if (document.getElementById('panenPadi')) document.getElementById('panenPadi').innerText = formatAngkaLTT(dash.komposisiPanen['Padi'] || 0) + ' Ha';
                if (document.getElementById('panenJagung')) document.getElementById('panenJagung').innerText = formatAngkaLTT(dash.komposisiPanen['Jagung'] || 0) + ' Ha';
                if (document.getElementById('panenUbi')) document.getElementById('panenUbi').innerText = formatAngkaLTT(dash.komposisiPanen['Ubi Kayu'] || 0) + ' Ha';
                if (document.getElementById('angkaPctVerified')) document.getElementById('angkaPctVerified').innerText = dash.pctVerified;
                if (document.getElementById('angkaMenunggu')) document.getElementById('angkaMenunggu').innerText = dash.countMenunggu;
                renderChart(dash);
            })
            .withFailureHandler(function(err) {
                if (btnIcon) btnIcon.classList.remove('fa-spin');
                Swal.fire('Error', 'Gagal memuat dashboard: ' + (err.message || err), 'error');
            })
            .getDashboardKab(params);
    }

    function tampilkanDetailPadi(type) {
        if (!lastDashData || !lastDashData.breakdownPadi) return;
        const data = lastDashData.breakdownPadi[type];
        const title = type === 'tanam' ? 'RINCIAN TANAM PADI (JENIS LTT)' : 'RINCIAN PANEN PADI (JENIS LTT)';
        const color = type === 'tanam' ? 'text-blue-600' : 'text-yellow-600';
        
        let html = `<div class="text-left space-y-3 mt-4">`;
        let hasData = false;
        for (let jenis in data) {
            if (data[jenis] > 0) {
                hasData = true;
                html += `
                <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg border border-gray-100">
                    <span class="font-bold text-gray-700 uppercase text-xs">${jenis}</span>
                    <span class="font-bold ${color}">${formatAngkaLTT(data[jenis])} Ha</span>
                </div>`;
            }
        }

    let lastRekapKecData = null;

    let currentRekapTab = 'rekap-padi';

    function muatRekap(force = false) {
        const tglMulai = document.getElementById('tglRekapMulai').value;
        const tglAkhir = document.getElementById('tglRekapAkhir').value;
        const jenisLTT = currentRekapTab === 'rekap-padi' ? document.getElementById('filterJenisLTT').value : '';
        const btnIcon = document.getElementById('iconRefreshRekap');

        const d = new Date();
        const todayDate = [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
        const isTodayOnly = (tglMulai === todayDate && tglAkhir === todayDate);

        // Konstruksi Cache Key
        const cacheKey = currentRekapTab + '_' + tglMulai + '_' + tglAkhir + '_' + (jenisLTT || 'semua');

        // Gunakan cache jika tersedia, tidak dipaksa refresh, dan filter adalah hari ini (isTodayOnly)
        if (!force && isTodayOnly && cacheRekap[cacheKey]) {
            const data = cacheRekap[cacheKey];
            lastRekapData = data.harian;
            lastRekapKecData = data.kecamatan;
            
            // Render UI Harian
            document.getElementById('rTanam').innerText = formatAngkaLTT(lastRekapData.totalTanam);
            document.getElementById('rPanen').innerText = formatAngkaLTT(lastRekapData.totalPanen);
            
            if (currentRekapTab === 'rekap-padi') {
                const typeText = jenisLTT ? '(' + jenisLTT + ')' : '(Semua)';
                document.getElementById('labelTanamType').innerText = typeText;
                document.getElementById('labelPanenType').innerText = typeText;
            } else {
                document.getElementById('labelTanamType').innerText = '(Semua)';
                document.getElementById('labelPanenType').innerText = '(Semua)';
            }
            
            // Render Tabel
            renderTabelKecamatan(lastRekapKecData, currentRekapTab === 'rekap-padi');
            return;
        }

        // Tampilkan loading dan animasi refresh
        if (btnIcon) btnIcon.classList.add('fa-spin');
        
        document.getElementById('tabelKecamatan').innerHTML = '<tr><td colspan="4" class="p-8 text-center"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-green-500 mb-2 block"></i> Menghitung rekap data...</td></tr>';

        // Helper untuk simpan ke cache jika kedua request selesai
        let tempHarian = null;
        let tempKec = null;

        function cobaSimpanCache() {
            if (tempHarian && tempKec) {
                if (isTodayOnly) {
                    cacheRekap[cacheKey] = { harian: tempHarian, kecamatan: tempKec };
                }
                if (btnIcon) btnIcon.classList.remove('fa-spin');
            }
        }

        if (currentRekapTab === 'rekap-padi') {
            google.script.run.withSuccessHandler(function (d) {
                tempHarian = d.harian;
                tempKec = d.kecamatan;
                lastRekapData = d.harian;
                lastRekapKecData = d.kecamatan;
                
                document.getElementById('rTanam').innerText = formatAngkaLTT(d.harian.totalTanam);
                document.getElementById('rPanen').innerText = formatAngkaLTT(d.harian.totalPanen);
                const typeText = jenisLTT ? '(' + jenisLTT + ')' : '(Semua)';
                document.getElementById('labelTanamType').innerText = typeText;
                document.getElementById('labelPanenType').innerText = typeText;
                
                // Update dropdown jika Padi
                const sel = document.getElementById('filterJenisLTT');
                const prev = sel.value;
                sel.innerHTML = '<option value="">Semua Jenis LTT</option>';
                d.harian.jenisLTTList.forEach(j => {
                    sel.innerHTML += `<option value="${j}" ${j === prev ? 'selected' : ''}>${j}</option>`;
                });
                
                renderTabelKecamatan(d.kecamatan, true);
                cobaSimpanCache();
            }).getRekapPadiLengkap(tglMulai, tglAkhir, jenisLTT);

        } else {
            const komoditas = currentRekapTab === 'jagung' ? 'Jagung' : 'Ubi Kayu';
            google.script.run.withSuccessHandler(function (d) {
                tempHarian = d.harian;
                tempKec = d.kecamatan;
                lastRekapData = d.harian;
                lastRekapKecData = d.kecamatan;
                
                document.getElementById('rTanam').innerText = formatAngkaLTT(d.harian.totalTanam);
                document.getElementById('rPanen').innerText = formatAngkaLTT(d.harian.totalPanen);
                document.getElementById('labelTanamType').innerText = '(Semua)';
                document.getElementById('labelPanenType').innerText = '(Semua)';
                
                renderTabelKecamatan(d.kecamatan, false);
                cobaSimpanCache();
            }).getRekapPalawijaLengkap(tglMulai, tglAkhir, komoditas);
        }
    }

    async function unduhExcelKecamatan() {
        if (!lastRekapKecData || lastRekapKecData.rows.length === 0) {
            Swal.fire('Peringatan', 'Muat data terlebih dahulu sebelum mengunduh.', 'warning');
            return;
        }

        const btn = document.getElementById('btnUnduhExcel');
        const oldHtml = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Memproses...';

        try {
            await loadExcelJS();
            const workbook = new ExcelJS.Workbook();
            const worksheet = workbook.addWorksheet('Rekap Kecamatan');

            const tglMulai = document.getElementById('tglRekapMulai').value;
            const tglAkhir = document.getElementById('tglRekapAkhir').value;
            const tgl = tglMulai === tglAkhir ? tglMulai : `${tglMulai}_${tglAkhir}`;
            const tglInfo = tglMulai === tglAkhir ? tglMulai : `${tglMulai} s/d ${tglAkhir}`;
            const isPadi = currentRekapTab === 'rekap-padi';
            const komoditasName = isPadi ? 'PADI' : (currentRekapTab === 'jagung' ? 'JAGUNG' : 'UBI KAYU');
            const jenis = isPadi ? (document.getElementById('filterJenisLTT').value || 'Semua') : 'Semua';

            const now = new Date();
            const tglDownload = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) + ' ' + now.toLocaleTimeString('id-ID');
            const tglLaporan = tglInfo;
            const jenisLTT = jenis;

            // 1. Judul & Metadata
            const colRange = isPadi ? 'A1:D1' : 'A1:C1';
            worksheet.mergeCells(colRange);
            worksheet.getCell('A1').value = `REKAPITULASI ${komoditasName} PER KECAMATAN`;
            worksheet.getCell('A1').font = { bold: true, size: 14 };
            worksheet.getCell('A1').alignment = { horizontal: 'center' };

            const metadataRange = isPadi ? 'A2:D2' : 'A2:C2';
            worksheet.mergeCells(metadataRange);
            worksheet.getCell('A2').value = isPadi ? `Tanggal Laporan: ${tglLaporan} | Jenis LTT: ${jenisLTT}` : `Tanggal Laporan: ${tglLaporan}`;
            worksheet.getCell('A2').alignment = { horizontal: 'center' };

            const infoRange = isPadi ? 'A3:D3' : 'A3:C3';
            worksheet.mergeCells(infoRange);
            worksheet.getCell('A3').value = `Tanggal Download: ${tglDownload}`;
            worksheet.getCell('A3').font = { italic: true, size: 9, color: { argb: 'FF666666' } };
            worksheet.getCell('A3').alignment = { horizontal: 'center' };

            // 2. Header (Baris 4)
            const headers = isPadi ? ['KECAMATAN', 'JENIS LTT', 'LUAS TANAM (HA)', 'LUAS PANEN (HA)'] : ['KECAMATAN', 'LUAS TANAM (HA)', 'LUAS PANEN (HA)'];
            const headerRow = worksheet.addRow(headers);
            headerRow.eachCell(cell => {
                cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF16A34A' } };
                cell.alignment = { horizontal: 'center', vertical: 'middle' };
                cell.border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };
            });

            // 3. Data
            let dataBaris = [];
            if (isPadi) {
                dataBaris = lastRekapKecData.rows.map(r => [
                    r[0] || '-', 
                    r[1] || '-', 
                    Number(r[2]) || 0, 
                    Number(r[3]) || 0
                ]);
            } else {
                dataBaris = lastRekapKecData.rows.map(r => [
                    r[0] || '-', 
                    Number(r[2]) || 0, 
                    Number(r[3]) || 0
                ]);
            }
            
            worksheet.addRows(dataBaris);

            // 4. Styling & Zebra Stripes
            const startDataRow = 5;
            worksheet.eachRow((row, rowNumber) => {
                if (rowNumber >= startDataRow) {
                    row.eachCell((cell, colNumber) => {
                        cell.border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };
                        if ((isPadi && colNumber >= 3) || (!isPadi && colNumber >= 2)) cell.alignment = { horizontal: 'right' };
                        cell.font = { color: { argb: 'FF000000' }, size: 10 };
                        
                        // Zebra Stripes (Warna Abu-abu Muda untuk baris genap)
                        if (rowNumber % 2 === 0) {
                            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF9FAFB' } };
                        }
                    });
                }
            });

            // 5. Baris Total
            const totalRowData = isPadi ? 
                ['TOTAL KABUPATEN', '', Number(lastRekapKecData.totalTanam), Number(lastRekapKecData.totalPanen)] : 
                ['TOTAL KABUPATEN', Number(lastRekapKecData.totalTanam), Number(lastRekapKecData.totalPanen)];
            
            const totalRow = worksheet.addRow(totalRowData);
            if (isPadi) worksheet.mergeCells(`A${totalRow.number}:B${totalRow.number}`);
            
            totalRow.eachCell(cell => {
                cell.font = { bold: true, size: 11 };
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFDCFCE7' } };
                cell.border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };
                cell.alignment = { vertical: 'middle' };
            });

            // 6. Column Width
            worksheet.getColumn(1).width = 25;
            if (isPadi) {
                worksheet.getColumn(2).width = 20;
                worksheet.getColumn(3).width = 20;
                worksheet.getColumn(4).width = 20;
            } else {
                worksheet.getColumn(2).width = 20;
                worksheet.getColumn(3).width = 20;
            }

            // 7. Generate and Download
            const buffer = await workbook.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const fileJenis = isPadi ? jenisLTT : komoditasName.replace(' ', '_');
            a.download = `Rekap_Kecamatan_${tgl}_${fileJenis}.xlsx`;
            a.click();
            window.URL.revokeObjectURL(url);

            Swal.fire({ icon: 'success', title: 'Berhasil', text: 'File Excel berhasil diunduh.', toast: true, position: 'top-end', showConfirmButton: false, timer: 3000 });

        } catch (err) {
            console.error(err);
            Swal.fire('Gagal', 'Terjadi kesalahan saat membuat file Excel.', 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = oldHtml;
        }
    }

            thead.innerHTML = `<tr class="bg-gray-100 text-gray-600 text-xs uppercase tracking-wider border-b border-gray-200">

                <th class="p-3">Jenis LTT</th>
                <th class="p-3 text-right">Tanam (Ha)</th>
                <th class="p-3 text-right">Panen (Ha)</th>

                <th class="p-3 text-right">Tanam (Ha)</th>

            tbody.innerHTML = `<tr><td colspan="${isPadi ? 4 : 3}" class="p-8 text-center text-gray-400">Tidak ada data.</td></tr>`;

            const tampilKec = (r[0] !== lastKec) ? `<span class="font-bold text-gray-800">${r[0]}</span>` : '';
            const borderTop = (r[0] !== lastKec && i > 0) ? 'border-t-2 border-gray-100' : '';

                    <td class="p-3 text-xs text-gray-600">${r[1]}</td>

                <td class="p-3 text-right text-yellow-700">${formatAngkaLTT(d.totalPanen)} Ha</td>
            </tr>`;
    }

    function generateOpsiFilterBPP() {
        const sel = document.getElementById('filterBulanTarget');
        if (!sel) return;
        const namaBulan = ['Januari','Februari','Maret','April','Mei','Juni',
                           'Juli','Agustus','September','Oktober','November','Desember'];
        const now = new Date();
        sel.innerHTML = '';
        for (let i = 0; i <= 2; i++) {
            const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
            const opt = document.createElement('option');
            opt.value = `${d.getFullYear()}-${d.getMonth() + 1}`;
            opt.text = `${namaBulan[d.getMonth()]} ${d.getFullYear()}`;
            sel.appendChild(opt);
        }
        sel.addEventListener('change', muatTargetBPP);
    }

    function muatTargetBPP() {
        const sel = document.getElementById('filterBulanTarget');
        if (!sel || !sel.value) return;
        const parts = sel.value.split('-');
        const params = { tahun: parseInt(parts[0]), bulan: parseInt(parts[1]), kecamatan: userAktif.kecamatan };
        google.script.run
            .withSuccessHandler(function(data) {
                const fields = ['LTTReguler_Tanam','LTTReguler_Panen','PadiGogo_Tanam','PadiGogo_Panen',
                                'Oplah2025_Tanam','Oplah2025_Panen','Jagung_Tanam','Jagung_Panen',
                                'UbiKayu_Tanam','UbiKayu_Panen'];
                fields.forEach(f => {
                    const el = document.getElementById('tgt_' + f);
                    if (el) el.value = data ? (data[f] || '') : '';
                });
            })
            .getTargetKecamatan(params);
    }

    function simpanTargetBPP() {
        const sel = document.getElementById('filterBulanTarget');
        if (!sel || !sel.value) return;
        const parts = sel.value.split('-');
        const formData = {
            tahun: parseInt(parts[0]),
            bulan: parseInt(parts[1]),
            kecamatan: userAktif.kecamatan,
            LTTReguler_Tanam: document.getElementById('tgt_LTTReguler_Tanam').value,
            LTTReguler_Panen: document.getElementById('tgt_LTTReguler_Panen').value,
            PadiGogo_Tanam:   document.getElementById('tgt_PadiGogo_Tanam').value,
            PadiGogo_Panen:   document.getElementById('tgt_PadiGogo_Panen').value,
            Oplah2025_Tanam:  document.getElementById('tgt_Oplah2025_Tanam').value,

            Jagung_Tanam:     document.getElementById('tgt_Jagung_Tanam').value,
            Jagung_Panen:     document.getElementById('tgt_Jagung_Panen').value,
            UbiKayu_Tanam:    document.getElementById('tgt_UbiKayu_Tanam').value,

        };
        const btn = document.getElementById('btnSimpanTargetText');
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Menyimpan...';
        google.script.run
            .withSuccessHandler(function(res) {
                btn.innerHTML = 'Simpan Target';
                if (res.status === 'success') {
                    Swal.fire({ icon: 'success', title: 'Tersimpan!', text: 'Target berhasil disimpan.', timer: 1800, showConfirmButton: false });

                    Swal.fire({ icon: 'error', title: 'Gagal', text: res.message || 'Terjadi kesalahan.' });

            .withFailureHandler(function() {

            .simpanTarget(formData);

    // =========================================================
    // TARGET vs REALISASI — Chart Admin
    // =========================================================

    let dataTarget = null;
    let filterJenisTarget = 'LTTReguler';
    let filterTanamPanen  = 'tanam';
    let chartTarget       = null;

    const LABEL_KOMODITI = {
        LTTReguler: 'LTT Reguler',
        PadiGogo:   'LTT Padi Gogo',
        Oplah2025:  'LTT Oplah 2025',
        Jagung:     'Jagung',
        UbiKayu:    'Ubi Kayu',
    };

    function toggleModeTabelLTT() {
        const mode = document.getElementById('modeFilterTabelLTT').value;
        const inputTgl = document.getElementById('filterTanggalTabelLTT');
        const lblBln = document.getElementById('labelBulanTabelLTT');
        
        if (mode === 'harian') {
            lblBln.classList.add('hidden');
            inputTgl.classList.remove('hidden');
            if (!inputTgl.value) {
                const today = new Date();
                const yyyy = today.getFullYear();
                const mm = String(today.getMonth() + 1).padStart(2, '0');
                const dd = String(today.getDate()).padStart(2, '0');
                inputTgl.value = `${yyyy}-${mm}-${dd}`;
            }
        } else {
            lblBln.classList.remove('hidden');
            inputTgl.classList.add('hidden');
        }
        muatTabelLTTSaja();
    }

    function muatTabelLTTSaja() {
        const mode = document.getElementById('modeFilterTabelLTT') ? document.getElementById('modeFilterTabelLTT').value : 'bulanan';
        const selBulan = document.getElementById('filterBulanDashboard');
        const selTanggal = document.getElementById('filterTanggalTabelLTT');
        const label = document.getElementById('labelBulanRekapLTT');
        const params = {};
        
        if (mode === 'harian' && selTanggal && selTanggal.value) {
            params.tanggal = selTanggal.value;
            const parts = params.tanggal.split('-');
            params.tahun = parseInt(parts[0]);
            params.bulan = parseInt(parts[1]);
            if(label) label.innerText = `Periode: ${parts[2]}/${parts[1]}/${parts[0]}`;
        } else if (selBulan && selBulan.value) {
            const parts = selBulan.value.split('-');
            params.tahun = parseInt(parts[0]);
            params.bulan = parseInt(parts[1]);
            if(label) label.innerText = `Periode: ${selBulan.options[selBulan.selectedIndex].text}`;
        }

        const tbody = document.getElementById('tbodyRekapLTT');
        if (tbody) {
            tbody.innerHTML = `<tr><td colspan="12" class="p-8 text-center text-gray-400 italic"><i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Memuat data rekapitulasi...</td></tr>`;
        }

        google.script.run
            .withSuccessHandler(function(data) {
                renderTabelRekapLTT(data);
            })
            .getDashboardTarget(params);
    }

    function muatChartTarget() {
        const sel = document.getElementById('filterBulanDashboard');
        const params = {};
        if (sel && sel.value) {
            const parts = sel.value.split('-');
            params.tahun = parseInt(parts[0]);
            params.bulan = parseInt(parts[1]);
        }
        document.getElementById('loadingTarget').classList.remove('hidden');
        document.getElementById('chartTargetVsRealisasi').classList.add('hidden');
        document.getElementById('emptyTarget').classList.add('hidden');

        // Tampilkan loading di tabel rekapitulasi LTT
        const tbody = document.getElementById('tbodyRekapLTT');
        if (tbody) {
            tbody.innerHTML = `<tr><td colspan="12" class="p-8 text-center text-gray-400 italic"><i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Memuat data rekapitulasi...</td></tr>`;
        }

        google.script.run
            .withSuccessHandler(function(data) {
                dataTarget = data;
                renderChartTarget();
            })
            .getDashboardTarget(params);
            
        // Bersamaan dengan load chart, load tabel dengan state spesifiknya
        muatTabelLTTSaja();
    }

    function renderChartTarget() {
        document.getElementById('loadingTarget').classList.add('hidden');
        if (!dataTarget) return;

        const side = filterTanamPanen;
        const jenisKey = filterJenisTarget;

        // Kumpulkan semua kecamatan dari gabungan target + realisasi
        const semuaKec = [...new Set([
            ...Object.keys(dataTarget.target),
            ...Object.keys(dataTarget.realisasi)
        ])].sort();

        if (semuaKec.length === 0) {
            document.getElementById('emptyTarget').classList.remove('hidden');
            document.getElementById('emptyTarget').classList.add('flex');
            document.getElementById('tableTargetVsRealisasiContainer').classList.add('hidden');
            return;
        }

        const seriesTarget    = [];
        const seriesRealisasi = [];
        const colors          = [];

        semuaKec.forEach(kec => {
            const t = (dataTarget.target[kec]    && dataTarget.target[kec][jenisKey])    ? (dataTarget.target[kec][jenisKey][side]    || 0) : 0;
            const r = (dataTarget.realisasi[kec] && dataTarget.realisasi[kec][jenisKey]) ? (dataTarget.realisasi[kec][jenisKey][side] || 0) : 0;
            seriesTarget.push(t);
            seriesRealisasi.push(r);
            const pct = t > 0 ? (r / t) * 100 : 100;
            let barHex = '#16a34a'; // Default Green
            if (pct < 50) barHex = '#ef4444'; // Red
            else if (pct < 80) barHex = '#eab308'; // Yellow
            colors.push(barHex);
        });

        if (chartTarget) { chartTarget.destroy(); chartTarget = null; }

        const chartEl = document.getElementById('chartTargetVsRealisasi');
        chartEl.classList.remove('hidden');

        chartTarget = new ApexCharts(chartEl, {
            chart: { type: 'bar', height: 340, toolbar: { show: false }, fontFamily: 'inherit' },
            series: [
                { name: 'Target', data: seriesTarget },
                { name: 'Realisasi', data: seriesRealisasi },
            ],
            xaxis: { categories: semuaKec, labels: { style: { fontSize: '10px' }, rotate: -30 } },
            colors: ['#3b82f6', '#16a34a'],
            fill: {
                colors: [
                    '#3b82f6',
                    function({ dataPointIndex }) { return colors[dataPointIndex]; }
                ]
            },
            plotOptions: { bar: { borderRadius: 3, columnWidth: '65%', dataLabels: { position: 'top' } } },
            dataLabels: { enabled: false },
            legend: { position: 'top', fontSize: '12px' },
            tooltip: {
                y: { formatter: (val) => val.toLocaleString('id-ID') + ' Ha' },
                custom: function({ series, dataPointIndex, w }) {
                    const kec = semuaKec[dataPointIndex];
                    const t   = series[0][dataPointIndex];
                    const r   = series[1][dataPointIndex];
                    const pct = t > 0 ? Math.round((r / t) * 100) : '-';
                    let warna = '#16a34a';
                    if (typeof pct === 'number') {
                        if (pct < 50) warna = '#ef4444';
                        else if (pct < 80) warna = '#eab308';
                    }
                    return `<div class="p-3 text-xs font-sans">
                        <div class="font-bold text-gray-800 mb-1">${kec}</div>
                        <div>Target: <b>${t.toLocaleString('id-ID')} Ha</b></div>
                        <div>Realisasi: <b>${r.toLocaleString('id-ID')} Ha</b></div>
                        <div style="color:${warna}">Capaian: <b>${pct}%</b></div>
                    </div>`;
                }
            },
            yaxis: { labels: { formatter: (v) => v.toLocaleString('id-ID') + ' Ha', style: { fontSize: '10px' } } },
        });
        chartTarget.render();

        // Render Tabel Detail Target vs Realisasi
        let tableHTML = '';
        semuaKec.forEach((kec, i) => {
            const t = seriesTarget[i];
            const r = seriesRealisasi[i];
            const pct = t > 0 ? Math.round((r / t) * 100) : '-';
            
            let colorClass = 'text-gray-500';
            let badgeClass = 'bg-gray-100 text-gray-600';
            let barColor = 'bg-gray-200';
            
            if (pct !== '-') {
                if (pct >= 80) {
                    colorClass = 'text-green-600 font-bold';
                    badgeClass = 'bg-green-100 text-green-700';
                    barColor = 'bg-green-500';
                } else if (pct >= 50) {
                    colorClass = 'text-yellow-600 font-bold';
                    badgeClass = 'bg-yellow-100 text-yellow-700';
                    barColor = 'bg-yellow-500';
                } else {
                    colorClass = 'text-red-600 font-bold';
                    badgeClass = 'bg-red-100 text-red-700';
                    barColor = 'bg-red-500';
                }
            }

            let barWidth = pct !== '-' ? Math.min(pct, 100) : 0;

            tableHTML += `
            <tr class="border-b border-gray-50 hover:bg-gray-50 transition">
                <td class="p-3 font-bold text-gray-800 w-1/4">${kec}</td>
                <td class="p-3 text-right w-1/6">${t.toLocaleString('id-ID')}</td>
                <td class="p-3 text-right ${colorClass} w-1/6">${r.toLocaleString('id-ID')}</td>
                <td class="p-3 w-5/12">
                    <div class="flex items-center gap-3 w-full">
                        <div class="flex-grow bg-gray-100 rounded-full h-2.5 overflow-hidden border border-gray-200">
                            <div class="${barColor} h-2.5 rounded-full transition-all duration-500" style="width: ${barWidth}%"></div>
                        </div>
                        <span class="w-12 text-center px-2 py-1 ${badgeClass} text-[10px] font-bold rounded-full flex-shrink-0">${pct !== '-' ? pct + '%' : '-'}</span>
                    </div>
                </td>
            </tr>`;
        });
        document.getElementById('tabelTargetVsRealisasi').innerHTML = tableHTML;
        document.getElementById('tableTargetVsRealisasiContainer').classList.remove('hidden');
    }

    function renderTabelRekapLTT(data) {
        const tbody = document.getElementById('tbodyRekapLTT');
        const tfoot = document.getElementById('tfootRekapLTT');
        if (!tbody || !data) return;

        // Dapatkan semua daftar kecamatan yang memiliki data target / realisasi
        const targetKeys = data.target ? Object.keys(data.target) : [];
        const realKeys = data.realisasi ? Object.keys(data.realisasi) : [];
        
        const semuaKec = [...new Set([
            ...targetKeys,
            ...realKeys
        ])].sort();

        if (semuaKec.length === 0) {
            tbody.innerHTML = `<tr><td colspan="12" class="p-8 text-center text-gray-400 italic">Tidak ada data rekap LTT untuk periode ini.</td></tr>`;
            if (tfoot) tfoot.innerHTML = '';
            return;
        }

        // Variabel untuk menampung total per kolom
        const total = {
            padiReguler: { tanam: 0, panen: 0 },
            padiGogo:  { tanam: 0, panen: 0 },
            jagung:    { tanam: 0, panen: 0 },
            kedelai:   { tanam: 0, panen: 0 },
            ubiKayu:   { tanam: 0, panen: 0 }
        };

        let rowsHtml = '';
        const getCellClass = (val, bgClass = '', isLast = false) => {
            const weightClass = val > 0 ? 'font-bold text-gray-900' : 'font-normal text-gray-400';
            const borderClass = isLast ? '' : 'border-r border-gray-200';
            return `p-2 ${borderClass} text-right tabular-nums ${weightClass} ${bgClass}`;
        };

        semuaKec.forEach((kec, idx) => {
            const r = data.realisasi[kec] || {
                LTTReguler: { tanam: 0, panen: 0 },
                PadiGogo:   { tanam: 0, panen: 0 },
                Oplah2025:  { tanam: 0, panen: 0 },
                Jagung:     { tanam: 0, panen: 0 },
                UbiKayu:    { tanam: 0, panen: 0 }
            };

            // Padi Reguler = LTTReguler (karena Oplah & Rehab Bencana diabaikan sesuai permintaan user)
            const psTanam = r.LTTReguler?.tanam || 0;
            const psPanen = r.LTTReguler?.panen || 0;

            const pgTanam = r.PadiGogo?.tanam || 0;
            const pgPanen = r.PadiGogo?.panen || 0;

            const jgTanam = r.Jagung?.tanam || 0;
            const jgPanen = r.Jagung?.panen || 0;

            const kdTanam = 0; // Kedelai saat ini masih 0
            const kdPanen = 0;

            const ukTanam = r.UbiKayu?.tanam || 0;
            const ukPanen = r.UbiKayu?.panen || 0;

            total.padiReguler.tanam += psTanam;
            total.padiReguler.panen += psPanen;
            total.padiGogo.tanam  += pgTanam;
            total.padiGogo.panen  += pgPanen;
            total.jagung.tanam    += jgTanam;
            total.jagung.panen    += jgPanen;
            total.kedelai.tanam   += kdTanam;
            total.kedelai.panen   += kdPanen;
            total.ubiKayu.tanam   += ukTanam;
            total.ubiKayu.panen   += ukPanen;

            const rowBg = idx % 2 === 0 ? 'bg-white' : 'bg-gray-50/50';

            rowsHtml += `
            <tr class="${rowBg} hover:bg-blue-50/30 transition duration-150 border-b border-gray-100 text-xs">
                <td class="p-3 border-r border-gray-200 text-center text-gray-500 font-medium">${idx + 1}</td>
                <td class="p-3 border-r border-gray-200 font-semibold text-gray-800">${kec}</td>
                <td class="${getCellClass(psTanam, 'bg-green-50/10')}">${psTanam.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}</td>
                <td class="${getCellClass(psPanen, 'bg-green-50/10')}">${psPanen.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}</td>
                <td class="${getCellClass(pgTanam, '')}">${pgTanam.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}</td>
                <td class="${getCellClass(pgPanen, '')}">${pgPanen.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}</td>
                <td class="${getCellClass(jgTanam, 'bg-yellow-50/10')}">${jgTanam.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}</td>
                <td class="${getCellClass(jgPanen, 'bg-yellow-50/10')}">${jgPanen.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}</td>
                <td class="${getCellClass(kdTanam, '')}">${kdTanam.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}</td>
                <td class="${getCellClass(kdPanen, '')}">${kdPanen.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}</td>
                <td class="${getCellClass(ukTanam, 'bg-orange-50/10')}">${ukTanam.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}</td>
                <td class="${getCellClass(ukPanen, 'bg-orange-50/10', true)}">${ukPanen.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}</td>
            </tr>`;
        });

        tbody.innerHTML = rowsHtml;

        if (tfoot) {
            tfoot.innerHTML = `
            <tr class="bg-yellow-50 text-yellow-900 font-bold border-t border-gray-300">
                <td colspan="2" class="p-3 border-r border-gray-200 text-center uppercase tracking-wider">Jumlah</td>
                <td class="p-2 border-r border-gray-200 text-right tabular-nums">${total.padiReguler.tanam.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}</td>
                <td class="p-2 border-r border-gray-200 text-right tabular-nums">${total.padiReguler.panen.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}</td>
                <td class="p-2 border-r border-gray-200 text-right tabular-nums">${total.padiGogo.tanam.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}</td>
                <td class="p-2 border-r border-gray-200 text-right tabular-nums">${total.padiGogo.panen.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}</td>
                <td class="p-2 border-r border-gray-200 text-right tabular-nums">${total.jagung.tanam.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}</td>
                <td class="p-2 border-r border-gray-200 text-right tabular-nums">${total.jagung.panen.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}</td>
                <td class="p-2 border-r border-gray-200 text-right tabular-nums">${total.kedelai.tanam.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}</td>
                <td class="p-2 border-r border-gray-200 text-right tabular-nums">${total.kedelai.panen.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}</td>
                <td class="p-2 border-r border-gray-200 text-right tabular-nums">${total.ubiKayu.tanam.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}</td>
                <td class="p-2 text-right tabular-nums">${total.ubiKayu.panen.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}</td>
            </tr>`;
        }
    }

    function filterTarget(side) {
        filterTanamPanen = side;
        ['tanam','panen'].forEach(s => {
            const el = document.getElementById('btnTP-' + s);
            if (!el) return;
            el.classList.toggle('bg-green-600', s === side);
            el.classList.toggle('text-white',   s === side);
            el.classList.toggle('text-gray-500', s !== side);
        });
        renderChartTarget();
    }

    function filterKomTarget(jenisKey) {
        filterJenisTarget = jenisKey;
        Object.keys(LABEL_KOMODITI).forEach(k => {
            const el = document.getElementById('btnKom-' + k);
            if (!el) return;
            el.classList.toggle('bg-green-600',    k === jenisKey);
            el.classList.toggle('text-white',      k === jenisKey);
            el.classList.toggle('border-green-600', k === jenisKey);
            el.classList.toggle('text-gray-500',   k !== jenisKey);
            el.classList.toggle('bg-white',        k !== jenisKey);
            el.classList.toggle('border-gray-200', k !== jenisKey);
        });
        renderChartTarget();
    }

    // =========================================================================
    // FUNGSI UPDATE PROFIL MANDIRI (PPL & BPP)
    // =========================================================================

    // Semua 4 HTML dimuat sekaligus di Index.html sehingga ID elemen bisa
    // duplikat. Gunakan querySelector dengan scope container unik agar tidak
    // salah ambil elemen.
    function _profilQ(scope, id) {
        return document.querySelector(scope + ' #' + id);
    }

    function bukaProfil() {
        window.history.pushState({ overlay: 'profilArea' }, '');
        const isPPL  = (modePelanAktif === 'ppl');
        const scope  = isPPL ? '#profilArea' : '#modalProfilBPP';

        _profilQ(scope, 'profilId').value        = userAktif.id;
        _profilQ(scope, 'profilNIP').value        = userAktif.nip;
        _profilQ(scope, 'profilKecamatan').value  = userAktif.kecamatan;
        _profilQ(scope, 'profilNama').value       = userAktif.nama;

        const elDesa = _profilQ(scope, 'profilDesa');
        if (elDesa) elDesa.value = userAktif.desa;

        _profilQ(scope, 'profilPasswordLama').value       = '';
        _profilQ(scope, 'profilPasswordBaru').value       = '';
        _profilQ(scope, 'profilPasswordKonfirmasi').value = '';

        if (isPPL) {
            document.getElementById('profilArea').classList.remove('hidden');
        } else {
            const modal = document.getElementById('modalProfilBPP');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }
    }

    function _tutupProfilDOM() {
        const isPPL = (modePelanAktif === 'ppl');
        if (isPPL) {
            const pArea = document.getElementById('profilArea');
            if (pArea) {
                document.querySelector('#profilArea form').reset();
                pArea.classList.add('hidden');
                setNavAktif('navHome');
            }
        } else {
            const modal = document.getElementById('modalProfilBPP');
            if (modal) {
                document.querySelector('#modalProfilBPP form').reset();
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }
    }

    function tutupProfil() {
        _tutupProfilDOM();
        if (window.history.state && window.history.state.overlay === 'profilArea') {
            window.history.back();
        }
    }

    function submitProfil(e) {
        e.preventDefault();

        // Deteksi container aktif dari form yang di-submit
        const isPPL = e.target.closest('#profilArea') !== null;
        const scope  = isPPL ? '#profilArea' : '#modalProfilBPP';
        const q      = (id) => _profilQ(scope, id);

        const id         = q('profilId').value;
        const nama       = q('profilNama').value.trim();
        const passwordLama    = q('profilPasswordLama').value;
        const passwordBaru    = q('profilPasswordBaru').value;
        const passwordKonfirm = q('profilPasswordKonfirmasi').value;

        if (!nama) {
            Swal.fire('Peringatan', 'Nama Lengkap tidak boleh kosong.', 'warning'); return;
        }
        if (!passwordLama) {
            Swal.fire('Peringatan', 'Password Aktif Saat Ini wajib diisi untuk konfirmasi.', 'warning'); return;
        }
        if (passwordBaru && passwordBaru.length < 4) {
            Swal.fire('Peringatan', 'Password Baru minimal harus 4 karakter.', 'warning'); return;
        }
        if (passwordBaru && passwordBaru !== passwordKonfirm) {
            Swal.fire('Peringatan', 'Password Baru dan Konfirmasi Password tidak cocok.', 'warning'); return;
        }

        const btnSimpan = q('btnSimpanProfil');
        btnSimpan.disabled = true;
        q('ikonSimpanProfil').className  = 'fa-solid fa-circle-notch fa-spin';
        q('teksSimpanProfil').textContent = 'Menyimpan...';

        google.script.run
            .withSuccessHandler(function(res) {
                btnSimpan.disabled = false;
                q('ikonSimpanProfil').className  = 'fa-solid fa-floppy-disk';
                q('teksSimpanProfil').textContent = isPPL ? 'Simpan Perubahan' : 'Simpan';

                if (res.status === 'success') {
                    userAktif = res.data;
                    localStorage.setItem('user_eLTT', JSON.stringify(res.data));
                    if (modePelanAktif === 'ppl') {
                        inisialisasiPPL();
                    } else {
                        inisialisasiBPP();
                    }
                    Swal.fire('Berhasil!', res.message, 'success').then(() => tutupProfil());
                } else {
                    Swal.fire('Gagal Menyimpan', res.message, 'error');
                }
            })
            .withFailureHandler(function(err) {
                btnSimpan.disabled = false;
                q('ikonSimpanProfil').className  = 'fa-solid fa-floppy-disk';

    function toggleTargetBulanan() {

        const icon = document.getElementById('iconToggleTarget');
        const text = document.getElementById('textToggleTarget');
        if (!targetDiv || !icon || !text) return;
        
        const isHidden = targetDiv.classList.contains('hidden');
        if (isHidden) {

            icon.className = 'fa-solid fa-chevron-up';
            text.innerText = 'Sembunyikan';

                const container = document.getElementById('formPPLDesaContainer');
                if (container) {
                    container.innerHTML = `<span class="text-xs text-red-500 font-medium">Gagal memuat desa binaan: ${err.message || 'Koneksi gagal'}</span>`;

    function renderChecklistDesa(checkedDesaList) {
        const container = document.getElementById('formPPLDesaContainer');
        if (!container) return;
        
        if (daftarDesaKecamatanLokal.length === 0) {
            container.innerHTML = '<span class="text-xs text-gray-400 italic">Belum ada data desa terdaftar untuk kecamatan ini. Silakan hubungi Admin Kabupaten.</span>';
            return;
        }
        
        const checkedSet = new Set(
            (checkedDesaList || []).map(d => d.toString().toLowerCase().trim())
        );
        
        container.innerHTML = daftarDesaKecamatanLokal.map((desa, idx) => {
            const isChecked = checkedSet.has(desa.toLowerCase().trim()) ? 'checked' : '';
            return `
                <label class="flex items-center gap-2.5 px-3 py-2 hover:bg-green-50 rounded-xl cursor-pointer transition select-none text-xs text-gray-700 font-semibold border border-transparent hover:border-green-100 bg-white shadow-sm">
                    <input type="checkbox" name="pplDesaBinaan" value="${desa}" ${isChecked}
                        class="w-4 h-4 text-green-600 rounded border-gray-300 focus:ring-green-500 cursor-pointer transition">
                    <span>Desa ${desa}</span>
                </label>
            `;
        }).join('');
    }

    function muatDaftarPPL() {
        const tbody = document.getElementById('tabelPPL');
        if (!tbody) return;
        tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-green-500 mb-2 block"></i> Memuat data Penyuluh...</td></tr>';
        
        google.script.run
            .withSuccessHandler(function(res) {
                daftarPPLLokal = res || [];
                renderTabelPPL();
            })
            .withFailureHandler(function(err) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-500 font-medium">Gagal memuat data: ${err.message || 'Koneksi gagal'}</td></tr>`;
            })
            .getDaftarPPLbyKecamatan(userAktif.kecamatan, userAktif.nip);

    function renderTabelPPL() {
        const tbody = document.getElementById('tabelPPL');
        if (!tbody) return;
        
        if (daftarPPLLokal.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-gray-400 italic">Belum ada akun Penyuluh terdaftar di kecamatan ini.</td></tr>';
            return;
        }

        tbody.innerHTML = daftarPPLLokal.map((u, i) => {
            const opacityClass = u.status === 'Nonaktif' ? 'opacity-50' : '';
            const statusBadge = u.status === 'Aktif' 
                ? '<span class="bg-green-100 text-green-700 px-2 py-1 rounded-full text-[10px] font-bold">Aktif</span>' 
                : '<span class="bg-red-100 text-red-700 px-2 py-1 rounded-full text-[10px] font-bold">Nonaktif</span>';
            
            const toggleIcon = u.status === 'Aktif' ? 'fa-toggle-on text-green-600' : 'fa-toggle-off text-gray-400';
            const toggleTitle = u.status === 'Aktif' ? 'Nonaktifkan Akun' : 'Aktifkan Akun';
            
            const btnHapus = u.status === 'Nonaktif'
                ? `<button onclick="hapusPPL(${i})" title="Hapus Permanen" class="w-8 h-8 bg-red-50 text-red-600 rounded-lg hover:bg-red-600 hover:text-white transition shadow-sm flex items-center justify-center"><i class="fa-solid fa-trash-can"></i></button>`
                : '';

            return `
            <tr class="border-b border-gray-50 hover:bg-gray-50/80 transition ${opacityClass}">
                <td class="p-4 text-center text-xs text-gray-500">${i + 1}</td>
                <td class="p-4 font-bold text-gray-800">${u.nama}</td>
                <td class="p-4 text-xs font-mono text-gray-600">${u.nip}</td>
                <td class="p-4 text-xs text-gray-600">${u.desa || '-'}</td>
                <td class="p-4 text-center">${statusBadge}</td>
                <td class="p-4 text-center">
                    <div class="flex justify-center gap-2">
                        <button onclick="bukaEditPPL(${i})" title="Edit Data" class="w-8 h-8 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-600 hover:text-white transition shadow-sm flex items-center justify-center"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="bukaResetPasswordPPL(${i})" title="Reset Password" class="w-8 h-8 bg-yellow-50 text-yellow-600 rounded-lg hover:bg-yellow-600 hover:text-white transition shadow-sm flex items-center justify-center"><i class="fa-solid fa-key"></i></button>
                        <button onclick="toggleStatusPPL(${i})" title="${toggleTitle}" class="w-8 h-8 bg-gray-50 rounded-lg hover:bg-gray-200 transition shadow-sm flex items-center justify-center"><i class="fa-solid ${toggleIcon} text-lg"></i></button>
                        ${btnHapus}
                    </div>
                </td>
            </tr>`;
        }).join('');
    }

    function bukaEditPPL(idx) {
        window.history.pushState({ overlay: 'modalFormPPL' }, '');
        const u = daftarPPLLokal[idx];
        if (!u) return;

        _mppQ('formPPLId').value = u.id;

    function submitFormPPL(event) {
        event.preventDefault();
        
        const id = _mppQ('formPPLId').value;
        const nama = _mppQ('formPPLNama').value.trim();
        const nip = _mppQ('formPPLNip').value.trim();
        const password = _mppQ('formPPLPassword').value;
        const status = _mppQ('formPPLStatus').value;
        
        // Ambil semua desa yang dicentang
        const checkedDesas = document.querySelectorAll('#formPPLDesaContainer input[name="pplDesaBinaan"]:checked');
        const desaArr = Array.from(checkedDesas).map(cb => cb.value.trim());
        const desa = desaArr.join(', ');
        
        if (!nama) {
            Swal.fire('Peringatan', 'Nama Lengkap wajib diisi.', 'warning');
            return;
        }
        if (!nip) {
            Swal.fire('Peringatan', 'NIP / Username wajib diisi.', 'warning');
            return;
        }
        if (desaArr.length === 0) {
            Swal.fire('Peringatan', 'Silakan pilih minimal satu desa binaan.', 'warning');
            return;
        }
        
        const isEdit = id !== '';
        
        if (!isEdit) {
            if (!password || password.length < 4) {
                Swal.fire('Peringatan', 'Password wajib diisi dan minimal 4 karakter.', 'warning');
                return;
            }
        }
        
        const btn = document.getElementById('btnSimpanPPL');
        const oldHtml = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Menyimpan...';
        
        if (isEdit) {
            const u = { id: id, nama: nama, nip: nip, desa: desa, status: status };
            google.script.run
                .withSuccessHandler(function(res) {
                    btn.disabled = false;
                    btn.innerHTML = oldHtml;
                    if (res.status === 'success') {
                        Swal.fire({ icon: 'success', title: 'Berhasil', text: res.message, timer: 1800, showConfirmButton: false });
                        tutupModalPPL();
                        muatDaftarPPL();
                    } else {
                        Swal.fire('Gagal', res.message, 'error');
                    }
                })
                .withFailureHandler(function(err) {
                    btn.disabled = false;
                    btn.innerHTML = oldHtml;
                    Swal.fire('Error', 'Gagal menghubungi server: ' + err.message, 'error');
                })
                .updateDataPPL(u);
        } else {
            const u = {
                id: '',
                nama: nama,
                nip: nip,
                password: password,
                role: 'Penyuluh',
                kecamatan: userAktif.kecamatan,
                desa: desa,
                status: status
            };
            google.script.run
                .withSuccessHandler(function(res) {
                    btn.disabled = false;
                    btn.innerHTML = oldHtml;
                    if (res.status === 'success') {
                        Swal.fire({ icon: 'success', title: 'Berhasil', text: res.message, timer: 1800, showConfirmButton: false });
                        tutupModalPPL();
                        muatDaftarPPL();
                    } else {
                        Swal.fire('Gagal', res.message, 'error');
                    }
                })
                .withFailureHandler(function(err) {
                    btn.disabled = false;
                    btn.innerHTML = oldHtml;
                    Swal.fire('Error', 'Gagal menghubungi server: ' + err.message, 'error');
                })
                .simpanDataUser(u);
        }
    }

    function submitResetPasswordPPL(event) {
        event.preventDefault();
        
        const id = _mrpQ('resetPPLId').value;
        const nip = _mrpQ('resetPPLNip').value;
        const passwordBaru = _mrpQ('resetPPLPasswordBaru').value;
        const passwordKonfirm = _mrpQ('resetPPLPasswordKonfirmasi').value;
        
        if (!passwordBaru || passwordBaru.length < 4) {

            return;

        if (passwordBaru !== passwordKonfirm) {
            Swal.fire('Peringatan', 'Password Baru dan Konfirmasi Password tidak cocok.', 'warning');
            return;
        }
        
        const btn = document.getElementById('btnResetPasswordPPL');
        const oldHtml = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Memproses...';
        
        google.script.run
            .withSuccessHandler(function(res) {
                btn.disabled = false;
                btn.innerHTML = oldHtml;
                if (res.status === 'success') {
                    Swal.fire({ icon: 'success', title: 'Berhasil', text: res.message, timer: 1800, showConfirmButton: false });
                    tutupModalResetPassword();
                    muatDaftarPPL();
                } else {
                    Swal.fire('Gagal', res.message, 'error');
                }
            })
            .withFailureHandler(function(err) {
                btn.disabled = false;
                btn.innerHTML = oldHtml;
                Swal.fire('Error', 'Gagal menghubungi server: ' + err.message, 'error');
            })
            .resetPasswordPPL(id, passwordBaru, userAktif.id);

    function toggleStatusPPL(idx) {
        const u = daftarPPLLokal[idx];
        if (!u) return;
        
        const statusBaru = u.status === 'Aktif' ? 'Nonaktif' : 'Aktif';
        const kataTindakan = statusBaru === 'Aktif' ? 'mengaktifkan' : 'menonaktifkan';
        
        Swal.fire({
            title: `Apakah Anda yakin?`,
            text: `Anda akan ${kataTindakan} akun Penyuluh: ${u.nama}`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Ya, Lakukan',
            cancelButtonText: 'Batal',
            confirmButtonColor: statusBaru === 'Aktif' ? '#16a34a' : '#d33'
        }).then((result) => {
            if (result.isConfirmed) {
                Swal.fire({
                    title: 'Memproses...',
                    allowOutsideClick: false,
                    didOpen: () => { Swal.showLoading(); }
                });
                
                const dataUpdate = {
                    id: u.id,
                    nama: u.nama,
                    nip: u.nip,
                    desa: u.desa,
                    status: statusBaru
                };
                
                google.script.run
                    .withSuccessHandler(function(res) {
                        Swal.close();
                        if (res.status === 'success') {
                            Swal.fire({ icon: 'success', title: 'Berhasil', text: `Akun berhasil di${statusBaru === 'Aktif' ? 'aktifkan' : 'nonaktifkan'}.`, timer: 1500, showConfirmButton: false });
                            muatDaftarPPL();
                        } else {
                            Swal.fire('Gagal', res.message, 'error');
                        }
                    })
                    .withFailureHandler(function(err) {
                        Swal.close();
                        Swal.fire('Error', 'Gagal menghubungi server: ' + err.message, 'error');
                    })
                    .updateDataPPL(dataUpdate);
            }
        });
    }
