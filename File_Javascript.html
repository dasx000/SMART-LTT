  let chartCapaianKab = null;
  let chartDonut = null;
  let chartTren = null;
  let chartPmAasTanam = null;
  let _lttPmAasLoaded = false;
  let _currentTargetPmAas = '';
  let komoditasCapaianAktif = 'Padi';
  let timerLogin = null;
  let lastDashData = null;
  let lastPmAasData = null;
  let lastRekapData = null;
  let lastRekapLTTData = null;
  let allUserData = [];

  let daftarDesaKecamatanLokal = [];

  // =========================================================================
  // DESIMAL HELPERS — koma sebagai pemisah desimal di UI, titik di server
  // =========================================================================
  function _parseDesimal(val) {
    if (val === null || val === undefined) return 0;
    return parseFloat(String(val).replace(',', '.')) || 0;
  }

  function _toKoma(val) {
    if (val === '' || val === null || val === undefined) return '';
    var n = parseFloat(val);
    if (isNaN(n)) return '';
    return n.toString().replace('.', ',');
  }

  // Format angka untuk tampilan: ribuan pakai titik, desimal pakai koma
  // Contoh: _numId(1500.5) → "1.500,5"  |  _numId(1.25) → "1,25"
  function _numId(n, maxDec) {
    if (typeof n !== 'number' || isNaN(n)) n = parseFloat(n) || 0;
    maxDec = maxDec !== undefined ? maxDec : 2;
    var str = n.toFixed(maxDec);
    var parts = str.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    var dec = parts[1] ? parts[1].replace(/0+$/, '') : '';
    return dec ? parts[0] + ',' + dec : parts[0];
  }

  function _bindDesimal(el) {
    if (!el || el.dataset.desimalBound) return;
    el.dataset.desimalBound = '1';
    el.addEventListener('keydown', function (e) {
      if (e.key === '.') {
        e.preventDefault();
        // Konversi titik → koma otomatis, hanya jika belum ada koma
        if (this.value.indexOf(',') === -1) {
          var s = this.selectionStart,
            en = this.selectionEnd;
          this.value =
            this.value.substring(0, s) + ',' + this.value.substring(en);
          try {
            this.setSelectionRange(s + 1, s + 1);
          } catch (_) {}
          this.dispatchEvent(new Event('input'));
        }
      }
    });
    el.addEventListener('input', function () {
      var pos = this.selectionStart;
      var val = this.value.replace(/\./g, ',').replace(/[^0-9,]/g, '');
      var parts = val.split(',');
      if (parts.length > 2) val = parts[0] + ',' + parts.slice(1).join('');
      if (this.value !== val) {
        this.value = val;
        try {
          this.setSelectionRange(pos, pos);
        } catch (e) {}
      }
    });
    el.addEventListener('paste', function (e) {
      e.preventDefault();
      var pasted = (e.clipboardData || window.clipboardData).getData('text');
      var clean = pasted.replace(/\./g, ',').replace(/[^0-9,]/g, '');
      var parts = clean.split(',');
      if (parts.length > 2) clean = parts[0] + ',' + parts.slice(1).join('');
      document.execCommand('insertText', false, clean);
    });
  }

  // =========================================================================
  // 1. INITIALIZATION & SESSION CHECK
  // =========================================================================
  function loadExcelJS() {
    return new Promise(function (resolve, reject) {
      if (window.ExcelJS) {
        resolve();
        return;
      }
      const s = document.createElement('script');
      s.src =
        'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
      s.onload = resolve;
      s.onerror = function () {
        reject(new Error('Gagal memuat library ExcelJS'));
      };
      document.head.appendChild(s);
    });
  }

  window.onload = function () {
    [
      'inputTanam',
      'inputPanen',
      'editLaporanTanam',
      'editLaporanPanen',
      'tgtTotalTarget',
      'tgtIPEksisting',
      'tgtLuasBaku',
      'tgtStandingCrop',
    ].forEach(function (id) {
      _bindDesimal(document.getElementById(id));
    });
    cekSesi();
  };

  function cekSesi() {
    const userData = localStorage.getItem('user_eLTT');
    if (!userData) {
      tampilkanLayar('layar-login');
      document.getElementById('viewLoading').classList.add('hidden');
      document.getElementById('viewLogin').classList.remove('hidden');
      return;
    }

    try {
      userAktif = JSON.parse(userData);
      prosesBerhasilLogin(userAktif);
    } catch (e) {
      localStorage.removeItem('user_eLTT');
      tampilkanLayar('layar-login');
      document.getElementById('viewLoading').classList.add('hidden');
      document.getElementById('viewLogin').classList.remove('hidden');
    }
  }

  function tampilkanLayar(idLayar) {
    document.getElementById('layar-login').classList.add('hidden');
    document.getElementById('layar-ppl').classList.add('hidden');
    document.getElementById('layar-bpp').classList.add('hidden');
    document.getElementById('layar-admin').classList.add('hidden');

    document.getElementById(idLayar).classList.remove('hidden');
  }

  function toggleSidebar(forceClose = false) {
    const sidebar = document.getElementById('sidebarAdmin');
    const overlay = document.getElementById('sidebarOverlay');
    if (!sidebar || !overlay) return;

    const isDesktop = window.innerWidth >= 768;

    if (isDesktop) {
      // Pada desktop, abaikan forceClose dari klik menu navigasi
      if (!forceClose) {
        sidebar.classList.toggle('md:-ml-64');
      }
    } else {
      // Logika Mobile
      if (forceClose) {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
      } else {
        sidebar.classList.toggle('-translate-x-full');
        overlay.classList.toggle('hidden');
      }
    }
  }

  function prosesBerhasilLogin(userData) {
    userAktif = userData;
    localStorage.setItem('user_eLTT', JSON.stringify(userData));

    if (userData.role === 'Penyuluh' || userData.role === 'Admin_BPP') {
      modePelanAktif = 'ppl';
      tampilkanLayar('layar-ppl');
      inisialisasiPPL();
    } else if (userData.role === 'Admin_Kab' || userData.role === 'Dinas') {
      tampilkanLayar('layar-admin');
      inisialisasiAdmin();
    } else {
      Swal.fire('Akses Ditolak', 'Role tidak dikenali.', 'error');
      logout();
    }
  }

  // =========================================================================
  // 2. LOGIN LOGIC
  // =========================================================================
  function handleLogin(e) {
    e.preventDefault();
    if (!navigator.onLine) {
      Swal.fire('Koneksi Terputus!', 'Periksa sinyal internet Anda.', 'error');
      return;
    }
    const nip = document.getElementById('nip').value;
    const password = document.getElementById('password').value;

    setBtnState(true, 'Memverifikasi...');
    clearTimeout(timerLogin);
    timerLogin = setTimeout(function () {
      setBtnState(false, 'Masuk Sekarang');
      Swal.fire('Waktu Habis', 'Server tidak merespons. Coba lagi.', 'warning');
    }, 30000);

    google.script.run
      .withSuccessHandler(function (response) {
        clearTimeout(timerLogin);
        setBtnState(false, 'Masuk Sekarang');
        if (response.status === 'success') {
          prosesBerhasilLogin(response.data);
        } else {
          Swal.fire('Gagal Login', response.message, 'error');
        }
      })
      .withFailureHandler(function (error) {
        clearTimeout(timerLogin);
        setBtnState(false, 'Masuk Sekarang');
        Swal.fire('Server Error', error.message || error, 'error');
      })
      .prosesLogin(nip, password);
  }

  function setBtnState(loading, text) {
    const btn = document.getElementById('btnLogin');
    if (!btn) return;
    document.getElementById('loginText').innerText = text;
    btn.disabled = loading;
    btn.classList.toggle('opacity-75', loading);
    document
      .getElementById('loginSpinner')
      .classList.toggle('hidden', !loading);
  }

  // =========================================================================
  // 3. PPL DASHBOARD LOGIC
  // =========================================================================
  function inisialisasiPPL() {
    document.getElementById('namaPenyuluh').innerText = userAktif.nama;
    document.getElementById('wilayahPenyuluh').innerText =
      'WKPP: ' + userAktif.desa;
    jalankanLogikaWaktu();

    // Tombol Produktivitas hanya untuk Koordinator BPP
    const wrapProd = document.getElementById('wrapBtnProduktivitas');
    if (wrapProd) {
      wrapProd.classList.toggle('hidden', userAktif.role !== 'Admin_BPP');
    }

    // Cek visibilitas tombol jembatan BPP
    const btnJembatan = document.getElementById('btnJembatanBPP');
    if (btnJembatan) {
      if (userAktif.role === 'Admin_BPP') {
        btnJembatan.classList.remove('hidden');
      } else {
        btnJembatan.classList.add('hidden');
      }
    }
  }

  function jalankanLogikaWaktu() {
    const jam = new Date().getHours();
    if (jam >= 24) {
      // Diubah sementara untuk debugging (sebelumnya 14)
      document
        .getElementById('statusWaktu')
        .classList.replace('border-green-500', 'border-red-500');
      document.getElementById('teksStatusWaktu').innerText =
        'Ditutup (Otomatis Nihil)';
      document
        .getElementById('teksStatusWaktu')
        .classList.replace('text-green-600', 'text-red-600');
      document
        .getElementById('ikonStatusWaktu')
        .classList.replace('fa-lock-open', 'fa-lock');
      document
        .getElementById('ikonStatusWaktu')
        .classList.replace('text-green-500', 'text-red-500');

      document.querySelectorAll('.btn-komoditas').forEach((btn) => {
        btn.classList.add('opacity-40', 'grayscale');
        btn.onclick = function (e) {
          e.stopPropagation();
          Swal.fire(
            'Batas Waktu Habis!',
            'Pelaporan ditutup pukul 14:00 WIB.',
            'info',
          );
        };
      });
    }
  }

  function setNavAktif(idNav) {
    ['navHome', 'navPadi', 'navJagung', 'navUbiKayu', 'navAkun'].forEach(
      (id) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.toggle('text-green-600', id === idNav);
        el.classList.toggle('text-gray-400', id !== idNav);
      },
    );
  }

  function _tutupSemuaOverlayPPL() {
    const profilArea = document.getElementById('profilArea');
    if (profilArea) profilArea.classList.add('hidden');
    document.getElementById('formArea').classList.add('hidden');
  }

  function tampilkanHomePPL() {
    _tutupSemuaOverlayPPL();
    document.getElementById('headerPPL').classList.remove('hidden');
    document.getElementById('containerHomePPL').classList.remove('hidden');
    setNavAktif('navHome');
  }

  function bukaForm(komoditas) {
    _tutupSemuaOverlayPPL();
    window.history.pushState({ overlay: 'formArea' }, '');
    document.getElementById('headerPPL').classList.add('hidden');
    document.getElementById('containerHomePPL').classList.add('hidden');
    document.getElementById('formArea').classList.remove('hidden');
    document.getElementById('judulForm').innerText = komoditas;
    muatRingkasanPPL(komoditas);
    const navMap = {
      Padi: 'navPadi',
      Jagung: 'navJagung',
      'Ubi Kayu': 'navUbiKayu',
    };
    setNavAktif(navMap[komoditas] || 'navHome');
  }

  function renderListLaporan(komoditas, data) {
    const el = document.getElementById('listLaporanHariIni');
    if (data.length === 0) {
      const pesan =
        komoditas === 'Padi'
          ? 'Data padi muncul setelah pukul 12.00<br><span style="font-size:10px;font-weight:400;text-transform:none;letter-spacing:0">Hanya menampilkan data dengan nilai bera, olah lahan, tanam, atau panen lebih dari 0</span>'
          : `Belum ada laporan<br>${komoditas} hari ini`;
      el.innerHTML = `<div class="bg-gray-50 border-2 border-dotted border-gray-200 rounded-2xl p-8 text-center"><i class="fa-solid fa-clipboard-list text-gray-300 text-4xl mb-3 block"></i><p class="text-gray-400 text-xs font-bold uppercase tracking-wider">${pesan}</p></div>`;
      return;
    }
    el.innerHTML = data
      .map((l) => {
        const isTemp = l.id && l.id.startsWith('TEMP-');
        const isSync = l.id && l.id.startsWith('SYNC-');
        const accentColor = isTemp
          ? 'bg-gray-300'
          : l.status === 'Menunggu'
            ? 'bg-yellow-400'
            : 'bg-green-500';
        const statusColor = isTemp
          ? 'bg-gray-50 text-gray-400 border border-gray-100'
          : l.status === 'Menunggu'
            ? 'bg-yellow-50 text-yellow-600 border border-yellow-100'
            : 'bg-green-50 text-green-600 border border-green-100';
        const statusIcon = isTemp
          ? 'fa-circle-notch fa-spin'
          : isSync
            ? 'fa-cloud-arrow-down'
            : l.status === 'Menunggu'
              ? 'fa-clock'
              : 'fa-check-circle';
        const statusLabel = isTemp
          ? 'Mengirim...'
          : isSync
            ? l.jenis_ltt || 'Tersinkron'
            : l.status === 'Menunggu'
              ? 'Menunggu Verifikasi'
              : l.status;
        const jamDisplay = isSync ? l.jam : `${l.jam} WIB`;
        return `<div class="bg-white border border-gray-200 rounded-2xl p-4 shadow-md animate__animated animate__fadeInUp relative overflow-hidden${isTemp ? ' opacity-60' : ''}">
                <div class="absolute left-0 top-0 bottom-0 w-1 ${accentColor}"></div>
                <div class="pl-2">
                    <div class="flex justify-between items-start mb-1">
                        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">${jamDisplay}</p>
                        <span class="inline-flex items-center text-[8px] px-2 py-0.5 rounded-lg font-bold uppercase tracking-tighter ${statusColor}"><i class="fa-solid ${statusIcon} mr-1"></i>${statusLabel}</span>
                    </div>
                    <h4 class="font-bold text-gray-800 text-base">Desa ${l.desa}</h4>
                    <div class="flex justify-between items-center mt-3 flex-wrap gap-2">
                        <div class="flex gap-2">
                            <div class="bg-blue-50 border border-blue-100 px-3 py-1.5 rounded-xl flex items-center gap-2"><span class="text-[9px] font-bold text-blue-400 uppercase">Tanam</span><span class="text-xs font-black text-blue-700">${_numId(l.tanam)} <small class="font-bold">Ha</small></span></div>
                            <div class="bg-orange-50 border border-orange-100 px-3 py-1.5 rounded-xl flex items-center gap-2"><span class="text-[9px] font-bold text-orange-400 uppercase">Panen</span><span class="text-xs font-black text-orange-700">${_numId(l.panen)} <small class="font-bold">Ha</small></span></div>
                        </div>
                        ${!isTemp && !isSync && l.status === 'Menunggu' ? `<button onclick="bukaFormEditLaporan('${komoditas}', '${l.id}')" class="bg-green-600 hover:bg-green-700 text-white shadow-sm px-3 py-1.5 rounded-xl text-[10px] font-bold uppercase transition-colors active:scale-95"><i class="fa-solid fa-pen mr-1"></i> Edit</button>` : ''}
                    </div>
                </div>
            </div>`;
      })
      .join('');
  }

  function tampilkanStealthLoader(show) {
    const el = document.getElementById('stealthLoader');
    if (el) el.classList.toggle('hidden', !show);
  }

  function tampilkanLoadingUtama(show) {
    if (show)
      document.getElementById('listLaporanHariIni').innerHTML =
        '<div class="text-center p-8"><i class="fa-solid fa-circle-notch fa-spin text-green-500 text-2xl"></i></div>';
  }

  function updateCacheAndRender(komoditas, newData) {
    tampilkanStealthLoader(false);
    const prev = cacheLaporanPPL[komoditas];
    if (!prev || JSON.stringify(prev.data) !== JSON.stringify(newData)) {
      cacheLaporanPPL[komoditas] = { data: newData, ts: Date.now() };
      renderListLaporan(komoditas, newData);
    }
  }

  function muatRingkasanPPL(komoditas) {
    document.getElementById('areaRingkasanPPL').classList.remove('hidden');
    document.getElementById('formInputan').classList.add('hidden');

    const btnTambah = document.getElementById('btnTambahLaporan');
    if (btnTambah) btnTambah.classList.toggle('hidden', komoditas === 'Padi');
    const infoNihil = document.getElementById('infoNihilLaporan');
    if (infoNihil) infoNihil.classList.toggle('hidden', komoditas === 'Padi');

    const cached = cacheLaporanPPL[komoditas];
    if (cached) {
      renderListLaporan(komoditas, cached.data);
      tampilkanStealthLoader(true);
    } else {
      tampilkanLoadingUtama(true);
    }

    if (komoditas === 'Padi') {
      google.script.run
        .withSuccessHandler(function (res) {
          const dataPadi =
            res.status === 'sudah'
              ? res.rows.map(function (r, idx) {
                  return {
                    id: 'SYNC-' + Date.now() + '-' + idx,
                    desa: r.desa,
                    tanam: r.tanam,
                    panen: r.panen,
                    jenis_ltt: r.jenis_ltt,
                    jam: 'Hasil Sync',
                  };
                })
              : [];
          updateCacheAndRender(komoditas, dataPadi);
        })
        .withFailureHandler(function (err) {
          tampilkanStealthLoader(false);
          if (!cached)
            document.getElementById('listLaporanHariIni').innerHTML =
              '<p class="text-red-500 text-center text-xs">Error Koneksi: ' +
              err.message +
              '</p>';
        })
        .cekStatusPadiHarian(userAktif.desa);
    } else {
      google.script.run
        .withSuccessHandler(function (res) {
          if (res.status === 'success') {
            updateCacheAndRender(komoditas, res.data);
          } else {
            tampilkanStealthLoader(false);
            if (!cached)
              document.getElementById('listLaporanHariIni').innerHTML =
                '<p class="text-red-500 text-center text-xs">Gagal: ' +
                res.message +
                '</p>';
          }
        })
        .withFailureHandler(function (err) {
          tampilkanStealthLoader(false);
          if (!cached)
            document.getElementById('listLaporanHariIni').innerHTML =
              '<p class="text-red-500 text-center text-xs">Error Koneksi: ' +
              err.message +
              '</p>';
        })
        .getLaporanPPLHariIni(userAktif.nama, komoditas, userAktif.desa);
    }
  }

  function tampilkanFormInput() {
    const komoditas = document.getElementById('judulForm').innerText;
    document.getElementById('areaRingkasanPPL').classList.add('hidden');
    document.getElementById('formInputan').classList.remove('hidden');
    document.getElementById('inputKomoditas').value = komoditas;

    idLaporanSedangDiedit = null;

    if (document.getElementById('submitText')) {
      document.getElementById('submitText').innerText = 'Kirim Laporan';
    }

    const selectDesa = document.getElementById('inputDesa');
    selectDesa.innerHTML = `<option value="" disabled selected>-- Pilih Desa --</option>`;
    userAktif.desa.split(',').forEach((d) => {
      selectDesa.innerHTML += `<option value="${d.trim()}">${d.trim()}</option>`;
    });
  }

  function bukaFormEditLaporan(komoditas, id) {
    const cached = cacheLaporanPPL[komoditas];
    if (!cached) return;
    const l = cached.data.find((x) => x.id === id);
    if (!l) return;

    tampilkanFormInput();

    idLaporanSedangDiedit = l.id;
    if (document.getElementById('submitText')) {
      document.getElementById('submitText').innerText = 'Simpan Perubahan';
    }

    // Set the inputs
    setTimeout(() => {
      document.getElementById('inputDesa').value = (l.desa || '').trim();
      document.getElementById('inputTanam').value = _toKoma(l.tanam);
      document.getElementById('inputPanen').value = _toKoma(l.panen);
      // We do not have keterangan in the list item, but let's clear it or leave empty
      if (document.getElementById('inputKeterangan')) {
        document.getElementById('inputKeterangan').value = l.keterangan || '';
      }
    }, 100);
  }

  function _tutupFormDOM() {
    document.getElementById('formArea').classList.add('hidden');
    document.getElementById('formInputan').reset();
    document.getElementById('headerPPL').classList.remove('hidden');
    document.getElementById('containerHomePPL').classList.remove('hidden');
    setNavAktif('navHome');
  }

  function tutupForm() {
    _tutupFormDOM();
    if (window.history.state && window.history.state.overlay === 'formArea') {
      window.history.back();
    }
  }

  function submitData(e) {
    e.preventDefault();
    const komoditas = document.getElementById('inputKomoditas').value;

    const formData = {
      pelapor: userAktif.nama,
      nip: userAktif.nip,
      kecamatan: userAktif.kecamatan,
      desa: document.getElementById('inputDesa').value,
      komoditas: komoditas,
      jenis_ltt: 'LTT',
      target_tanam: 0,
      target_panen: 0,
      luas_bera: 0,
      olah_lahan: 0,
      luas_tanam: _parseDesimal(document.getElementById('inputTanam').value),
      luas_panen: _parseDesimal(document.getElementById('inputPanen').value),
      keterangan: document.getElementById('inputKeterangan')
        ? document.getElementById('inputKeterangan').value
        : '-',
    };

    const btnSubmit = document.getElementById('btnSubmit');
    const originalBtnContent = btnSubmit ? btnSubmit.innerHTML : '';
    
    if (btnSubmit) {
      btnSubmit.disabled = true;
      btnSubmit.classList.add('opacity-70', 'cursor-not-allowed');
      btnSubmit.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span id="submitText">Mengirim...</span>';
    }

    if (idLaporanSedangDiedit) {
      google.script.run
        .withSuccessHandler(function (res) {
          if (btnSubmit) {
            btnSubmit.disabled = false;
            btnSubmit.classList.remove('opacity-70', 'cursor-not-allowed');
            btnSubmit.innerHTML = originalBtnContent;
          }
          if (res.status === 'success') {
            document.getElementById('formInputan').classList.add('hidden');
            document.getElementById('formInputan').reset();
            document.getElementById('areaRingkasanPPL').classList.remove('hidden');
            Swal.fire({
              icon: 'success',
              title: 'Tersimpan!',
              timer: 1500,
              showConfirmButton: false,
            });
            muatRingkasanPPL(komoditas);
          } else {
            Swal.fire('Gagal!', res.message || 'Data gagal diubah.', 'error');
          }
        })
        .withFailureHandler(function (err) {
          if (btnSubmit) {
            btnSubmit.disabled = false;
            btnSubmit.classList.remove('opacity-70', 'cursor-not-allowed');
            btnSubmit.innerHTML = originalBtnContent;
          }
          Swal.fire('Gagal!', 'Koneksi terputus: ' + (err ? err.message : ''), 'error');
        })
        .editLaporan(idLaporanSedangDiedit, formData);
    } else {
      google.script.run
        .withSuccessHandler(function (res) {
          if (btnSubmit) {
            btnSubmit.disabled = false;
            btnSubmit.classList.remove('opacity-70', 'cursor-not-allowed');
            btnSubmit.innerHTML = originalBtnContent;
          }
          if (res.status === 'success') {
            document.getElementById('formInputan').classList.add('hidden');
            document.getElementById('formInputan').reset();
            document.getElementById('areaRingkasanPPL').classList.remove('hidden');
            Swal.fire({
              icon: 'success',
              title: 'Tersimpan!',
              timer: 1500,
              showConfirmButton: false,
            });
            muatRingkasanPPL(komoditas);
          } else {
            Swal.fire('Gagal!', res.message || 'Data gagal disimpan ke server.', 'error');
          }
        })
        .withFailureHandler(function (err) {
          if (btnSubmit) {
            btnSubmit.disabled = false;
            btnSubmit.classList.remove('opacity-70', 'cursor-not-allowed');
            btnSubmit.innerHTML = originalBtnContent;
          }
          Swal.fire('Gagal!', 'Koneksi terputus: ' + (err ? err.message : ''), 'error');
        })
        .submitLaporan(formData);
    }
  }

  function generateOpsiFilter() {
    ['filterBulanDashboard', 'filterBulanPmAas'].forEach((id) => {
      const sel = document.getElementById(id);
      if (!sel) return;
      const namaBulan = [
        'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember',
      ];
      const now = new Date();
      sel.innerHTML = '';
      for (let i = 0; i <= 4; i++) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const opt = document.createElement('option');
        opt.value = `${d.getFullYear()}-${d.getMonth() + 1}`;
        opt.text = `${namaBulan[d.getMonth()]} ${d.getFullYear()}`;
        sel.appendChild(opt);
      }
    });
  }

        .getElementById('nav-target')

  function renderCapaianKabupaten() {
    let totalTarget = 0;
    let totalRealisasi = 0;

    if (komoditasCapaianAktif === 'PM-AAS') {
      if (lastPmAasData) {
        totalTarget = Number(lastPmAasData.targetTanam || 0);
        totalRealisasi = Number(lastPmAasData.totalTanam || 0);
      }
    } else {
      if (!dataTarget || !lastDashData) return;
      if (
        dataTarget.targetKabupaten &&
        dataTarget.targetKabupaten[komoditasCapaianAktif] !== undefined
      ) {
        totalTarget = Number(
          dataTarget.targetKabupaten[komoditasCapaianAktif] || 0,
        );
      }
      if (
        lastDashData &&
        lastDashData.komposisiTanam &&
        lastDashData.komposisiTanam[komoditasCapaianAktif] !== undefined
      ) {
        totalRealisasi = Number(
          lastDashData.komposisiTanam[komoditasCapaianAktif] || 0,
        );
      }
    }

    const pct =
      totalTarget > 0
        ? (totalRealisasi / totalTarget) * 100
        : totalRealisasi > 0
          ? 100
          : 0;
    const sisa = totalTarget - totalRealisasi;

    document.getElementById('capaianTarget').innerText =
      _numId(totalTarget) + ' Ha';
    document.getElementById('capaianRealisasi').innerText =
      _numId(totalRealisasi) + ' Ha';

    const elSisa = document.getElementById('capaianSisa');
    if (sisa > 0) {
      elSisa.innerHTML =
        '<i class="fa-solid fa-circle-info"></i> Sisa Target: ' +
        _numId(sisa) +
        ' Ha';
      elSisa.className =
        'inline-flex items-center gap-1.5 px-3 py-1 bg-yellow-50 text-yellow-700 text-[11px] font-bold rounded-full border border-yellow-200';
    } else if (sisa < 0) {
      elSisa.innerHTML =
        '<i class="fa-solid fa-check-double"></i> Melampaui: ' +
        _numId(Math.abs(sisa)) +
        ' Ha';
      elSisa.className =
        'inline-flex items-center gap-1.5 px-3 py-1 bg-green-50 text-green-700 text-[11px] font-bold rounded-full border border-green-200';
    } else {
      elSisa.innerHTML =
        '<i class="fa-solid fa-check-circle"></i> Target Tercapai';
      elSisa.className =
        'inline-flex items-center gap-1.5 px-3 py-1 bg-blue-50 text-blue-700 text-[11px] font-bold rounded-full border border-blue-200';

    let color = '#16a34a';
    if (pct < 50) color = '#ef4444';
    else if (pct < 80) color = '#eab308';

    if (chartCapaianKab) chartCapaianKab.destroy();

    chartCapaianKab = new ApexCharts(

  let lastRekapKecData = null;

  let currentRekapTab = 'rekap-padi';

  function muatRekap(force = false) {
    const tglMulai = document.getElementById('tglRekapMulai').value;
    const tglAkhir = document.getElementById('tglRekapAkhir').value;
    const jenisLTT =
      currentRekapTab === 'rekap-padi'
        ? document.getElementById('filterJenisLTT').value
        : '';
    const btnIcon = document.getElementById('iconRefreshRekap');

    const d = new Date();
    const todayDate = [
      d.getFullYear(),
      String(d.getMonth() + 1).padStart(2, '0'),
      String(d.getDate()).padStart(2, '0'),
    ].join('-');
    const isTodayOnly = tglMulai === todayDate && tglAkhir === todayDate;

    // Konstruksi Cache Key
    const cacheKey =
      currentRekapTab +
      '_' +
      tglMulai +
      '_' +
      tglAkhir +
      '_' +
      (jenisLTT || 'semua');

    // Gunakan cache jika tersedia, tidak dipaksa refresh, dan filter adalah hari ini (isTodayOnly)
    if (!force && isTodayOnly && cacheRekap[cacheKey]) {
      const data = cacheRekap[cacheKey];
      lastRekapData = data.harian;
      lastRekapKecData = data.kecamatan;

      // Render UI Harian
      document.getElementById('rTanam').innerText = formatAngkaLTT(
        lastRekapData.totalTanam,
      );
      document.getElementById('rPanen').innerText = formatAngkaLTT(
        lastRekapData.totalPanen,
      );

      if (currentRekapTab === 'rekap-padi') {
        const typeText = jenisLTT ? '(' + jenisLTT + ')' : '(Semua)';
        document.getElementById('labelTanamType').innerText = typeText;
        document.getElementById('labelPanenType').innerText = typeText;
      } else {
        document.getElementById('labelTanamType').innerText = '(Semua)';
        document.getElementById('labelPanenType').innerText = '(Semua)';
      }

      // Render Tabel
      renderTabelKecamatan(lastRekapKecData, currentRekapTab === 'rekap-padi');
      return;
    }

    // Tampilkan loading dan animasi refresh
    if (btnIcon) btnIcon.classList.add('fa-spin');

    document.getElementById('tabelKecamatan').innerHTML =
      '<tr><td colspan="4" class="p-8 text-center"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-green-500 mb-2 block"></i> Menghitung rekap data...</td></tr>';

    // Helper untuk simpan ke cache jika kedua request selesai
    let tempHarian = null;
    let tempKec = null;

    function cobaSimpanCache() {
      if (tempHarian && tempKec) {
        if (isTodayOnly) {
          cacheRekap[cacheKey] = { harian: tempHarian, kecamatan: tempKec };
        }
        if (btnIcon) btnIcon.classList.remove('fa-spin');
      }
    }

    if (currentRekapTab === 'rekap-padi') {
      google.script.run
        .withSuccessHandler(function (d) {
          tempHarian = d.harian;
          tempKec = d.kecamatan;
          lastRekapData = d.harian;
          lastRekapKecData = d.kecamatan;

          document.getElementById('rTanam').innerText = formatAngkaLTT(
            d.harian.totalTanam,
          );
          document.getElementById('rPanen').innerText = formatAngkaLTT(
            d.harian.totalPanen,
          );
          const typeText = jenisLTT ? '(' + jenisLTT + ')' : '(Semua)';
          document.getElementById('labelTanamType').innerText = typeText;
          document.getElementById('labelPanenType').innerText = typeText;

          // Update dropdown jika Padi
          const sel = document.getElementById('filterJenisLTT');
          const prev = sel.value;
          sel.innerHTML = '<option value="">Semua Jenis LTT</option>';
          d.harian.jenisLTTList.forEach((j) => {
            sel.innerHTML += `<option value="${j}" ${j === prev ? 'selected' : ''}>${j}</option>`;
          });

          renderTabelKecamatan(d.kecamatan, true);
          cobaSimpanCache();
        })
        .getRekapPadiLengkap(tglMulai, tglAkhir, jenisLTT);
    } else {
      const komoditas = currentRekapTab === 'jagung' ? 'Jagung' : 'Ubi Kayu';
      google.script.run
        .withSuccessHandler(function (d) {
          tempHarian = d.harian;
          tempKec = d.kecamatan;
          lastRekapData = d.harian;
          lastRekapKecData = d.kecamatan;

          document.getElementById('rTanam').innerText = formatAngkaLTT(
            d.harian.totalTanam,
          );
          document.getElementById('rPanen').innerText = formatAngkaLTT(
            d.harian.totalPanen,
          );
          document.getElementById('labelTanamType').innerText = '(Semua)';
          document.getElementById('labelPanenType').innerText = '(Semua)';

          renderTabelKecamatan(d.kecamatan, false);
          cobaSimpanCache();
        })
        .getRekapPalawijaLengkap(tglMulai, tglAkhir, komoditas);
    }
  }

        ' ' +

      const tglLaporan = tglInfo;

    tbody.innerHTML =
      d.rows

                    <td class="p-3 text-sm">${tampilKec}</td>
                    <td class="p-3 text-right text-sm font-bold ${r[2] > 0 ? 'text-blue-600' : 'text-gray-600'}">${formatAngkaLTT(r[2])}</td>

  function inisialisasiBPP() {
    if (!userAktif || userAktif.role !== 'Admin_BPP') {
      Swal.fire(
        'Akses Ditolak',
        'Anda tidak memiliki hak akses sebagai Koordinator BPP.',
        'error',
      );
      return;
    }
    document.getElementById('namaAdminBPP').innerText = userAktif.nama;
    document.getElementById('judulBPP').innerText =
      'BPP ' + userAktif.kecamatan.toUpperCase();
    muatDashboardBPP(userAktif.kecamatan);
    muatDaftarPPL();
    muatDaftarDesaBPP();

    if (document.getElementById('bppWidgetWA')) {
      const waVal = userAktif.whatsapp || '';
      document.getElementById('bppWidgetWA').value = waVal;
      updateWidgetWAState(waVal);
    }

    // Reset view ke dashboard default saat inisialisasi
    const secDashboard = document.getElementById('bppSectionDashboard');
    const secTarget = document.getElementById('bppSectionTarget');
    const secManajemen = document.getElementById('bppSectionManajemenPPL');
    if (secDashboard && secTarget && secManajemen) {
      secDashboard.classList.remove('hidden');
      secTarget.classList.add('hidden');
      secManajemen.classList.add('hidden');

      const btnDashboard = document.getElementById('btnNavDashboard');
      const btnTarget = document.getElementById('btnNavTarget');
      const btnManajemen = document.getElementById('btnNavManajemen');
      const activeClasses = ['bg-green-900', 'text-white'];
      const inactiveClasses = [
        'text-green-100',
        'hover:bg-green-700',
        'hover:text-white',
      ];

      [btnDashboard, btnTarget, btnManajemen].forEach((btn) => {
        if (btn) {
          btn.classList.remove(...activeClasses);
          btn.classList.add(...inactiveClasses);
        }
      });
      if (btnDashboard) {
        btnDashboard.classList.add(...activeClasses);
        btnDashboard.classList.remove(...inactiveClasses);
      }
    }
  }

  function muatDashboardBPP(kecamatan) {
    google.script.run
      .withSuccessHandler(function (dash) {
        allLaporanBPP = dash.laporanMenunggu;
        document.getElementById('angkaLaporanHariIni').innerHTML =
          dash.laporanHariIni + ' Data';
        document.getElementById('angkaMenungguBPP').innerText =
          dash.countMenunggu + ' Data';
        document.getElementById('angkaSudahLapor').innerText =
          dash.sudahLapor + ' / ' + dash.totalPPL + ' Orang';
        const daftarEl = document.getElementById('daftarMerahPPL');
        const belumLapor = dash.pplBelumLapor;
        if (belumLapor.length === 0) {
          daftarEl.innerHTML =
            '<span class="bg-green-100 text-green-700 text-xs font-bold px-3 py-1.5 rounded-full">Semua sudah lapor!</span>';
        } else {
          daftarEl.innerHTML = belumLapor
            .map(
              (nama) =>
                `<span class="bg-white border border-red-300 text-red-600 text-xs font-bold px-3 py-1.5 rounded-full">${nama}</span>`,
            )
            .join('');
        }
        renderTabelBPP();
        _stopRefreshSpin();
      })
      .withFailureHandler(function () {
        _stopRefreshSpin();
      })

  function verifikasiBPP(btn) {
    const checkboxes = document.querySelectorAll('.cek-laporan-bpp:checked');
    if (checkboxes.length === 0) return Swal.fire('Pilih Data!', '', 'warning');
    let idTerpilih = [];
    checkboxes.forEach((cb) => idTerpilih.push(cb.value));
    Swal.fire({ title: 'Sahkan?', showCancelButton: true }).then((res) => {
      if (res.isConfirmed) {
        const icon = btn ? btn.querySelector('i') : null;
        if (btn) btn.disabled = true;
        if (icon) icon.classList.add('fa-spin');
        // Simpan ke _refreshBtnAktif agar _stopRefreshSpin() (dipanggil oleh
        // muatDashboardBPP saat selesai) yang menghentikan spinner — bukan saat
        // server call selesai, tapi setelah data benar-benar ter-reload.
        _refreshBtnAktif = { btn, icon };
        google.script.run
          .withSuccessHandler(() => {
            cacheRekap = {};
            muatUlangBPP();
          })
          .withFailureHandler(() => {
            _stopRefreshSpin();
          })
          .prosesVerifikasiMassal(idTerpilih, 'Admin_BPP');
      }
    });
  }

      window.history.state &&
      window.history.state.overlay === 'modalEditLaporanBPP'

  function submitEditLaporanBPP(e) {
    e.preventDefault();
    const id = document.getElementById('editLaporanId').value;
    const tanam = document.getElementById('editLaporanTanam').value;
    const panen = document.getElementById('editLaporanPanen').value;
    const ket = document.getElementById('editLaporanKeterangan').value.trim();
    const btn = document.getElementById('btnSimpanEditLaporan');
    const ikon = document.getElementById('ikonSimpanEditLaporan');
    const teks = document.getElementById('teksSimpanEditLaporan');
    btn.disabled = true;
    ikon.className = 'fa-solid fa-circle-notch fa-spin';
    teks.textContent = 'Menyimpan...';
    google.script.run
      .withSuccessHandler((res) => {
        btn.disabled = false;
        ikon.className = 'fa-solid fa-floppy-disk';
        teks.textContent = 'Simpan';
        if (res.status === 'success') {
          tutupEditLaporanBPP();
          cacheRekap = {};
          muatUlangBPP();
          // Reload data tabel Laporan LTT BPP (jika sudah diinisiasi)
          if (typeof muatLaporanLTTBPP === 'function') {
            muatLaporanLTTBPP(true);
          }
          Swal.fire({
            icon: 'success',
            title: 'Tersimpan!',
            timer: 1200,
            showConfirmButton: false,
          });
        } else {
          Swal.fire('Gagal', res.message, 'error');
        }
      })
      .withFailureHandler((err) => {
        btn.disabled = false;
        ikon.className = 'fa-solid fa-floppy-disk';
        teks.textContent = 'Simpan';
        Swal.fire('Error', err.message || 'Koneksi gagal', 'error');
      })
      .editLaporanBPP(id, _parseDesimal(tanam), _parseDesimal(panen), ket);
  }

  function toggleModeTabelLTT() {
    const mode = document.getElementById('modeFilterTabelLTT').value;
    const inputTgl = document.getElementById('filterTanggalTabelLTT');
    const lblBln = document.getElementById('labelBulanTabelLTT');

    if (mode === 'harian') {
      lblBln.classList.add('hidden');
      inputTgl.classList.remove('hidden');
      if (!inputTgl.value) {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        inputTgl.value = `${yyyy}-${mm}-${dd}`;
      }
    } else {
      lblBln.classList.remove('hidden');
      inputTgl.classList.add('hidden');
    }
    muatTabelLTTSaja();

  function muatTabelLTTSaja() {
    const mode = document.getElementById('modeFilterTabelLTT')
      ? document.getElementById('modeFilterTabelLTT').value
      : 'bulanan';
    const selBulan = document.getElementById('filterBulanDashboard');
    const selTanggal = document.getElementById('filterTanggalTabelLTT');
    const label = document.getElementById('labelBulanRekapLTT');
    const params = {};

    if (mode === 'harian' && selTanggal && selTanggal.value) {
      params.tanggal = selTanggal.value;
      const parts = params.tanggal.split('-');
      params.tahun = parseInt(parts[0]);
      params.bulan = parseInt(parts[1]);
      if (label)
        label.innerText = `Periode: ${parts[2]}/${parts[1]}/${parts[0]}`;
    } else if (selBulan && selBulan.value) {
      const parts = selBulan.value.split('-');
      params.tahun = parseInt(parts[0]);
      params.bulan = parseInt(parts[1]);
      if (label)
        label.innerText = `Periode: ${selBulan.options[selBulan.selectedIndex].text}`;

      tbody.innerHTML = `<tr><td colspan="12" class="p-8 text-center text-gray-400 italic"><i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Memuat data rekapitulasi...</td></tr>`;

  function renderChartTarget() {
    document.getElementById('loadingTarget').classList.add('hidden');
    if (!dataTarget) return;

    const side = filterTanamPanen;
    const jenisKey = filterJenisTarget;

    // Kumpulkan semua kecamatan dari gabungan target + realisasi
    const semuaKec = [
      ...new Set([
        ...Object.keys(dataTarget.target),
        ...Object.keys(dataTarget.realisasi),
      ]),
    ].sort();

    if (semuaKec.length === 0) {
      document.getElementById('emptyTarget').classList.remove('hidden');
      document.getElementById('emptyTarget').classList.add('flex');
      document
        .getElementById('tableTargetVsRealisasiContainer')
        .classList.add('hidden');
      return;
    }

    // Render Tabel Detail Target vs Realisasi
    let tableHTML = '';
    semuaKec.forEach((kec) => {
      const t =
        dataTarget.target[kec] && dataTarget.target[kec][jenisKey]
          ? dataTarget.target[kec][jenisKey][side] || 0
          : 0;
      const r =
        dataTarget.realisasi[kec] && dataTarget.realisasi[kec][jenisKey]
          ? dataTarget.realisasi[kec][jenisKey][side] || 0
          : 0;
      const pct = t > 0 ? Math.round((r / t) * 100) : '-';

      let colorClass = 'text-gray-500';
      let badgeClass = 'bg-gray-100 text-gray-600';
      let barColor = 'bg-gray-200';

      if (pct !== '-') {
        if (pct >= 80) {
          colorClass = 'text-green-600 font-bold';
          badgeClass = 'bg-green-100 text-green-700';
          barColor = 'bg-green-500';
        } else if (pct >= 50) {
          colorClass = 'text-yellow-600 font-bold';
          badgeClass = 'bg-yellow-100 text-yellow-700';
          barColor = 'bg-yellow-500';
        } else {
          colorClass = 'text-red-600 font-bold';
          badgeClass = 'bg-red-100 text-red-700';
          barColor = 'bg-red-500';
        }
      }

      let barWidth = pct !== '-' ? Math.min(pct, 100) : 0;

      tableHTML += `
            <tr class="border-b border-gray-50 hover:bg-gray-50 transition">
                <td class="p-3 font-bold text-gray-800 w-1/4">${kec}</td>
                <td class="p-3 text-center w-1/6">${_numId(t)}</td>
                <td class="p-3 text-center ${colorClass} w-1/6">${_numId(r)}</td>
                <td class="p-3 w-5/12">
                    <div class="flex items-center gap-3 w-full">
                        <div class="flex-grow bg-gray-100 rounded-full h-2.5 overflow-hidden border border-gray-200">
                            <div class="${barColor} h-2.5 rounded-full transition-all duration-500" style="width: ${barWidth}%"></div>
                        </div>
                        <span class="w-12 text-center px-2 py-1 ${badgeClass} text-[10px] font-bold rounded-full flex-shrink-0">${pct !== '-' ? pct + '%' : '-'}</span>
                    </div>
                </td>
            </tr>`;
    });
    document.getElementById('tabelTargetVsRealisasi').innerHTML = tableHTML;
    document
      .getElementById('tableTargetVsRealisasiContainer')
      .classList.remove('hidden');
  }

  function renderTabelRekapLTT(data) {
    lastRekapLTTData = data;
    const tbody = document.getElementById('tbodyRekapLTT');
    const tfoot = document.getElementById('tfootRekapLTT');
    if (!tbody || !data) return;

    // Dapatkan semua daftar kecamatan yang memiliki data target / realisasi
    const targetKeys = data.target ? Object.keys(data.target) : [];
    const realKeys = data.realisasi ? Object.keys(data.realisasi) : [];

    const semuaKec = [...new Set([...targetKeys, ...realKeys])].sort();

    if (semuaKec.length === 0) {
      tbody.innerHTML = `<tr><td colspan="12" class="p-8 text-center text-gray-400 italic">Tidak ada data rekap LTT untuk periode ini.</td></tr>`;
      if (tfoot) tfoot.innerHTML = '';
      return;
    }

    // Variabel untuk menampung total per kolom
    const total = {
      padiReguler: { tanam: 0, panen: 0 },
      padiGogo: { tanam: 0, panen: 0 },
      jagung: { tanam: 0, panen: 0 },
      kedelai: { tanam: 0, panen: 0 },
      ubiKayu: { tanam: 0, panen: 0 },
    };

    let rowsHtml = '';
    const getCellClass = (val, bgClass = '', isLast = false) => {
      const weightClass =
        val > 0 ? 'font-bold text-gray-900' : 'font-normal text-gray-400';
      const borderClass = isLast ? '' : 'border-r border-gray-200';
      return `p-2 ${borderClass} text-right tabular-nums ${weightClass} ${bgClass}`;
    };

    semuaKec.forEach((kec, idx) => {
      const r = data.realisasi[kec] || {
        LTTReguler: { tanam: 0, panen: 0 },
        PadiGogo: { tanam: 0, panen: 0 },
        Oplah2025: { tanam: 0, panen: 0 },
        Jagung: { tanam: 0, panen: 0 },
        UbiKayu: { tanam: 0, panen: 0 },
      };

      // Padi Reguler = LTTReguler (karena Oplah & Rehab Bencana diabaikan sesuai permintaan user)
      const psTanam = r.LTTReguler?.tanam || 0;
      const psPanen = r.LTTReguler?.panen || 0;

      const pgTanam = r.PadiGogo?.tanam || 0;
      const pgPanen = r.PadiGogo?.panen || 0;

      const jgTanam = r.Jagung?.tanam || 0;
      const jgPanen = r.Jagung?.panen || 0;

      const kdTanam = 0; // Kedelai saat ini masih 0
      const kdPanen = 0;

      const ukTanam = r.UbiKayu?.tanam || 0;
      const ukPanen = r.UbiKayu?.panen || 0;

      total.padiReguler.tanam += psTanam;
      total.padiReguler.panen += psPanen;
      total.padiGogo.tanam += pgTanam;
      total.padiGogo.panen += pgPanen;
      total.jagung.tanam += jgTanam;
      total.jagung.panen += jgPanen;
      total.kedelai.tanam += kdTanam;
      total.kedelai.panen += kdPanen;
      total.ubiKayu.tanam += ukTanam;
      total.ubiKayu.panen += ukPanen;

      const rowBg = idx % 2 === 0 ? 'bg-white' : 'bg-gray-50/50';

      rowsHtml += `

  // Semua 4 HTML dimuat sekaligus di Index.html sehingga ID elemen bisa
  // duplikat. Gunakan querySelector dengan scope container unik agar tidak
  // salah ambil elemen.
  function _profilQ(scope, id) {
    return document.querySelector(scope + ' #' + id);
  }

  function bukaProfil() {
    window.history.pushState({ overlay: 'profilArea' }, '');
    const isPPL = modePelanAktif === 'ppl';
    const scope = isPPL ? '#profilArea' : '#modalProfilBPP';

    _profilQ(scope, 'profilId').value = userAktif.id;
    _profilQ(scope, 'profilNIP').value = userAktif.nip;
    _profilQ(scope, 'profilKecamatan').value = userAktif.kecamatan;
    _profilQ(scope, 'profilNama').value = userAktif.nama;
    if (_profilQ(scope, 'profilWA')) {
      _profilQ(scope, 'profilWA').value = userAktif.whatsapp || '';
    }

    const elDesa = _profilQ(scope, 'profilDesa');
    if (elDesa) elDesa.value = userAktif.desa;

    _profilQ(scope, 'profilPasswordLama').value = '';
    _profilQ(scope, 'profilPasswordBaru').value = '';
    _profilQ(scope, 'profilPasswordKonfirmasi').value = '';

    if (isPPL) {
      document.getElementById('profilArea').classList.remove('hidden');
    } else {
      const modal = document.getElementById('modalProfilBPP');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }
  }

  function _tutupProfilDOM() {
    const isPPL = modePelanAktif === 'ppl';
    if (isPPL) {
      const pArea = document.getElementById('profilArea');
      if (pArea) {
        document.querySelector('#profilArea form').reset();
        pArea.classList.add('hidden');
        setNavAktif('navHome');
      }
    } else {
      const modal = document.getElementById('modalProfilBPP');
      if (modal) {
        document.querySelector('#modalProfilBPP form').reset();
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }
  }

  function tutupProfil() {
    _tutupProfilDOM();
    if (window.history.state && window.history.state.overlay === 'profilArea') {
      window.history.back();
    }
  }

  function submitProfil(e) {
    e.preventDefault();

    // Deteksi container aktif dari form yang di-submit
    const isPPL = e.target.closest('#profilArea') !== null;
    const scope = isPPL ? '#profilArea' : '#modalProfilBPP';
    const q = (id) => _profilQ(scope, id);

    const id = q('profilId').value;
    const nama = q('profilNama').value.trim();
    const whatsapp = q('profilWA') ? q('profilWA').value.trim() : '';
    const passwordLama = q('profilPasswordLama').value;
    const passwordBaru = q('profilPasswordBaru').value;
    const passwordKonfirm = q('profilPasswordKonfirmasi').value;

    if (!nama) {
      Swal.fire('Peringatan', 'Nama Lengkap tidak boleh kosong.', 'warning');
      return;
    }
    if (!passwordLama) {
      Swal.fire(
        'Peringatan',
        'Password Aktif Saat Ini wajib diisi untuk konfirmasi.',
        'warning',
      );
      return;
    }
    if (passwordBaru && passwordBaru.length < 4) {
      Swal.fire(
        'Peringatan',
        'Password Baru minimal harus 4 karakter.',
        'warning',
      );
      return;
    }
    if (passwordBaru && passwordBaru !== passwordKonfirm) {
      Swal.fire(
        'Peringatan',
        'Password Baru dan Konfirmasi Password tidak cocok.',
        'warning',
      );
      return;
    }

    const btnSimpan = q('btnSimpanProfil');
    btnSimpan.disabled = true;
    q('ikonSimpanProfil').className = 'fa-solid fa-circle-notch fa-spin';
    q('teksSimpanProfil').textContent = 'Menyimpan...';

    google.script.run
      .withSuccessHandler(function (res) {
        btnSimpan.disabled = false;
        q('ikonSimpanProfil').className = 'fa-solid fa-floppy-disk';
        q('teksSimpanProfil').textContent = isPPL
          ? 'Simpan Perubahan'
          : 'Simpan';

        if (res.status === 'success') {
          userAktif = res.data;
          localStorage.setItem('user_eLTT', JSON.stringify(res.data));
          if (modePelanAktif === 'ppl') {
            inisialisasiPPL();
          } else {
            inisialisasiBPP();
          }
          Swal.fire('Berhasil!', res.message, 'success').then(() =>
            tutupProfil(),
          );
        } else {
          Swal.fire('Gagal Menyimpan', res.message, 'error');
        }
      })
      .withFailureHandler(function (err) {
        btnSimpan.disabled = false;
        q('ikonSimpanProfil').className = 'fa-solid fa-floppy-disk';
        q('teksSimpanProfil').textContent = isPPL
          ? 'Simpan Perubahan'
          : 'Simpan';
        Swal.fire(
          'Error Koneksi',
          'Gagal menghubungi server: ' + err.message,
          'error',
        );
      })
      .updateProfilUser(id, nama, passwordLama, passwordBaru, whatsapp);
  }

  function simpanWidgetWA(prefix) {
    const elWA = document.getElementById('widgetWA_' + prefix);
    if (!elWA) return;
    const wa = elWA.value.trim();

    if (!wa) {
      Swal.fire('Peringatan', 'Nomor WhatsApp tidak boleh kosong.', 'warning');
      return;
    }

    if (!/^08\d{8,12}$/.test(wa)) {
      Swal.fire('Peringatan', 'Nomor WhatsApp tidak valid (harus diawali 08 dan memiliki panjang 10-14 digit).', 'warning');
      return;
    }

    const btn = document.getElementById('btnWidgetWA_' + prefix);
    const icon = document.getElementById('iconWidgetWA_' + prefix);
    btn.disabled = true;
    icon.className = 'fa-solid fa-circle-notch fa-spin';

    google.script.run
      .withSuccessHandler((res) => {
        btn.disabled = false;
        icon.className = 'fa-solid fa-paper-plane';
        if (res.status === 'success') {
          userAktif = res.data;
          localStorage.setItem('user_eLTT', JSON.stringify(res.data));
          updateWidgetWAState(userAktif.whatsapp);
          Swal.fire({
            icon: 'success',
            title: 'Berhasil',
            text: 'Nomor WhatsApp berhasil disimpan untuk notifikasi bot.',
            timer: 2000,
            showConfirmButton: false,
          });
        } else {
          Swal.fire('Gagal Menyimpan', res.message, 'error');
        }
      })
      .withFailureHandler((err) => {
        btn.disabled = false;
        icon.className = 'fa-solid fa-paper-plane';
        Swal.fire('Error Koneksi', err.message, 'error');
      })
      .updateWhatsAppUser(userAktif.id, wa);
  }

  function bukaSaran() {
    Swal.fire({
      title: 'Kirim Saran / Masukan',
      input: 'textarea',
      inputPlaceholder: 'Tuliskan saran atau kendala yang Anda alami di sini...',
      inputAttributes: {
        'aria-label': 'Tuliskan saran atau kendala Anda di sini'
      },
      showCancelButton: true,
      confirmButtonText: 'Kirim',
      cancelButtonText: 'Batal',
      confirmButtonColor: '#16a34a',
      cancelButtonColor: '#d1d5db',
      inputValidator: (value) => {
        if (!value || !value.trim()) {
          return 'Saran tidak boleh kosong!';
        }
      }
    }).then((result) => {
      if (result.isConfirmed) {
        const pesan = result.value.trim();
        
        // Tampilkan loading spinner
        Swal.fire({
          title: 'Mengirim...',
          allowOutsideClick: false,
          didOpen: () => {
            Swal.showLoading();
          }
        });
        
        google.script.run
          .withSuccessHandler(function (res) {
            if (res.status === 'success') {
              Swal.fire({
                icon: 'success',
                title: 'Berhasil!',
                text: 'Saran Anda berhasil dikirim. Terima kasih!',
                confirmButtonColor: '#16a34a'
              });
            } else {
              Swal.fire({
                icon: 'error',
                title: 'Gagal Mengirim',
                text: res.message || 'Terjadi kesalahan pada server.',
                confirmButtonColor: '#16a34a'
              });
            }
          })
          .withFailureHandler(function (err) {
            Swal.fire({
              icon: 'error',
              title: 'Koneksi Gagal',
              text: 'Tidak dapat terhubung ke server Google Apps Script.',
              confirmButtonColor: '#16a34a'
            });
          })
          .kirimSaranWebhook(pesan, userAktif);
      }
    });
  }

  function renderChecklistDesa(checkedDesaList) {
    const container = document.getElementById('formPPLDesaContainer');
    if (!container) return;

    if (daftarDesaKecamatanLokal.length === 0) {
      container.innerHTML =
        '<span class="text-xs text-gray-400 italic">Belum ada data desa terdaftar untuk kecamatan ini. Silakan hubungi Admin Kabupaten.</span>';
      return;
    }

    const checkedSet = new Set(
      (checkedDesaList || []).map((d) => d.toString().toLowerCase().trim()),
    );

    container.innerHTML = daftarDesaKecamatanLokal
      .map((desa, idx) => {
        const isChecked = checkedSet.has(desa.toLowerCase().trim())
          ? 'checked'
          : '';
        return `
                <label class="flex items-center gap-2.5 px-3 py-2 hover:bg-green-50 rounded-xl cursor-pointer transition select-none text-xs text-gray-700 font-semibold border border-transparent hover:border-green-100 bg-white shadow-sm">

                        class="w-4 h-4 text-green-600 rounded border-gray-300 focus:ring-green-500 cursor-pointer transition">
                    <span>Desa ${desa}</span>
                </label>
            `;
      })
      .join('');

          u.status === 'Aktif'

            : '<span class="bg-red-100 text-red-700 px-2 py-1 rounded-full text-[10px] font-bold">Nonaktif</span>';

          u.status === 'Aktif' ? 'Nonaktifkan Akun' : 'Aktifkan Akun';

                <td class="p-4 font-bold text-gray-800">${u.nama}</td>
                <td class="p-4 text-xs font-mono text-gray-600">${u.nip}</td>
                <td class="p-4 text-xs text-gray-600">${u.desa || '-'}</td>

                        <button onclick="bukaEditPPL(${i})" title="Edit Data" class="w-8 h-8 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-600 hover:text-white transition shadow-sm flex items-center justify-center"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="bukaResetPasswordPPL(${i})" title="Reset Password" class="w-8 h-8 bg-yellow-50 text-yellow-600 rounded-lg hover:bg-yellow-600 hover:text-white transition shadow-sm flex items-center justify-center"><i class="fa-solid fa-key"></i></button>

                        ${btnHapus}

  function submitFormPPL(event) {
    event.preventDefault();

    const id = _mppQ('formPPLId').value;
    const nama = _mppQ('formPPLNama').value.trim();
    const nip = _mppQ('formPPLNip').value.trim();
    const password = _mppQ('formPPLPassword').value;
    const status = _mppQ('formPPLStatus').value;

    // Ambil semua desa yang dicentang
    const checkedDesas = document.querySelectorAll(
      '#formPPLDesaContainer input[name="pplDesaBinaan"]:checked',
    );
    const desaArr = Array.from(checkedDesas).map((cb) => cb.value.trim());
    const desa = desaArr.join(', ');

    if (!nama) {
      Swal.fire('Peringatan', 'Nama Lengkap wajib diisi.', 'warning');
      return;
    }
    if (!nip) {
      Swal.fire('Peringatan', 'NIP / Username wajib diisi.', 'warning');
      return;
    }
    if (desaArr.length === 0) {
      Swal.fire(
        'Peringatan',
        'Silakan pilih minimal satu desa binaan.',
        'warning',
      );
      return;
    }

    const isEdit = id !== '';

    if (!isEdit) {
      if (!password || password.length < 4) {
        Swal.fire(
          'Peringatan',
          'Password wajib diisi dan minimal 4 karakter.',
          'warning',
        );
        return;
      }
    }

    const btn = document.getElementById('btnSimpanPPL');
    const oldHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML =
      '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Menyimpan...';

    if (isEdit) {
      const u = { id: id, nama: nama, nip: nip, desa: desa, status: status };
      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false;
          btn.innerHTML = oldHtml;
          if (res.status === 'success') {
            Swal.fire({
              icon: 'success',
              title: 'Berhasil',
              text: res.message,
              timer: 1800,
              showConfirmButton: false,
            });
            tutupModalPPL();
            muatDaftarPPL();
          } else {
            Swal.fire('Gagal', res.message, 'error');
          }
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          btn.innerHTML = oldHtml;
          Swal.fire(
            'Error',
            'Gagal menghubungi server: ' + err.message,
            'error',
          );
        })
        .updateDataPPL(u);
    } else {
      const u = {
        id: '',
        nama: nama,
        nip: nip,
        password: password,
        role: 'Penyuluh',
        kecamatan: userAktif.kecamatan,
        desa: desa,
        status: status,
      };
      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false;
          btn.innerHTML = oldHtml;
          if (res.status === 'success') {
            Swal.fire({
              icon: 'success',
              title: 'Berhasil',
              text: res.message,
              timer: 1800,
              showConfirmButton: false,
            });
            tutupModalPPL();
            muatDaftarPPL();
          } else {
            Swal.fire('Gagal', res.message, 'error');
          }
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          btn.innerHTML = oldHtml;
          Swal.fire(
            'Error',
            'Gagal menghubungi server: ' + err.message,
            'error',
          );
        })
        .simpanDataUser(u);
    }
  }

  let dataVerifKec = [];
  let _dataVerifKomCache = null;
  let _dataVerifTglCache = null;
  let pageSizeVerif = 0; // 0 = semua

  function _getKomVerif() {
    const btn = document.querySelector('.pill-kom-verif.active-pill');
    return btn ? btn.dataset.kom : 'Jagung';
  }

  function _getTglVerif() {
    return (document.getElementById('filterTglVerif') || {}).value || '';
  }

  function gantiKomoditasVerif(el, kom) {
    document.querySelectorAll('.pill-kom-verif').forEach((b) => {
      b.classList.remove(
        'active-pill',
        'bg-green-600',
        'text-white',
        'border-green-600',
      );
      b.classList.add('bg-white', 'text-gray-600', 'border-gray-300');
    });
    el.classList.add(
      'active-pill',
      'bg-green-600',
      'text-white',
      'border-green-600',
    );
    el.classList.remove('bg-white', 'text-gray-600', 'border-gray-300');
    dataVerifKec = [];
    _dataVerifKomCache = null;
    muatVerifikasi(true);
  }

  function setPageVerif(size) {
    pageSizeVerif = size;
    document.querySelectorAll('.btn-page-verif').forEach((b) => {
      const isSel = parseInt(b.dataset.size) === size;
      b.classList.toggle('bg-green-600', isSel);
      b.classList.toggle('text-white', isSel);
      b.classList.toggle('bg-gray-100', !isSel);
      b.classList.toggle('text-gray-600', !isSel);
    });
    filterTabelVerifikasi();
  }

  function muatVerifikasi(force = false) {
    const kom = _getKomVerif();
    const tgl = _getTglVerif();

    if (kom !== _dataVerifKomCache || tgl !== _dataVerifTglCache) {
      dataVerifKec = [];
      _dataVerifKomCache = kom;
      _dataVerifTglCache = tgl;
    }

    if (dataVerifKec.length > 0 && !force) {
      filterTabelVerifikasi();
      return;
    }

    document.getElementById('tabelVerifikasiKec').innerHTML =
      '<tr><td colspan="9" class="p-8 text-center"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-green-500 mb-2 block"></i> Memuat data...</td></tr>';
    document.getElementById('verifikasiLoading').classList.remove('hidden');
    google.script.run
      .withSuccessHandler(function (result) {
        document.getElementById('verifikasiLoading').classList.add('hidden');
        renderTabelVerifikasiKec(result);
      })
      .withFailureHandler(function (err) {
        document.getElementById('verifikasiLoading').classList.add('hidden');
        Swal.fire('Error', err.message, 'error');
      })
      .getAntreanKabupaten(kom, tgl);
  }

  function renderTabelVerifikasiKec(result) {
    dataVerifKec = result.kecList || [];
    filterTabelVerifikasi();
  }

  function filterTabelVerifikasi() {
    const fs = (document.getElementById('filterStatusVerif') || {}).value || '';
    const cari = (
      (document.getElementById('cariKecVerif') || {}).value || ''
    ).toLowerCase();
    const komAktif = _getKomVerif();

    const filtered = dataVerifKec.filter((k) => {
      const bisaVerif = k.belumBPP === 0 && k.siapVerif > 0;
      const matchStatus =
        !fs || (fs === 'siap' && bisaVerif) || (fs === 'belum' && !bisaVerif);
      const matchCari = !cari || k.nama.toLowerCase().includes(cari);
      return matchStatus && matchCari;
    });

    const total = filtered.length;
    const shown =
      pageSizeVerif === 0 ? filtered : filtered.slice(0, pageSizeVerif);

    const infoEl = document.getElementById('infoPageVerif');
    if (infoEl)
      infoEl.textContent =
        total > 0 ? `Menampilkan ${shown.length} dari ${total} kecamatan` : '';

    const tbody = document.getElementById('tabelVerifikasiKec');
    if (!shown.length) {
      tbody.innerHTML =
        '<tr><td colspan="9" class="p-10 text-center text-gray-400">Tidak ada data sesuai filter.</td></tr>';
      return;
    }
    tbody.innerHTML = shown
      .map((k) => {
        const bisaVerif = k.belumBPP === 0 && k.siapVerif > 0;
        const dot = bisaVerif
          ? '<span class="w-4 h-4 rounded-full bg-green-500 inline-block"></span>'
          : '<span class="w-4 h-4 rounded-full bg-red-500 inline-block"></span>';
        const ket = bisaVerif
          ? '<span class="text-green-600 font-medium text-xs">Sudah bisa diverifikasi</span>'
          : k.belumBPP > 0
            ? `<span class="text-red-500 text-xs font-medium">Tidak bisa diverifikasi<br><span class="text-gray-500 font-normal">Terdapat ${k.belumBPP} laporan yang belum diverifikasi oleh Admin BPP</span></span>`
            : '<span class="text-gray-400 text-xs">Belum ada laporan masuk</span>';
        const idsEncoded = encodeURIComponent(JSON.stringify(k.ids));
        const kecEsc = k.nama.replace(/'/g, "\\'");
        const btnHtml = bisaVerif
          ? `<button onclick="verifikasiKecamatan('${kecEsc}','${idsEncoded}')" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 whitespace-nowrap"><i class="fa-solid fa-check-double"></i> Verifikasi</button>`
          : `<button disabled class="bg-gray-100 text-gray-400 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 cursor-not-allowed whitespace-nowrap"><i class="fa-solid fa-check-double"></i> Verifikasi</button>`;
        const fmtHa = (v) => (v > 0 ? _numId(v) : '-');
        const tanam = fmtHa(k.totalTanam);
        const panen = fmtHa(k.totalPanen);
        return `<tr class="border-b border-gray-50 hover:bg-gray-50 transition">
          <td class="p-4">${btnHtml}</td>
          <td class="p-4 text-center">${dot}</td>
          <td class="p-4 font-bold text-gray-800 whitespace-nowrap">${k.nama}</td>
          <td class="p-4 text-center"><span class="bg-blue-50 text-blue-700 text-xs font-bold px-2 py-1 rounded-full">${k.totalLaporan}</span></td>
          <td class="p-4">${ket}</td>
          <td class="p-4 text-center font-bold ${k.sudahKab > 0 ? 'text-green-600' : 'text-gray-400'}">${k.sudahKab}</td>
          <td class="p-4 text-center"><span class="bg-yellow-50 text-yellow-700 text-xs font-semibold px-2 py-1 rounded-full whitespace-nowrap">${komAktif}</span></td>
          <td class="p-4 text-center text-gray-700 text-xs font-medium whitespace-nowrap">${tanam}</td>
          <td class="p-4 text-center text-gray-700 text-xs font-medium whitespace-nowrap">${panen}</td>
        </tr>`;
      })
      .join('');
  }

  function verifikasiKecamatan(kecamatan, idsEncoded) {
    const ids = JSON.parse(decodeURIComponent(idsEncoded));
    Swal.fire({
      title: 'Verifikasi Kec. ' + kecamatan + '?',
      html: `<span class="text-gray-600">${ids.length} laporan akan disahkan oleh Kabupaten.</span>`,
      icon: 'question',
      showCancelButton: true,
      confirmButtonText: 'Ya, Verifikasi',
      cancelButtonText: 'Batal',
      confirmButtonColor: '#16a34a',
    }).then((res) => {
      if (res.isConfirmed) {
        Swal.fire({
          title: 'Memproses...',
          text: 'Sedang memverifikasi laporan Kec. ' + kecamatan,
          allowOutsideClick: false,
          allowEscapeKey: false,
          showConfirmButton: false,
          didOpen: () => Swal.showLoading(),
        });
        google.script.run
          .withSuccessHandler(() => {
            Swal.fire({
              title: 'Berhasil!',
              text: 'Laporan Kec. ' + kecamatan + ' telah disahkan.',
              icon: 'success',
              timer: 2000,
              showConfirmButton: false,
            });
            cacheRekap = {};
            dataVerifKec = [];
            muatVerifikasi(true);
            muatDashboard();
          })
          .withFailureHandler((err) => Swal.fire('Error', err.message, 'error'))
          .prosesVerifikasiMassal(ids, 'Admin_Kab');
      }
    });
  }

  function filterTabelUser() {
    const cari = document.getElementById('cariUser').value.toLowerCase();
    const role = document.getElementById('filterRole').value;
    const kec = document.getElementById('filterKecUser').value;
    const tbody = document.getElementById('tabelUser');

    const filtered = (allUserData || []).filter((u) => {
      const nama = (u.nama || '').toLowerCase();
      const nip = (u.nip || '').toString();
      const matchCari = !cari || nama.includes(cari) || nip.includes(cari);
      const matchRole = !role || u.role === role;
      const matchKec = !kec || u.kecamatan === kec;
      return matchCari && matchRole && matchKec;
    });

    const itemsPerPage =
      parseInt(document.getElementById('itemsPerPageUser').value) || 10;
    const totalItems = filtered.length;
    const maxPage = Math.ceil(totalItems / itemsPerPage) || 1;
    if (currentPageUser > maxPage) currentPageUser = maxPage;
    if (currentPageUser < 1) currentPageUser = 1;

    const startIdx = (currentPageUser - 1) * itemsPerPage;
    const endIdx = Math.min(startIdx + itemsPerPage, totalItems);
    const paginated = filtered.slice(startIdx, endIdx);

    // Update Info Pagination
    document.getElementById('infoStartUser').innerText =
      totalItems > 0 ? startIdx + 1 : 0;
    document.getElementById('infoEndUser').innerText = endIdx;
    document.getElementById('infoTotalUser').innerText = totalItems;
    document.getElementById('btnPrevUser').disabled = currentPageUser <= 1;
    document.getElementById('btnNextUser').disabled =
      currentPageUser >= maxPage;

    if (paginated.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="6" class="p-12 text-center text-gray-400 italic">Data user tidak ditemukan.</td></tr>';
      return;
    }

    tbody.innerHTML = paginated
      .map((u, i) => {
        const badgeRole = {
          Admin_Kab: 'bg-purple-100 text-purple-700',
          Admin_BPP: 'bg-blue-100 text-blue-700',
          Penyuluh: 'bg-green-100 text-green-700',
        };
        const badgeStatus =
          u.status === 'Aktif'
            ? 'bg-green-100 text-green-700'
            : 'bg-red-100 text-red-700';
        const wilayah =
          u.role === 'Admin_Kab'
            ? 'Kabupaten'
            : `${u.kecamatan}<br><span class="text-[10px] text-gray-400">${u.desa || '-'}</span>`;

        return `
            <tr class="border-b border-gray-50 hover:bg-gray-50 transition">
                <td class="p-4 text-center text-xs text-gray-500">${startIdx + i + 1}</td>
                <td class="p-4">
                    <div class="font-bold text-gray-800">${u.nama}</div>
                    <div class="text-[10px] text-gray-400 font-mono">${u.nip}</div>
                </td>
                <td class="p-4 text-[11px] text-gray-600 font-medium">
                    ${u.whatsapp ? `<a href="https://wa.me/${u.whatsapp}" target="_blank" class="text-green-600 hover:underline"><i class="fa-brands fa-whatsapp mr-1"></i>${u.whatsapp}</a>` : '-'}
                </td>
                <td class="p-4"><span class="px-2 py-1 ${badgeRole[u.role] || 'bg-gray-100'} text-[10px] font-bold rounded-full">${u.role}</span></td>
                <td class="p-4 text-center text-xs">${wilayah}</td>
                <td class="p-4 text-center"><span class="px-2 py-1 ${badgeStatus} text-[10px] font-bold rounded-full">${u.status}</span></td>
                <td class="p-4 text-center">
                    <div class="flex justify-center gap-2">
                        <button onclick="editUser('${u.id}')" class="w-8 h-8 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-600 hover:text-white transition shadow-sm"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="hapusUser('${u.id}', '${u.nip}')" class="w-8 h-8 bg-red-50 text-red-600 rounded-lg hover:bg-red-600 hover:text-white transition shadow-sm"><i class="fa-solid fa-trash-can"></i></button>

  function simpanUser(e) {
    e.preventDefault();

    const id = document.getElementById('userId').value;
    const nama = document.getElementById('userNama').value.trim();
    const whatsapp = document.getElementById('userWA') ? document.getElementById('userWA').value.trim() : '';
    const nip = document.getElementById('userNIP').value.trim();
    const password = document.getElementById('userPassword').value;
    const role = document.getElementById('userRole').value;
    let kecamatan = document.getElementById('userKec').value;
    const status = document.getElementById('userStatus').value;

    const checkedDesas = document.querySelectorAll(
      '#userDesaContainer input[name="userDesaBinaan"]:checked',
    );
    const desaArr = Array.from(checkedDesas).map((cb) => cb.value.trim());
    let desa = desaArr.join(', ');

    // Validasi input
    if (password.length < 4) {
      Swal.fire('Peringatan', 'Password minimal harus 4 karakter.', 'warning');
      return;
    }

    // Pembersihan & validasi data wilayah berdasarkan role
    if (role === 'Admin_Kab') {
      kecamatan = '-';
      desa = '-';
    } else if (role === 'Admin_BPP') {
      if (kecamatan === '-' || kecamatan === '') {
        Swal.fire(
          'Peringatan',
          'Silakan pilih kecamatan untuk akun BPP.',
          'warning',
        );
        return;
      }
      if (desaArr.length === 0) {
        Swal.fire(
          'Peringatan',
          'Silakan pilih minimal satu desa binaan untuk akun BPP.',
          'warning',
        );
        return;
      }
    } else if (role === 'Penyuluh') {
      if (kecamatan === '-' || kecamatan === '') {
        Swal.fire(
          'Peringatan',
          'Silakan pilih kecamatan untuk akun PPL.',
          'warning',
        );
        return;
      }
      if (desaArr.length === 0) {
        Swal.fire(
          'Peringatan',
          'Silakan pilih minimal satu desa binaan untuk akun PPL.',
          'warning',
        );
        return;
      }
    }

    const btn = document.getElementById('btnSimpanUser');
    const oldText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML =
      '<i class="fa-solid fa-circle-notch fa-spin"></i> Menyimpan...';

    const data = { id, nama, nip, password, role, kecamatan, desa, status, whatsapp };

    google.script.run
      .withSuccessHandler((res) => {
        btn.disabled = false;
        btn.innerHTML = oldText;
        if (res.status === 'success') {
          Swal.fire({
            icon: 'success',
            title: 'Berhasil',
            text: res.message,
            timer: 2000,
            showConfirmButton: false,
          });
          tutupModalUser();
          muatDaftarUser(true);
        } else {
          Swal.fire('Gagal', res.message, 'error');
        }
      })
      .simpanDataUser(data);
  }

    Swal.fire({

    });

  function renderTabelLogs() {
    const tbody = document.getElementById('tabelLogs');
    const itemsPerPage =
      parseInt(document.getElementById('itemsPerPageLogs').value) || 10;
    const totalItems = allLogsData.length;
    const maxPage = Math.ceil(totalItems / itemsPerPage) || 1;
    if (currentPageLogs > maxPage) currentPageLogs = maxPage;
    if (currentPageLogs < 1) currentPageLogs = 1;

    const startIdx = (currentPageLogs - 1) * itemsPerPage;
    const endIdx = Math.min(startIdx + itemsPerPage, totalItems);
    const paginated = allLogsData.slice(startIdx, endIdx);

    // Update Info Pagination
    document.getElementById('infoStartLogs').innerText =
      totalItems > 0 ? startIdx + 1 : 0;
    document.getElementById('infoEndLogs').innerText = endIdx;
    document.getElementById('infoTotalLogs').innerText = totalItems;
    document.getElementById('btnPrevLogs').disabled = currentPageLogs <= 1;
    document.getElementById('btnNextLogs').disabled =
      currentPageLogs >= maxPage;

    if (!paginated || paginated.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="7" class="p-8 text-center text-gray-400">Belum ada log sinkronisasi.</td></tr>';
      return;
    }

    tbody.innerHTML = paginated
      .map((log) => {
        const statusStr = log.status ? log.status.toString() : '';
        const isSukses = statusStr.indexOf('Sukses') !== -1;
        const hasData = log.dataBerisi > 0;

        let rowColor = 'hover:bg-gray-50';
        if (!isSukses) rowColor = 'bg-red-50 hover:bg-red-100';
        else if (hasData) rowColor = 'bg-green-50/30 hover:bg-green-50';

        let statusBadge = isSukses
          ? `<span class="bg-green-100 text-green-700 px-2 py-1 rounded text-[10px] font-bold"><i class="fa-solid fa-check mr-1"></i>Sukses</span>`
          : `<span class="bg-red-100 text-red-700 px-2 py-1 rounded text-[10px] font-bold"><i class="fa-solid fa-xmark mr-1"></i>Error</span>`;

        let tglLaporFormat = (log.tanggalLaporan || '-').toString();
        if (
          tglLaporFormat !== '-' &&
          typeof tglLaporFormat === 'string' &&
          tglLaporFormat.length > 5
        ) {
          const parts3 = tglLaporFormat.split(' ').slice(0, 3);
          if (parts3.length >= 3) {
            tglLaporFormat = parts3.join(' ').replace(',', '');
            const parts = tglLaporFormat.split(' ');
            if (parts.length >= 3 && isNaN(parts[0])) {
              tglLaporFormat = `${parts[1]} ${parts[0]} ${parts[2]}`;
            }
          }
        }

        let waktuFormat = log.waktuSinkron || '-';
        try {
          const dt = new Date(log.waktuSinkron);
          if (log.waktuSinkron && !isNaN(dt)) {
            waktuFormat = dt
              .toLocaleString('id-ID', {
                day: '2-digit',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
              })
              .replace(/\./g, ':');
          }
        } catch (e) {}

        return `
            <tr class="border-b border-gray-100 transition ${rowColor}">
                <td class="p-4 text-xs font-bold text-gray-700">${waktuFormat}</td>
                <td class="p-4 text-xs text-gray-500 font-mono">${log.idSync}</td>
                <td class="p-4 text-xs text-blue-600 font-bold">${tglLaporFormat}</td>
                <td class="p-4 text-sm font-bold text-gray-800 text-right">${log.totalTarik}</td>
                <td class="p-4 text-sm font-bold ${hasData ? 'text-green-600' : 'text-gray-400'} text-right">${log.dataBerisi}</td>
                <td class="p-4 text-sm font-bold text-gray-400 text-right">${log.dataNihil}</td>
                <td class="p-4 text-center">${statusBadge}</td>
            </tr>`;
      })
      .join('');
  }
