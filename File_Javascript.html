  /** Live search handler */
  function onSearchLaporan() {
    _laporanLTTPage = 1;
    _applySearchAndRender();
  }

  /** Set ukuran halaman */
  function setPageSizeLaporan() {
    const val = parseInt(document.getElementById('pageSizeLaporan').value);
    _laporanLTTPageSize = isNaN(val) ? 10 : val;
    _laporanLTTPage = 1;
    _renderTabelLaporan(_laporanLTTFiltered);
  }

  /** Sorting kolom */
  function sortLaporan(field) {
    if (_laporanLTTSort.field === field) {
      _laporanLTTSort.dir = _laporanLTTSort.dir === 'asc' ? 'desc' : 'asc';
    } else {
      _laporanLTTSort.field = field;
      _laporanLTTSort.dir = 'asc';
    }
    // Update icon sort
    [
      'timestamp',
      'pelapor',
      'kecamatan',
      'desa',
      'luas_tanam',
      'luas_panen',
    ].forEach((f) => {
      const icon = document.getElementById('sortIcon-' + f);
      if (!icon) return;
      if (f === _laporanLTTSort.field) {
        icon.className =
          'fa-solid ml-1 ' +
          (_laporanLTTSort.dir === 'asc'
            ? 'fa-sort-up text-green-600'
            : 'fa-sort-down text-green-600');
      } else {
        icon.className = 'fa-solid fa-sort text-gray-300 ml-1';
      }
    });
    _laporanLTTPage = 1;
    _applySearchAndRender();
  }

  /** Terapkan live search ke data dan render */
  function _applySearchAndRender() {
    const q = (document.getElementById('searchLaporan').value || '')
      .toLowerCase()
      .trim();
    if (!q) {
      _laporanLTTFiltered = [..._laporanLTTData];
    } else {
      _laporanLTTFiltered = _laporanLTTData.filter(
        (r) =>
          r.pelapor.toLowerCase().includes(q) ||
          r.kecamatan.toLowerCase().includes(q) ||
          r.desa.toLowerCase().includes(q) ||
          (r.jenis_ltt || '').toLowerCase().includes(q) ||
          (r.metode_penanaman || '').toLowerCase().includes(q),
      );
    }

    // Sort
    const { field, dir } = _laporanLTTSort;
    _laporanLTTFiltered.sort((a, b) => {
      let va = a[field];
      let vb = b[field];
      if (typeof va === 'number' && typeof vb === 'number') {
        return dir === 'asc' ? va - vb : vb - va;
      }
      va = String(va || '').toLowerCase();
      vb = String(vb || '').toLowerCase();
      const cmp = va.localeCompare(vb, 'id');
      return dir === 'asc' ? cmp : -cmp;
    });

    // Update stat pencarian
    const elCari = document.getElementById('statHasilCari');
    if (elCari)
      elCari.innerText = _laporanLTTFiltered.length.toLocaleString('id-ID');

    _renderTabelLaporan(_laporanLTTFiltered);
  }

  /** Format tanggal dari "yyyy-MM-dd HH:mm" ke "DD MMM YYYY" */
  function _formatTglLaporan(ts) {
    if (!ts) return '-';
    const tgl = ts.split(' ')[0];
    if (!tgl) return ts;
    const [y, m, d] = tgl.split('-');
    const bulan = [
      'Jan',
      'Feb',
      'Mar',
      'Apr',
      'Mei',
      'Jun',
      'Jul',
      'Ags',
      'Sep',
      'Okt',
      'Nov',
      'Des',
    ];
    return `${parseInt(d)} ${bulan[parseInt(m) - 1] || m} ${y}`;
  }

  /** Format angka Ha */
  function _fmtHa(val) {
    const n = parseFloat(val) || 0;
    if (n === 0) return '<span class="text-gray-300">—</span>';
    return _numId(n);
  }

  /** Update statistik ringkasan */
  function _updateStat() {
    const totalData = _laporanLTTData.length;
    const totalTanam = _laporanLTTData.reduce(
      (s, r) => s + (parseFloat(r.luas_tanam) || 0),
      0,
    );
    const totalPanen = _laporanLTTData.reduce(
      (s, r) => s + (parseFloat(r.luas_panen) || 0),
      0,
    );

    const elTotal = document.getElementById('statTotalLaporan');
    const elTanam = document.getElementById('statTotalTanam');
    const elPanen = document.getElementById('statTotalPanen');
    const elCari = document.getElementById('statHasilCari');

    if (elTotal) elTotal.innerText = totalData.toLocaleString('id-ID');
    if (elTanam) elTanam.innerText = _numId(totalTanam) + ' Ha';
    if (elPanen) elPanen.innerText = _numId(totalPanen) + ' Ha';
    if (elCari) elCari.innerText = totalData.toLocaleString('id-ID');
  }

  /** Render tabel dengan data yang sudah difilter + pagination */
  function _renderTabelLaporan(data) {
    const tbody = document.getElementById('tbodyLaporanLTT');
    if (!tbody) return;

    const total = data.length;
    const pageSize = _laporanLTTPageSize; // 0 = semua
    const totalPages = pageSize > 0 ? Math.ceil(total / pageSize) : 1;
    if (_laporanLTTPage > totalPages) _laporanLTTPage = 1;
    const page = _laporanLTTPage;

    const start = pageSize > 0 ? (page - 1) * pageSize : 0;
    const end = pageSize > 0 ? Math.min(start + pageSize, total) : total;
    const sliced = data.slice(start, end);

    if (sliced.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="14" class="p-10 text-center text-gray-400 italic"><i class="fa-solid fa-inbox text-3xl text-gray-300 mb-3 block"></i>Tidak ada data yang sesuai.</td></tr>';
    } else {
      const komColor = {
        Padi: 'bg-blue-50 text-blue-700 border-blue-100',
        Jagung: 'bg-yellow-50 text-yellow-700 border-yellow-100',
        'Ubi Kayu': 'bg-orange-50 text-orange-700 border-orange-100',
      };
      tbody.innerHTML = sliced
        .map((r, idx) => {
          const no = start + idx + 1;
          const komClass =
            komColor[r.komoditas] || 'bg-gray-50 text-gray-600 border-gray-100';
          const rowBg = idx % 2 === 0 ? '' : 'bg-gray-50/50';
          return `<tr class="hover:bg-green-50/30 transition-colors ${rowBg}">
                    <td class="p-3 text-center text-gray-400 border-r border-gray-100">${no}</td>
                    <td class="p-3 border-r border-gray-100 text-gray-700 font-medium">${_formatTglLaporan(r.timestamp)}</td>
                    <td class="p-3 border-r border-gray-100 font-bold text-gray-800">${r.pelapor || '-'}</td>
                    <td class="p-3 border-r border-gray-100 text-gray-600">${r.kecamatan || '-'}</td>
                    <td class="p-3 border-r border-gray-100 text-gray-600">${r.desa || '-'}</td>
                    <td class="p-3 border-r border-gray-100"><span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold border ${komClass}">${r.komoditas || '-'}</span></td>
                    <td class="p-3 border-r border-gray-100 text-gray-500">${r.jenis_ltt || '<span class="text-gray-300">—</span>'}</td>
                    <td class="p-3 border-r border-gray-100 text-gray-500">${r.metode_penanaman || '<span class="text-gray-300">—</span>'}</td>
                    <td class="p-3 border-r border-gray-100 text-right text-gray-600">${_fmtHa(r.luas_bera)}</td>
                    <td class="p-3 border-r border-gray-100 text-right text-gray-600">${_fmtHa(r.olah_lahan)}</td>
                    <td class="p-3 border-r border-gray-100 text-right font-bold text-blue-700">${_fmtHa(r.luas_tanam)}</td>
                    <td class="p-3 border-r border-gray-100 text-right font-bold text-yellow-700">${_fmtHa(r.luas_panen)}</td>
                    <td class="p-3 border-r border-gray-100 text-gray-500 max-w-[150px] truncate" title="${r.keterangan}">${r.keterangan || '-'}</td>
                    <td class="p-3 border-r border-gray-100 text-gray-700 text-[11px]">${r.status || '-'}</td>
                    <td class="p-3 text-center">
                      <button onclick="bukaEditLaporanAdmin('${r.id}')" title="Edit Laporan" class="w-7 h-7 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-600 hover:text-white transition shadow-sm flex items-center justify-center mx-auto">
                        <i class="fa-solid fa-pen-to-square text-xs"></i>
                      </button>
                    </td>
                </tr>`;
        })
        .join('');
    }

    // Info paginasi
    const infoEl = document.getElementById('infoPaginasiLaporan');
    if (infoEl) {
      if (pageSize > 0 && total > 0) {
        infoEl.innerText = `Menampilkan ${start + 1}–${end} dari ${total.toLocaleString('id-ID')} data`;
      } else {
        infoEl.innerText = `Menampilkan ${total.toLocaleString('id-ID')} data`;
      }
    }

    // Render tombol paginasi
    const btnContainer = document.getElementById('btnPaginasiLaporan');
    if (btnContainer && pageSize > 0) {
      btnContainer.innerHTML = '';
      const MAX_BTN = 7;
      let startPage = Math.max(1, page - Math.floor(MAX_BTN / 2));
      let endPage = Math.min(totalPages, startPage + MAX_BTN - 1);
      if (endPage - startPage < MAX_BTN - 1)
        startPage = Math.max(1, endPage - MAX_BTN + 1);

      const mkBtn = (label, pageNum, active, disabled) => {
        const cls = active
          ? 'px-3 py-1.5 rounded-lg text-xs font-bold bg-green-600 text-white shadow-sm'
          : disabled
            ? 'px-3 py-1.5 rounded-lg text-xs font-bold text-gray-300 cursor-not-allowed'
            : 'px-3 py-1.5 rounded-lg text-xs font-bold text-gray-600 hover:bg-green-50 border border-gray-200 transition';
        return `<button class="${cls}" ${disabled ? 'disabled' : ''} onclick="_goPageLaporan(${pageNum})">${label}</button>`;
      };

      btnContainer.innerHTML += mkBtn('‹ Prev', page - 1, false, page <= 1);
      for (let p = startPage; p <= endPage; p++) {
        btnContainer.innerHTML += mkBtn(p, p, p === page, false);
      }
      btnContainer.innerHTML += mkBtn(
        'Next ›',
        page + 1,
        false,
        page >= totalPages,
      );
    } else if (btnContainer) {
      btnContainer.innerHTML = '';
    }
  }

  function _goPageLaporan(p) {
    const pageSize = _laporanLTTPageSize;
    const totalPages =
      pageSize > 0 ? Math.ceil(_laporanLTTFiltered.length / pageSize) : 1;
    if (p < 1 || p > totalPages) return;
    _laporanLTTPage = p;
    _renderTabelLaporan(_laporanLTTFiltered);
  }

  /** Export data ter-filter ke Excel (.xlsx) menggunakan ExcelJS */
  function unduhExcelLaporan() {
    if (_laporanLTTFiltered.length === 0) {
      Swal.fire(
        'Kosong',
        'Tidak ada data untuk diunduh. Muat data terlebih dahulu.',
        'info',
      );
      return;
    }

    const doExport = async () => {
      await loadExcelJS();
      const now = new Date();
      const tgl = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, '0'),
        String(now.getDate()).padStart(2, '0'),
      ].join('');
      const komFilter =
        document.getElementById('filterKomLaporan').value || 'Semua';
      const filename = `LaporanLTT_${komFilter.replace(' ', '_')}_${tgl}.xlsx`;

      const wb = new ExcelJS.Workbook();
      const ws = wb.addWorksheet('Laporan LTT');

      const headers = [
        'No',
        'Tanggal Laporan',
        'Nama Penyuluh',
        'Kecamatan',
        'Desa',
        'Komoditas',
        'Jenis LTT',
        'Lahan Bera (Ha)',
        'Olah Lahan (Ha)',
        'Luas Tanam (Ha)',
        'Luas Panen (Ha)',
        'Keterangan',
        'Status',
      ];
      const colWidths = [4, 20, 22, 18, 18, 10, 14, 12, 12, 12, 12, 28, 12];
      ws.columns = colWidths.map((w) => ({ width: w }));

      // Baris judul
      ws.mergeCells('A1:M1');
      const titleCell = ws.getCell('A1');
      titleCell.value = `Laporan LTT ${komFilter} \u2014 Diekspor ${now.toLocaleString('id-ID')}`;
      titleCell.font = { bold: true, size: 12, color: { argb: 'FFFFFFFF' } };
      titleCell.fill = {
        type: 'pattern',
        pattern: 'solid',
        fgColor: { argb: 'FF16a34a' },
      };
      titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
      ws.getRow(1).height = 24;

      // Baris header
      const headerRow = ws.addRow(headers);
      headerRow.eachCell((c) => {
        c.font = { bold: true, color: { argb: 'FFFFFFFF' } };
        c.fill = {
          type: 'pattern',
          pattern: 'solid',
          fgColor: { argb: 'FF15803d' },
        };
        c.alignment = {
          horizontal: 'center',
          vertical: 'middle',
          wrapText: true,
        };
        c.border = {
          top: { style: 'thin' },
          bottom: { style: 'thin' },
          left: { style: 'thin' },
          right: { style: 'thin' },
        };
      });
      ws.getRow(2).height = 20;

      // Baris data
      _laporanLTTFiltered.forEach((r, i) => {
        const row = ws.addRow([
          i + 1,
          _formatTglLaporan(r.timestamp),
          r.pelapor || '',
          r.kecamatan || '',
          r.desa || '',
          r.komoditas || '',
          r.jenis_ltt || '',
          parseFloat(r.luas_bera) || 0,
          parseFloat(r.olah_lahan) || 0,
          parseFloat(r.luas_tanam) || 0,
          parseFloat(r.luas_panen) || 0,
          r.keterangan || '',
          r.status || '',
        ]);
        const isEven = i % 2 === 0;
        row.eachCell((c, ci) => {
          c.border = {
            top: { style: 'thin' },
            bottom: { style: 'thin' },
            left: { style: 'thin' },
            right: { style: 'thin' },
          };
          c.alignment = { vertical: 'middle' };
          if (isEven)
            c.fill = {
              type: 'pattern',
              pattern: 'solid',
              fgColor: { argb: 'FFF0FDF4' },
            };
          if (ci >= 8 && ci <= 11) {
            c.numFmt = '#,##0.##;-#,##0.##;0';
            c.alignment = { horizontal: 'right', vertical: 'middle' };
          }
        });
      });

      wb.xlsx.writeBuffer().then((buf) => {
        const blob = new Blob([buf], {
          type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    };

    doExport().catch(function (err) {
      Swal.fire('Error', err.message || 'Gagal mengekspor Excel.', 'error');
    });
  }

      window.history.state &&

  window.submitEditLaporanAdmin = function (e) {
    if (e) e.preventDefault();
    const id = document.getElementById('editLaporanAdminId').value;
    const bera = document.getElementById('editLaporanAdminBera').value;
    const olah = document.getElementById('editLaporanAdminOlah').value;
    const tanam = document.getElementById('editLaporanAdminTanam').value;
    const panen = document.getElementById('editLaporanAdminPanen').value;
    const metode = document.getElementById('editLaporanAdminMetode').value;
    const btn = document.getElementById('btnSimpanEditLaporanAdmin');
    const ikon = document.getElementById('ikonSimpanEditLaporanAdmin');
    const teks = document.getElementById('teksSimpanEditLaporanAdmin');

    if (btn) btn.disabled = true;
    if (ikon) ikon.className = 'fa-solid fa-circle-notch fa-spin';
    if (teks) teks.textContent = 'Menyimpan...';

    google.script.run
      .withSuccessHandler(function (res) {
        if (btn) btn.disabled = false;
        if (ikon) ikon.className = 'fa-solid fa-floppy-disk';
        if (teks) teks.textContent = 'Simpan';
        if (res.status === 'success') {
          tutupEditLaporanAdmin();
          cacheRekap = {};
          _laporanLTTLoaded = false;
          Swal.fire({
            icon: 'success',
            title: 'Tersimpan!',
            timer: 1200,
            showConfirmButton: false,
          });
          muatLaporanLTT(true);
        } else {
          Swal.fire('Error', res.message || 'Gagal menyimpan data.', 'error');
        }
      })
      .withFailureHandler(function (err) {

  window.bukaBppSidebar = function () {
    const sidebar = document.getElementById('bppSidebar');
    const backdrop = document.getElementById('bppSidebarBackdrop');
    if (!sidebar || !backdrop) return;

    backdrop.classList.remove('hidden');
    // Trigger CSS transition
    setTimeout(() => {
      backdrop.classList.remove('opacity-0');
      backdrop.classList.add('opacity-100');
      sidebar.classList.remove('-translate-x-full');
      sidebar.classList.add('translate-x-0');
    }, 10);
  };

  window.tutupBppSidebar = function () {
    const sidebar = document.getElementById('bppSidebar');
    const backdrop = document.getElementById('bppSidebarBackdrop');
    if (!sidebar || !backdrop) return;

    sidebar.classList.remove('translate-x-0');
    sidebar.classList.add('-translate-x-full');
    backdrop.classList.remove('opacity-100');
    backdrop.classList.add('opacity-0');

    setTimeout(() => {
      backdrop.classList.add('hidden');
    }, 300);

  window.navigasiBpp = function (target) {
    const secDashboard = document.getElementById('bppSectionDashboard');
    const secTarget = document.getElementById('bppSectionTarget');
    const secManajemen = document.getElementById('bppSectionManajemenPPL');
    const secVerifikasi = document.getElementById('bppSectionVerifikasi');
    const secLaporanLTT = document.getElementById('bppSectionLaporanLTT');

    const btnDashboard = document.getElementById('btnNavDashboard');
    const btnTarget = document.getElementById('btnNavTarget');
    const btnManajemen = document.getElementById('btnNavManajemen');
    const btnVerifikasi = document.getElementById('btnNavVerifikasi');
    const btnLaporanLTT = document.getElementById('btnNavLaporanLttBpp');

    if (!secDashboard || !secTarget || !secManajemen || !secVerifikasi || !secLaporanLTT) return;

    // Reset visibility
    secDashboard.classList.add('hidden');
    secTarget.classList.add('hidden');
    secManajemen.classList.add('hidden');
    secVerifikasi.classList.add('hidden');
    secLaporanLTT.classList.add('hidden');

    // Reset button active states
    const activeClasses = ['bg-green-900', 'text-white'];
    const inactiveClasses = [
      'text-green-100',
      'hover:bg-green-700',
      'hover:text-white',
    ];

    [btnDashboard, btnTarget, btnManajemen, btnVerifikasi, btnLaporanLTT].forEach((btn) => {
      if (btn) {
        btn.classList.remove(...activeClasses);
        btn.classList.add(...inactiveClasses);
      }
    });

    if (target === 'dashboard') {
      secDashboard.classList.remove('hidden');
      if (btnDashboard) {
        btnDashboard.classList.add(...activeClasses);
        btnDashboard.classList.remove(...inactiveClasses);
      }
    } else if (target === 'verifikasi') {
      secVerifikasi.classList.remove('hidden');
      if (btnVerifikasi) {
        btnVerifikasi.classList.add(...activeClasses);
        btnVerifikasi.classList.remove(...inactiveClasses);
      }
      window.history.pushState({ overlay: 'bppSectionVerifikasi' }, '');
    } else if (target === 'target') {
      secTarget.classList.remove('hidden');
      if (btnTarget) {
        btnTarget.classList.add(...activeClasses);
        btnTarget.classList.remove(...inactiveClasses);
      }
      window.history.pushState({ overlay: 'bppSectionTarget' }, '');
      muatBppTargetBulan();
    } else if (target === 'manajemen') {
      secManajemen.classList.remove('hidden');
      if (btnManajemen) {
        btnManajemen.classList.add(...activeClasses);
        btnManajemen.classList.remove(...inactiveClasses);
      }
      window.history.pushState({ overlay: 'bppSectionManajemen' }, '');
      // Pastikan data PPL dimuat dan section PPL dimunculkan isinya
      const pplDiv = document.getElementById('kontenManajemenPPL');
      const icon = document.getElementById('iconTogglePPL');
      const text = document.getElementById('textTogglePPL');
      const btnTambah = document.getElementById('btnTambahPPL');
      if (pplDiv && icon && text && btnTambah) {
        pplDiv.classList.remove('hidden');
        icon.className = 'fa-solid fa-chevron-up';
        text.innerText = 'Sembunyikan';
        btnTambah.classList.remove('hidden');
      }
      if (daftarPPLLokal.length === 0) {
        muatDaftarPPL();
      }
    } else if (target === 'laporan-ltt') {
      secLaporanLTT.classList.remove('hidden');
      if (btnLaporanLTT) {
        btnLaporanLTT.classList.add(...activeClasses);
        btnLaporanLTT.classList.remove(...inactiveClasses);
      }
      window.history.pushState({ overlay: 'bppSectionLaporanLTT' }, '');
      // Muat data jika pertama kali
      if (
        document.getElementById('bppTbodyLaporanLTT').children.length === 1 &&
        document.getElementById('bppTbodyLaporanLTT').innerText.includes('Memuat data laporan')
      ) {
        muatLaporanLTTBPP(false);
      }
    }

    tutupBppSidebar();
  };

  function bukaModalTargetPmAas() {
    const sel = document.getElementById('filterBulanPmAas');
    if (!sel || !sel.value) return;
    const parts = sel.value.split('-');
    const tahun = parseInt(parts[0]);
    const bulan = parseInt(parts[1]);
    const textBulan = sel.options[sel.selectedIndex].text;

    Swal.fire({
      title: 'Set Target PM AAS',
      text: `Masukkan target luas tanam (Ha) untuk ${textBulan}:`,
      input: 'number',
      inputValue: _currentTargetPmAas || '',
      inputAttributes: { min: 0, step: 'any' },
      showCancelButton: true,
      confirmButtonText: 'Simpan',
      cancelButtonText: 'Batal',
      showLoaderOnConfirm: true,
      preConfirm: (target) => {
        if (!target) {
          Swal.showValidationMessage('Target tidak boleh kosong');
          return;
        }
        return new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler((res) => {
              if (res.status === 'success') resolve();
              else reject(res.message);
            })
            .withFailureHandler((err) => reject(err))
            .simpanTargetPmAasKabupaten(tahun, bulan, target);
        }).catch((err) => {
          Swal.showValidationMessage(`Request gagal: ${err}`);
        });
      },
      allowOutsideClick: () => !Swal.isLoading()
    }).then((result) => {
      if (result.isConfirmed) {
        Swal.fire('Tersimpan!', 'Target PM AAS berhasil diperbarui.', 'success');
        muatPmAas();
      }
    });
  }

  function muatPmAas() {
    const sel = document.getElementById('filterBulanPmAas');
    if (!sel || !sel.value) return;
    const parts = sel.value.split('-');
    const tahun = parseInt(parts[0]);
    const bulan = parseInt(parts[1]);

    const tbody = document.getElementById('tabelPmAas');
    tbody.innerHTML = '<tr><td colspan="3" class="p-8 text-center text-gray-400"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Memuat data...</td></tr>';
    document.getElementById('totalTanamPmAas').innerHTML = '0 <span class="text-xs font-normal text-gray-500">Ha</span>';
    document.getElementById('totalPanenPmAas').innerHTML = '0 <span class="text-xs font-normal text-gray-500">Ha</span>';
    document.getElementById('capaianTargetPmAas').innerText = '0 Ha';
    document.getElementById('capaianRealisasiPmAas').innerText = '0 Ha';
    document.getElementById('capaianSisaPmAas').innerHTML = '<i class="fa-solid fa-circle-info"></i> Sisa Target: 0 Ha';
    
    const labelBulan = sel.options[sel.selectedIndex].text;
    const labelEl = document.getElementById('labelBulanPmAasKecamatan');
    if (labelEl) labelEl.innerText = 'Periode: ' + labelBulan;

    google.script.run
      .withSuccessHandler((res) => {
        if (res.error) {
          tbody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-red-500">${res.error}</td></tr>`;
          if (chartPmAasTanam) chartPmAasTanam.destroy();
          return;
        }

        document.getElementById('totalTanamPmAas').innerHTML = `${formatAngkaLTT(res.totalTanam)} <span class="text-xs font-normal text-gray-500">Ha</span>`;
        document.getElementById('totalPanenPmAas').innerHTML = `${formatAngkaLTT(res.totalPanen)} <span class="text-xs font-normal text-gray-500">Ha</span>`;
        
        document.getElementById('capaianTargetPmAas').innerText = `${formatAngkaLTT(res.targetTanam)} Ha`;
        document.getElementById('capaianRealisasiPmAas').innerText = `${formatAngkaLTT(res.totalTanam)} Ha`;
        const sisa = Math.max(0, res.targetTanam - res.totalTanam);
        document.getElementById('capaianSisaPmAas').innerHTML = `<i class="fa-solid fa-circle-info"></i> Sisa Target: ${formatAngkaLTT(sisa)} Ha`;

        _currentTargetPmAas = res.targetTanam || '';

        let html = '';
        if (res.rincian.length === 0) {
          html = '<tr><td colspan="3" class="p-8 text-center text-gray-400">Tidak ada data PM AAS untuk bulan ini</td></tr>';
        } else {
          res.rincian.forEach((row) => {
            html += `<tr class="border-b hover:bg-gray-50">
              <td class="p-3 font-medium text-gray-800">${row.metode}</td>
              <td class="p-3 text-right font-bold text-green-600">${formatAngkaLTT(row.tanam)}</td>
              <td class="p-3 text-right font-bold text-yellow-600">${formatAngkaLTT(row.panen)}</td>
            </tr>`;
          });
        }
        tbody.innerHTML = html;

        // Render Tabel Kecamatan
        const tbodyKec = document.getElementById('tabelPmAasKecamatan');
        if (tbodyKec) {
          let htmlKec = '';
          if (!res.rekapKecamatan || res.rekapKecamatan.length === 0) {
            htmlKec = '<tr><td colspan="4" class="p-8 text-center text-gray-400">Tidak ada data PM AAS untuk bulan ini</td></tr>';
          } else {
            let totalTanamKec = 0;
            let totalPanenKec = 0;
            res.rekapKecamatan.forEach((row, index) => {
              totalTanamKec += row.tanam;
              totalPanenKec += row.panen;
              const rowBg = index % 2 === 0 ? 'bg-white' : 'bg-gray-50/50';
              htmlKec += `<tr class="${rowBg} hover:bg-green-50/30 transition duration-150 border-b border-gray-100 text-xs">
                <td class="p-3 border-r border-gray-200 text-center text-gray-500 font-medium">${index + 1}</td>
                <td class="p-3 border-r border-gray-200 font-semibold text-gray-800">${row.kecamatan}</td>
                <td class="p-2 border-r border-gray-200 text-right tabular-nums font-bold text-gray-900 bg-green-50/10">${formatAngkaLTT(row.tanam)}</td>
                <td class="p-2 text-right tabular-nums font-bold text-gray-900 bg-green-50/10">${formatAngkaLTT(row.panen)}</td>
              </tr>`;
            });
            htmlKec += `<tr class="bg-yellow-50 text-yellow-900 font-bold border-t border-gray-300 text-xs">
                <td colspan="2" class="p-3 border-r border-gray-200 text-center uppercase tracking-wider">Jumlah</td>
                <td class="p-2 border-r border-gray-200 text-right tabular-nums">${formatAngkaLTT(totalTanamKec)}</td>
                <td class="p-2 text-right tabular-nums">${formatAngkaLTT(totalPanenKec)}</td>
            </tr>`;
          }
          tbodyKec.innerHTML = htmlKec;
        }
        
        renderChartPmAas(res.persentaseCapaian);
      })
      .withFailureHandler((err) => {
        tbody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-red-500">Gagal memuat data: ${err}</td></tr>`;
      })
      .getDashboardPmAas({ bulan: bulan, tahun: tahun, forceRefresh: false });
  }

  // === LAPORAN LTT BPP STATE ===
  let _bppLaporanLTTData = [];
  let _bppLaporanLTTFiltered = [];
  let _bppLaporanLTTLoaded = false;
  let _bppLaporanLTTPage = 1;
  let _bppLaporanLTTPageSize = 10;
  let _bppLaporanLTTSort = { field: 'timestamp', dir: 'desc' };
  let _bppLaporanLTTReqId = 0;

  function muatLaporanLTTBPP(force = false) {
    const iconRefresh = document.getElementById('bppIconRefreshLaporan');
    if (iconRefresh) iconRefresh.classList.add('fa-spin');

    document.getElementById('bppTbodyLaporanLTT').innerHTML =
      '<tr><td colspan="14" class="p-12 text-center text-gray-400 italic"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-green-500 mb-3 block"></i>Memuat data laporan...</td></tr>';

    const tglMulaiEl = document.getElementById('bppFilterTglMulaiLaporan');
    const tglSelesaiEl = document.getElementById('bppFilterTglSelesaiLaporan');
    const now = new Date();
    const todayStr =
      now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');

    if (tglMulaiEl && !tglMulaiEl.value) tglMulaiEl.value = todayStr;
    if (tglSelesaiEl && !tglSelesaiEl.value) tglSelesaiEl.value = todayStr;

    const tglMulai = tglMulaiEl ? tglMulaiEl.value : '';
    const tglSelesai = tglSelesaiEl ? tglSelesaiEl.value : '';

    if (tglMulai && tglSelesai) {
      if (tglMulai > tglSelesai) {
        if (iconRefresh) iconRefresh.classList.remove('fa-spin');
        Swal.fire('Error', 'Tanggal mulai tidak boleh melebihi tanggal selesai.', 'error');
        _bppRenderTabelLaporan(_bppLaporanLTTData);
        return;
      }
      if (tglMulai.substring(0, 7) !== tglSelesai.substring(0, 7)) {
        if (iconRefresh) iconRefresh.classList.remove('fa-spin');
        Swal.fire('Peringatan', 'Tanggal mulai dan selesai harus berada dalam bulan yang sama.', 'warning');
        _bppRenderTabelLaporan(_bppLaporanLTTData);
        return;
      }
    }

    const params = {};
    if (tglMulai) params.tanggalMulai = tglMulai;
    if (tglSelesai) params.tanggalSelesai = tglSelesai;
    const kom = document.getElementById('bppFilterKomLaporan').value;
    const desa = (document.getElementById('bppFilterDesaLaporan').value || '').trim();
    params.komoditas = kom || 'Padi';
    
    // Paksa kecamatan dari userBppAktif
    if (userAktif && userAktif.kecamatan) {
        params.kecamatan = userAktif.kecamatan;
    } else {
        // Fallback jika aneh
        if (iconRefresh) iconRefresh.classList.remove('fa-spin');
        Swal.fire('Error', 'Sesi tidak valid. Silakan login kembali.', 'error');
        return;
    }

    if (desa) params.desa = desa;

    _bppMuatDropdownDesaLaporan(params.kecamatan);

    const myReqId = ++_bppLaporanLTTReqId;

    google.script.run
      .withSuccessHandler(function (res) {
        if (myReqId !== _bppLaporanLTTReqId) return;
        if (iconRefresh) iconRefresh.classList.remove('fa-spin');
        if (res.status !== 'success') {
          document.getElementById('bppTbodyLaporanLTT').innerHTML =
            '<tr><td colspan="14" class="p-10 text-center text-red-400"><i class="fa-solid fa-triangle-exclamation mr-2"></i>' +
            (res.message || 'Gagal memuat data') +
            '</td></tr>';
          return;
        }
        _bppLaporanLTTData = res.data || [];
        _bppLaporanLTTLoaded = true;
        _bppLaporanLTTPage = 1;
        _bppUpdateStat();
        _bppApplySearchAndRender();
      })
      .withFailureHandler(function (err) {
        if (myReqId !== _bppLaporanLTTReqId) return;
        if (iconRefresh) iconRefresh.classList.remove('fa-spin');
        document.getElementById('bppTbodyLaporanLTT').innerHTML =
          '<tr><td colspan="14" class="p-10 text-center text-red-400"><i class="fa-solid fa-triangle-exclamation mr-2"></i>Error: ' +
          (err.message || err) +
          '</td></tr>';
      })
      .getLaporanLTT(params);
  }

  let _bppDesaLaporanLoadedKec = '';
  function _bppMuatDropdownDesaLaporan(kec) {
    if (_bppDesaLaporanLoadedKec === kec) return;
    const selDesa = document.getElementById('bppFilterDesaLaporan');
    selDesa.disabled = true;
    selDesa.innerHTML = '<option value="">Memuat desa...</option>';

    _bppApplySearchAndRender();
  }

  function bppSetPageSizeLaporan() {
    const val = parseInt(document.getElementById('bppPageSizeLaporan').value);
    _bppLaporanLTTPageSize = isNaN(val) ? 10 : val;
    _bppLaporanLTTPage = 1;
    _bppRenderTabelLaporan(_bppLaporanLTTFiltered);
  }

  function bppSortLaporan(field) {
    if (_bppLaporanLTTSort.field === field) {
      _bppLaporanLTTSort.dir = _bppLaporanLTTSort.dir === 'asc' ? 'desc' : 'asc';
    } else {
      _bppLaporanLTTSort.field = field;
      _bppLaporanLTTSort.dir = 'asc';
    }
    ['timestamp', 'pelapor', 'desa', 'luas_tanam', 'luas_panen', 'luas_bera', 'olah_lahan'].forEach((f) => {
      const icon = document.getElementById('bppSortIcon-' + f);
      if (!icon) return;
      if (f === _bppLaporanLTTSort.field) {
        icon.className = 'fa-solid ml-1 ' + (_bppLaporanLTTSort.dir === 'asc' ? 'fa-sort-up text-green-600' : 'fa-sort-down text-green-600');
      } else {
        icon.className = 'fa-solid fa-sort text-gray-300 ml-1';
      }
    });
    _bppLaporanLTTPage = 1;
    _bppApplySearchAndRender();
  }

  function _bppApplySearchAndRender() {
    const q = (document.getElementById('bppSearchLaporan').value || '').toLowerCase().trim();
    if (!q) {
      _bppLaporanLTTFiltered = [..._bppLaporanLTTData];
    } else {
      _bppLaporanLTTFiltered = _bppLaporanLTTData.filter(
        (r) =>
          r.pelapor.toLowerCase().includes(q) ||
          r.desa.toLowerCase().includes(q) ||
          (r.jenis_ltt || '').toLowerCase().includes(q) ||
          (r.metode_penanaman || '').toLowerCase().includes(q),
      );
    }
    const { field, dir } = _bppLaporanLTTSort;
    _bppLaporanLTTFiltered.sort((a, b) => {
      let va = a[field];
      let vb = b[field];
      if (typeof va === 'number' && typeof vb === 'number') {
        return dir === 'asc' ? va - vb : vb - va;
      }
      va = String(va || '').toLowerCase();
      vb = String(vb || '').toLowerCase();
      const cmp = va.localeCompare(vb, 'id');
      return dir === 'asc' ? cmp : -cmp;
    });
    const elCari = document.getElementById('bppStatHasilCari');
    if (elCari) elCari.innerText = _bppLaporanLTTFiltered.length.toLocaleString('id-ID');
    _bppRenderTabelLaporan(_bppLaporanLTTFiltered);
  }

  function _bppUpdateStat() {
    const totalData = _bppLaporanLTTData.length;
    const totalTanam = _bppLaporanLTTData.reduce((s, r) => s + (parseFloat(r.luas_tanam) || 0), 0);
    const totalPanen = _bppLaporanLTTData.reduce((s, r) => s + (parseFloat(r.luas_panen) || 0), 0);
    const elTotal = document.getElementById('bppStatTotalLaporan');
    const elTanam = document.getElementById('bppStatTotalTanam');
    const elPanen = document.getElementById('bppStatTotalPanen');
    const elCari = document.getElementById('bppStatHasilCari');
    if (elTotal) elTotal.innerText = totalData.toLocaleString('id-ID');
    if (elTanam) elTanam.innerText = _numId(totalTanam) + ' Ha';
    if (elPanen) elPanen.innerText = _numId(totalPanen) + ' Ha';
    if (elCari) elCari.innerText = totalData.toLocaleString('id-ID');
  }

  function _bppRenderTabelLaporan(data) {
    const tbody = document.getElementById('bppTbodyLaporanLTT');
    if (!tbody) return;
    const total = data.length;
    const pageSize = _bppLaporanLTTPageSize;
    const totalPages = pageSize > 0 ? Math.ceil(total / pageSize) : 1;
    if (_bppLaporanLTTPage > totalPages) _bppLaporanLTTPage = 1;
    const page = _bppLaporanLTTPage;
    const start = pageSize > 0 ? (page - 1) * pageSize : 0;
    const end = pageSize > 0 ? Math.min(start + pageSize, total) : total;
    const sliced = data.slice(start, end);
    if (sliced.length === 0) {
      tbody.innerHTML = '<tr><td colspan="14" class="p-10 text-center text-gray-400 italic"><i class="fa-solid fa-inbox text-3xl text-gray-300 mb-3 block"></i>Tidak ada data yang sesuai.</td></tr>';
    } else {
      const komColor = { Padi: 'bg-blue-50 text-blue-700 border-blue-100', Jagung: 'bg-yellow-50 text-yellow-700 border-yellow-100', 'Ubi Kayu': 'bg-orange-50 text-orange-700 border-orange-100' };
      tbody.innerHTML = sliced.map((r, idx) => {
        const no = start + idx + 1;
        const komClass = komColor[r.komoditas] || 'bg-gray-50 text-gray-600 border-gray-100';
        const rowBg = idx % 2 === 0 ? '' : 'bg-gray-50/50';
        return `<tr class="hover:bg-green-50/30 transition-colors ${rowBg}">
                  <td class="p-3 text-center text-gray-400 border-r border-gray-100">${no}</td>
                  <td class="p-3 border-r border-gray-100 text-gray-700 font-medium">${_formatTglLaporan(r.timestamp)}</td>
                  <td class="p-3 border-r border-gray-100 font-bold text-gray-800">${r.pelapor || '-'}</td>
                  <td class="p-3 border-r border-gray-100 text-gray-600">${r.desa || '-'}</td>
                  <td class="p-3 border-r border-gray-100"><span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold border ${komClass}">${r.komoditas || '-'}</span></td>
                  <td class="p-3 border-r border-gray-100 text-gray-500">${r.jenis_ltt || '<span class="text-gray-300">—</span>'}</td>
                  <td class="p-3 border-r border-gray-100 text-gray-500">${r.metode_penanaman || '<span class="text-gray-300">—</span>'}</td>
                  <td class="p-3 border-r border-gray-100 text-right text-gray-600">${_fmtHa(r.luas_bera)}</td>
                  <td class="p-3 border-r border-gray-100 text-right text-gray-600">${_fmtHa(r.olah_lahan)}</td>
                  <td class="p-3 border-r border-gray-100 text-right font-bold text-blue-700">${_fmtHa(r.luas_tanam)}</td>
                  <td class="p-3 border-r border-gray-100 text-right font-bold text-yellow-700">${_fmtHa(r.luas_panen)}</td>
                  <td class="p-3 border-r border-gray-100 text-gray-500 max-w-[150px] truncate" title="${r.keterangan}">${r.keterangan || '-'}</td>
                  <td class="p-3 border-r border-gray-100 text-gray-700 text-[11px]">${r.status || '-'}</td>
                  <td class="p-3 text-center">
                    <button onclick="bukaEditLaporanBPPById('${r.id}')" title="Edit Laporan" class="w-7 h-7 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-600 hover:text-white transition shadow-sm flex items-center justify-center mx-auto">
                      <i class="fa-solid fa-pen-to-square text-xs"></i>
                    </button>
                  </td>
                </tr>`;
      }).join('');
    }
    const infoEl = document.getElementById('bppInfoPaginasiLaporan');
    if (infoEl) {
      if (pageSize > 0 && total > 0) infoEl.innerText = `Menampilkan ${start + 1}–${end} dari ${total.toLocaleString('id-ID')} data`;
      else infoEl.innerText = `Menampilkan ${total.toLocaleString('id-ID')} data`;
    }
    const btnContainer = document.getElementById('bppBtnPaginasiLaporan');
    if (btnContainer && pageSize > 0) {
      btnContainer.innerHTML = '';
      const MathMax = Math.max, MathMin = Math.min, MathFloor = Math.floor;
      const MAX_BTN = 7;
      let startPage = MathMax(1, page - MathFloor(MAX_BTN / 2));
      let endPage = MathMin(totalPages, startPage + MAX_BTN - 1);
      if (endPage - startPage < MAX_BTN - 1) startPage = MathMax(1, endPage - MAX_BTN + 1);
      const mkBtn = (label, pageNum, active, disabled) => {
        const cls = active ? 'px-3 py-1.5 rounded-lg text-xs font-bold bg-green-600 text-white shadow-sm' : disabled ? 'px-3 py-1.5 rounded-lg text-xs font-bold text-gray-300 cursor-not-allowed' : 'px-3 py-1.5 rounded-lg text-xs font-bold text-gray-600 hover:bg-green-50 border border-gray-200 transition';
        return `<button class="${cls}" ${disabled ? 'disabled' : ''} onclick="_bppGoPageLaporan(${pageNum})">${label}</button>`;
      };
      btnContainer.innerHTML += mkBtn('‹ Prev', page - 1, false, page <= 1);
      for (let p = startPage; p <= endPage; p++) btnContainer.innerHTML += mkBtn(p, p, p === page, false);
      btnContainer.innerHTML += mkBtn('Next ›', page + 1, false, page >= totalPages);
    } else if (btnContainer) {
      btnContainer.innerHTML = '';
    }
  }

  function _bppGoPageLaporan(p) {
    const totalPages = _bppLaporanLTTPageSize > 0 ? Math.ceil(_bppLaporanLTTFiltered.length / _bppLaporanLTTPageSize) : 1;
    if (p < 1 || p > totalPages) return;
    _bppLaporanLTTPage = p;
    _bppRenderTabelLaporan(_bppLaporanLTTFiltered);
  }

  function unduhExcelLaporanBPP() {
    if (_bppLaporanLTTFiltered.length === 0) {
      Swal.fire('Info', 'Tidak ada data laporan untuk diunduh.', 'info');
      return;
    }
    exportToExcel(_bppLaporanLTTFiltered, 'Laporan_LTT_BPP.xlsx');
  }

</script>
