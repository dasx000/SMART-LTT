    return !!(entry && entry.ts && Date.now() - entry.ts < TARGET_CACHE_TTL);
  }

  function _invalidasiCacheTarget(komoditas, bulan) {
    delete cacheTargetSemua[komoditas];
    if (bulan && cacheTargetBulanan[bulan]) {
      delete cacheTargetBulanan[bulan][komoditas];
    }
  }

  function setTargetKomoditas(komoditas) {
    targetKomoditasAktif = komoditas;
    KOMODITAS_LIST.forEach((k) => {
      const btn = document.getElementById('tgtKom-' + k);
      if (!btn) return;
      const isActive = k === komoditas;
      btn.className = `px-4 py-2 text-sm font-bold rounded-lg transition-all ${isActive ? 'bg-green-600 text-white' : 'text-gray-500 hover:bg-white'}`;
    });
    muatTabelTargetBulan();
  }

  function muatTabelTargetBulan(forceRefresh = false) {
    const tbody = document.getElementById('tabelTargetBulan');
    if (!tbody) return;

    const cacheEntry = cacheTargetSemua[targetKomoditasAktif];
    if (!forceRefresh && _isCacheValid(cacheEntry)) {
      renderTabelTargetBulan(cacheEntry.data);
      return;
    }

    tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-400">
            <i class="fa-solid fa-circle-notch fa-spin text-2xl text-green-500 mb-2 block"></i>Memuat...</td></tr>`;

    const komoditas = targetKomoditasAktif;
    google.script.run
      .withSuccessHandler((data) => {
        cacheTargetSemua[komoditas] = { data: data, ts: Date.now() };
        if (targetKomoditasAktif === komoditas) renderTabelTargetBulan(data);
      })
      .withFailureHandler((err) => {
        if (targetKomoditasAktif === komoditas) {
          tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-red-400">
                        <i class="fa-solid fa-circle-exclamation mr-2"></i>${err.message}</td></tr>`;
        }
      })
      .ambilTargetBulanan({ bulan: 0, komoditas: komoditas });
  }

  function renderTabelTargetBulan(semua) {
    const perBulan = {};
    const allKec = new Set();
    const allDesa = new Set();

    (semua || []).forEach((t) => {
      const b = t.bulan;
      if (!perBulan[b])
        perBulan[b] = {
          kab: 0,
          kecCount: 0,
          kecTotal: 0,
          desaCount: 0,
          desaTotal: 0,
        };
      if (t.level === 'Kabupaten') {
        perBulan[b].kab += t.totalTarget;
      } else if (t.level === 'Kecamatan') {
        allKec.add(t.namaGeografi);
        perBulan[b].kecCount++;
        perBulan[b].kecTotal += t.totalTarget;
      } else if (t.level === 'Desa') {
        allDesa.add((t.kecamatan || '') + '|' + t.namaGeografi);
        perBulan[b].desaCount++;
        perBulan[b].desaTotal += t.totalTarget;
      }
    });

    const totalKec = allKec.size;
    const totalDesa = allDesa.size;
    const fmtHa = (v) => _numId(v);
    const deficitLabel = (total, kab) => {
      if (kab <= 0) return '';
      const selisih = kab - total;
      if (selisih < -0.005)
        return `<div class="text-xs text-blue-600 font-semibold mt-0.5">Lebih ${fmtHa(Math.abs(selisih))} Ha</div>`;
      if (selisih > 0.005)
        return `<div class="text-xs text-orange-500 font-semibold mt-0.5">Kekurangan ${fmtHa(selisih)} Ha</div>`;
      return `<div class="text-xs text-green-600 font-semibold mt-0.5">Target Sesuai</div>`;
    };

    const tbody = document.getElementById('tabelTargetBulan');
    let html = '';
    for (let b = 1; b <= 12; b++) {
      const d = perBulan[b] || {
        kab: 0,
        kecCount: 0,
        kecTotal: 0,
        desaCount: 0,
        desaTotal: 0,
      };
      const kabDisplay =
        d.kab > 0
          ? `<span class="font-bold text-gray-800">${fmtHa(d.kab)} Ha</span>`
          : `<span class="text-gray-300">—</span>`;
      const kecDisplay =
        totalKec > 0
          ? `${d.kecTotal > 0 ? `<span class="font-bold text-gray-800">${fmtHa(d.kecTotal)} Ha</span>` : '<span class="text-gray-300">—</span>'}${deficitLabel(d.kecTotal, d.kab)}`
          : `<span class="text-gray-300">—</span>`;
      const desaDisplay =
        totalDesa > 0
          ? `${d.desaTotal > 0 ? `<span class="font-bold text-gray-800">${fmtHa(d.desaTotal)} Ha</span>` : '<span class="text-gray-300">—</span>'}${deficitLabel(d.desaTotal, d.kab)}`
          : `<span class="text-gray-300">—</span>`;

      html += `
            <tr class="border-b border-gray-100 hover:bg-green-50/40 transition-colors cursor-pointer" onclick="bukaDetailTargetBulan(${b})">
                <td class="p-4">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-xl bg-green-100 text-green-700 flex items-center justify-center font-bold text-sm">${b}</div>
                        <span class="font-semibold text-gray-800">${NAMA_BULAN[b]}</span>
                    </div>
                </td>
                <td class="p-4 text-center text-sm">${kabDisplay}</td>
                <td class="p-4 text-center text-sm">${kecDisplay}</td>
                <td class="p-4 text-center text-sm">${desaDisplay}</td>
                <td class="p-4 text-center">
                    <button onclick="event.stopPropagation(); bukaDetailTargetBulan(${b})"
                        class="px-3 py-1.5 bg-white border border-green-200 text-green-700 rounded-lg text-xs font-bold hover:bg-green-50 transition">
                        <i class="fa-solid fa-eye mr-1"></i>Detail
                    </button>
                </td>
            </tr>`;
    }
    tbody.innerHTML = html;
  }

  function bukaDetailTargetBulan(bulan) {
    targetBulanAktif = bulan;
    targetTabLevel = 'Kabupaten';

    document.getElementById('modalTargetBulanTitle').textContent =
      `Detail Target — ${NAMA_BULAN[bulan]}`;
    document.getElementById('modalTargetBulanSubtitle').textContent =
      `Komoditas: ${targetKomoditasAktif}`;

    document.getElementById('sectionTarget').classList.add('hidden');
    document.getElementById('sectionDetailTarget').classList.remove('hidden');

    setTabDetailTarget('Kabupaten');
    muatDetailTargetBulan();
  }

  function tutupModalTargetBulan() {
    document.getElementById('sectionDetailTarget').classList.add('hidden');
    document.getElementById('sectionTarget').classList.remove('hidden');
  }

  function setTabDetailTarget(level) {
    targetTabLevel = level;
    const tabIdMap = {
      Kabupaten: 'tabTgtKab',
      Kecamatan: 'tabTgtKec',
      Desa: 'tabTgtDesa',
    };
    ['Kabupaten', 'Kecamatan', 'Desa'].forEach((l) => {
      const btn = document.getElementById(tabIdMap[l]);
      if (!btn) return;
      const isActive = l === level;
      btn.className = `px-5 py-2.5 text-sm font-bold border-b-2 transition ${isActive ? 'border-green-600 text-green-700' : 'border-transparent text-gray-500 hover:text-green-600'}`;
    });

    const labels = {
      Kabupaten: 'Target Kabupaten / Kota',
      Kecamatan: 'Target Kecamatan',
      Desa: 'Target Desa / Kelurahan',
    };
    document.getElementById('labelTabDetailTarget').textContent =
      labels[level] || '';

    const btnTambah = document.getElementById('btnTambahTarget');
    if (btnTambah) {
      btnTambah.style.display = level === 'Kecamatan' ? 'none' : 'flex';
    }

    targetSearchQuery = '';
    targetCurrentPage = 1;
    const searchEl = document.getElementById('targetDesaSearch');
    if (searchEl) searchEl.value = '';

    renderDetailTargetTable();
  }

  function muatDetailTargetBulan(forceRefresh = false) {
    const tbody = document.getElementById('tabelDetailTarget');
    const bulan = targetBulanAktif;
    const komoditas = targetKomoditasAktif;

    const cacheEntry =
      cacheTargetBulanan[bulan] && cacheTargetBulanan[bulan][komoditas];
    if (!forceRefresh && _isCacheValid(cacheEntry)) {
      renderDetailTargetTable();
      renderStatRowTarget(cacheEntry.data);
      return;
    }

    tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-400">
            <i class="fa-solid fa-circle-notch fa-spin text-xl text-green-500 mb-2 block"></i>Memuat...</td></tr>`;

    google.script.run
      .withSuccessHandler((data) => {
        if (!cacheTargetBulanan[bulan]) cacheTargetBulanan[bulan] = {};
        cacheTargetBulanan[bulan][komoditas] = { data: data, ts: Date.now() };
        if (targetBulanAktif === bulan && targetKomoditasAktif === komoditas) {
          renderDetailTargetTable();
          renderStatRowTarget(data);
        }
      })
      .withFailureHandler((err) => {
        if (targetBulanAktif === bulan && targetKomoditasAktif === komoditas) {
          tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-400">${err.message}</td></tr>`;
        }
      })
      .ambilTargetBulanan({ bulan: bulan, komoditas: komoditas });
  }

  function renderStatRowTarget(data) {
    const kab = (data || [])
      .filter((t) => t.level === 'Kabupaten')
      .reduce((s, t) => s + t.totalTarget, 0);
    const kec = (data || [])
      .filter((t) => t.level === 'Kecamatan')
      .reduce((s, t) => s + t.totalTarget, 0);
    const desa = (data || [])
      .filter((t) => t.level === 'Desa')
      .reduce((s, t) => s + t.totalTarget, 0);
    const fmt = (v) => _numId(v);
    const selisihKec = kab - kec;
    const selisihDesa = kab - desa;
    const badgeSelisih = (selisih) => {
      if (selisih === 0)
        return `<span class="text-xs font-bold text-green-600 bg-green-100 px-2 py-0.5 rounded-full">✓ Sesuai Target</span>`;
      if (selisih > 0)
        return `<span class="text-xs font-bold text-orange-600 bg-orange-100 px-2 py-0.5 rounded-full">Kurang ${fmt(selisih)} Ha</span>`;
      return `<span class="text-xs font-bold text-blue-600 bg-blue-100 px-2 py-0.5 rounded-full">Lebih ${fmt(Math.abs(selisih))} Ha</span>`;
    };
    const el = document.getElementById('statRowTargetBulan');
    if (!el) return;
    el.innerHTML = `
            <div class="bg-blue-50 border border-blue-100 rounded-xl sm:rounded-2xl p-2.5 sm:p-4">
                <div class="flex items-center gap-1 sm:gap-2 mb-1">
                    <i class="fa-solid fa-city text-blue-500 text-xs sm:text-sm"></i>
                    <span class="text-[9px] sm:text-xs font-bold text-blue-500 uppercase leading-tight">Target Kab</span>
                </div>
                <p class="text-base sm:text-2xl font-black text-gray-800">${fmt(kab)} <span class="text-xs sm:text-sm font-semibold text-gray-400">Ha</span></p>
            </div>
            <div class="bg-green-50 border border-green-100 rounded-xl sm:rounded-2xl p-2.5 sm:p-4">
                <div class="flex items-center gap-1 sm:gap-2 mb-1">
                    <i class="fa-solid fa-map-location-dot text-green-500 text-xs sm:text-sm"></i>
                    <span class="text-[9px] sm:text-xs font-bold text-green-500 uppercase leading-tight">Total Kec</span>
                </div>
                <p class="text-base sm:text-2xl font-black text-gray-800">${fmt(kec)} <span class="text-xs sm:text-sm font-semibold text-gray-400">Ha</span></p>
                <div class="mt-1">${badgeSelisih(selisihKec)}</div>
            </div>
            <div class="bg-amber-50 border border-amber-100 rounded-xl sm:rounded-2xl p-2.5 sm:p-4">
                <div class="flex items-center gap-1 sm:gap-2 mb-1">
                    <i class="fa-solid fa-house text-amber-500 text-xs sm:text-sm"></i>
                    <span class="text-[9px] sm:text-xs font-bold text-amber-500 uppercase leading-tight">Total Desa</span>
                </div>
                <p class="text-base sm:text-2xl font-black text-gray-800">${fmt(desa)} <span class="text-xs sm:text-sm font-semibold text-gray-400">Ha</span></p>
                <div class="mt-1">${badgeSelisih(selisihDesa)}</div>
            </div>`;
  }

  function renderDetailTargetTable() {
    const cacheEntry =
      cacheTargetBulanan[targetBulanAktif] &&
      cacheTargetBulanan[targetBulanAktif][targetKomoditasAktif];
    const cached =
      cacheEntry && Array.isArray(cacheEntry.data) ? cacheEntry.data : [];
    let filtered = cached.filter((t) => t.level === targetTabLevel);
    if (
      typeof userAktif !== 'undefined' &&
      userAktif &&
      userAktif.role === 'Admin_BPP'
    ) {
      const bppKec = userAktif.kecamatan.toLowerCase();
      filtered = filtered.filter((t) => {
        if (t.level === 'Kecamatan')
          return t.namaGeografi.toLowerCase() === bppKec;
        if (t.level === 'Desa')
          return t.kecamatan && t.kecamatan.toLowerCase() === bppKec;
        return false;
      });
    }

    const isDesaTab = targetTabLevel === 'Desa';
    const tbody = document.getElementById('tabelDetailTarget');
    const fmt = (v) => _numId(v);

    const btnTambah = document.getElementById('btnTambahTarget');
    if (btnTambah && targetTabLevel === 'Kabupaten') {
      btnTambah.style.display = filtered.length > 0 ? 'none' : 'flex';
    }

    const searchContainer = document.getElementById(
      'targetDesaSearchContainer',
    );
    if (searchContainer) searchContainer.classList.toggle('hidden', !isDesaTab);

    let displayData = filtered;
    if (isDesaTab && targetSearchQuery) {
      const q = targetSearchQuery.toLowerCase();
      displayData = filtered.filter(
        (t) =>
          (t.namaGeografi || '').toLowerCase().includes(q) ||
          (t.kecamatan || '').toLowerCase().includes(q),
      );
    }

    if (displayData.length === 0) {
      const tambahBtn =
        targetTabLevel !== 'Kecamatan'
          ? `<br><button onclick="bukaFormTarget(null)" class="mt-3 px-4 py-2 bg-green-600 text-white rounded-xl text-xs font-bold hover:bg-green-700"><i class="fa-solid fa-plus mr-1"></i>Tambah Sekarang</button>`
          : '';
      const emptyMsg =
        isDesaTab && targetSearchQuery
          ? 'Tidak ada desa yang cocok.'
          : 'Belum ada target untuk level ini.';
      tbody.innerHTML = `<tr><td colspan="6" class="p-10 text-center text-gray-400 italic">${emptyMsg}${tambahBtn}</td></tr>`;
      renderTargetPagination(0);
      return;
    }

    let paginatedData = displayData;
    if (isDesaTab && targetPageSize > 0) {
      const start = (targetCurrentPage - 1) * targetPageSize;
      paginatedData = displayData.slice(start, start + targetPageSize);
    }

    const rows = paginatedData
      .map((t) => {
        const rincian = (t.details || [])
          .map(
            (d) =>
              `<span class="inline-flex items-center gap-1 px-2 py-0.5 bg-green-50 text-green-700 rounded-full text-xs font-semibold">${d.jenisLtt}: T:${fmt(d.luas)} P:${fmt(d.luasPanen)} Ha</span>`,
          )
          .join(' ');

        const kecCell = isDesaTab
          ? `<td class="p-3 text-sm text-gray-500">${t.kecamatan || '—'}</td>`
          : `<td class="p-3 text-center text-gray-300">—</td>`;

        const isKecamatan = targetTabLevel === 'Kecamatan';
        const actionHTML = isKecamatan
          ? `<span class="text-gray-300">—</span>`
          : `
                    <div class="flex items-center justify-center">
                        <button onclick="bukaFormTarget(${JSON.stringify(t).replace(/"/g, '&quot;')})"
                            class="p-1.5 text-blue-500 hover:bg-blue-50 rounded-lg transition" title="Edit">
                            <i class="fa-solid fa-pen text-xs"></i>
                        </button>
                    </div>`;

        return `<tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                <td class="p-3 font-semibold text-gray-800">${t.namaGeografi}</td>
                ${kecCell}
                <td class="p-3 text-right font-bold text-green-700">${fmt(t.totalTarget)}</td>
                <td class="p-3 text-right font-bold text-green-700">${fmt(t.totalTargetPanen)}</td>
                <td class="p-3 text-xs">${rincian || '<span class="text-gray-300">—</span>'}</td>
                <td class="p-3 text-xs text-gray-500">${t.pembuat || '—'}</td>
                <td class="p-3 text-center">${actionHTML}</td>
            </tr>`;
      })
      .join('');

    tbody.innerHTML = rows;
    renderTargetPagination(displayData.length);
  }

  function renderTargetPagination(totalFiltered) {
    const container = document.getElementById('targetPaginationContainer');
    if (!container) return;
    const isDesaTab = targetTabLevel === 'Desa';
    container.classList.toggle('hidden', !isDesaTab);
    if (!isDesaTab) return;

    const sizes = [5, 10, 50, 0];
    const sizeHtml = sizes
      .map((s) => {
        const label = s === 0 ? 'Semua' : s;
        const isActive = targetPageSize === s;
        return `<button onclick="setTargetPageSize(${s})" class="px-2.5 py-1 text-xs font-bold rounded-lg transition ${isActive ? 'bg-green-600 text-white' : 'bg-white border border-gray-200 text-gray-500 hover:bg-gray-50'}">${label}</button>`;
      })
      .join('');

    const totalPages =
      targetPageSize > 0 ? Math.ceil(totalFiltered / targetPageSize) : 1;
    let navHtml = '';
    if (targetPageSize > 0 && totalPages > 1) {
      const prevDis = targetCurrentPage <= 1 ? 'disabled' : '';
      const nextDis = targetCurrentPage >= totalPages ? 'disabled' : '';
      navHtml = `<div class="flex items-center gap-1">
                <button onclick="setTargetPage(${targetCurrentPage - 1})" ${prevDis}
                    class="px-2 py-1 text-xs rounded-lg border border-gray-200 text-gray-500 hover:bg-gray-50 disabled:opacity-30">
                    <i class="fa-solid fa-chevron-left"></i></button>
                <span class="text-xs text-gray-500 px-1">${targetCurrentPage} / ${totalPages}</span>
                <button onclick="setTargetPage(${targetCurrentPage + 1})" ${nextDis}
                    class="px-2 py-1 text-xs rounded-lg border border-gray-200 text-gray-500 hover:bg-gray-50 disabled:opacity-30">
                    <i class="fa-solid fa-chevron-right"></i></button>
            </div>`;
    }

    const start =
      targetPageSize > 0 ? (targetCurrentPage - 1) * targetPageSize + 1 : 1;
    const end =
      targetPageSize > 0
        ? Math.min(targetCurrentPage * targetPageSize, totalFiltered)
        : totalFiltered;
    const infoHtml = `<span class="text-xs text-gray-400">${start}–${end} dari ${totalFiltered}</span>`;

    container.innerHTML = `<div class="flex items-center gap-1.5">${sizeHtml}</div>${infoHtml}${navHtml}`;
  }

  function onTargetSearch(val) {
    targetSearchQuery = val;
    targetCurrentPage = 1;
    renderDetailTargetTable();
  }

  function setTargetPageSize(size) {
    targetPageSize = size;
    targetCurrentPage = 1;
    renderDetailTargetTable();
  }

  function setTargetPage(page) {
    targetCurrentPage = Math.max(1, page);
    renderDetailTargetTable();
  }

  // ---- Form Target CRUD ----

  let jenisLTTOptions = [];

  let _geoCache = null;

  function bukaFormTarget(targetData) {
    const isEdit = !!targetData;
    document.getElementById('modalFormTargetTitle').textContent = isEdit
      ? 'Edit Target'
      : 'Tambah Target';
    document.getElementById('tgtIdTarget').value = isEdit ? targetData.id : '';
    document.getElementById('tgtBulan').value = targetBulanAktif;
    document.getElementById('tgtLevel').value = targetTabLevel;
    document.getElementById('tgtKomoditas').value = targetKomoditasAktif;

    document.getElementById('tgtKomoditasDisplay').textContent =
      targetKomoditasAktif;
    document.getElementById('tgtBulanDisplay').textContent =
      NAMA_BULAN[targetBulanAktif];
    document.getElementById('tgtTotalTarget').value = isEdit
      ? _toKoma(targetData.totalTarget) || '0'
      : '';
    document.getElementById('tgtTotalTargetPanen').value = isEdit
      ? _toKoma(targetData.totalTargetPanen) || '0'
      : '';

    // Wilayah: Kabupaten → readonly, Kecamatan/Desa → dropdown
    const wilayahDisplay = document.getElementById('tgtWilayahDisplay');
    const wilayahWrapper = document.getElementById('tgtWilayahSelectWrapper');
    const desaSel = document.getElementById('tgtDesaSelect');

    if (targetTabLevel === 'Kabupaten') {
      wilayahDisplay.classList.remove('hidden');
      wilayahWrapper.classList.add('hidden');
      wilayahDisplay.textContent = isEdit
        ? targetData.namaGeografi
        : typeof userAktif !== 'undefined' && userAktif.kabupaten
          ? userAktif.kabupaten
          : 'Kabupaten Way Kanan';
    } else {
      wilayahDisplay.classList.add('hidden');
      wilayahWrapper.classList.remove('hidden');
      desaSel.classList.add('hidden');

      const initDropdown = (geo) => {
        _geoCache = geo;
        const kecSel = document.getElementById('tgtKecamatanFilter');

        let allowedKec = geo.kecamatan;
        const isBpp =
          typeof userAktif !== 'undefined' &&
          userAktif &&
          userAktif.role === 'Admin_BPP';
        if (isBpp) {
          allowedKec = geo.kecamatan.filter(
            (k) => k.toLowerCase() === userAktif.kecamatan.toLowerCase(),
          );
        }

        kecSel.innerHTML =
          '<option value="">— Pilih Kecamatan —</option>' +
          allowedKec.map((k) => `<option value="${k}">${k}</option>`).join('');

        if (isBpp) {
          kecSel.value = userAktif.kecamatan;
          if (targetTabLevel === 'Desa') {
            desaSel.classList.remove('hidden');
            populateDesaSelect(
              userAktif.kecamatan,
              isEdit ? targetData.namaGeografi : '',
            );
          }
        } else {
          if (targetTabLevel === 'Kecamatan') {
            if (isEdit) kecSel.value = targetData.namaGeografi;
          } else {
            desaSel.classList.remove('hidden');
            if (isEdit) {
              for (const [kec, desas] of Object.entries(geo.desaByKec)) {
                if (desas.indexOf(targetData.namaGeografi) !== -1) {
                  kecSel.value = kec;
                  populateDesaSelect(kec, targetData.namaGeografi);
                  break;
                }
              }
            }
          }
        }
      };

      if (_geoCache) {
        initDropdown(_geoCache);
      } else {
        document.getElementById('tgtKecamatanFilter').innerHTML =
          '<option value="">— Memuat... —</option>';
        google.script.run
          .withSuccessHandler(initDropdown)
          .withFailureHandler(() => {
            document.getElementById('tgtKecamatanFilter').innerHTML =
              '<option value="">— Gagal memuat —</option>';
          })
          .getSemuaGeografi();
      }
    }

    // Desa-specific fields (Semua komoditas level Desa)
    const desaSection = document.getElementById('sectionDesaFields');
    if (targetTabLevel === 'Desa') {
      desaSection.classList.remove('hidden');
      const tgtIPEksisting = document.getElementById('tgtIPEksisting');
      if (tgtIPEksisting) {
        tgtIPEksisting.value = isEdit ? _toKoma(targetData.ipEksisting) : '';
      }

      const tgtLuasBaku = document.getElementById('tgtLuasBaku');
      if (tgtLuasBaku) {
        tgtLuasBaku.value = isEdit ? _toKoma(targetData.luasBakuSawah) : '';
      }
    } else {
      desaSection.classList.add('hidden');
    }

    // Jenis LTT section (Padi only)
    const jenisSection = document.getElementById('sectionJenisLTT');
    const container = document.getElementById('containerJenisLTT');
    container.innerHTML = '';

    if (targetKomoditasAktif === 'Padi') {
      jenisSection.classList.remove('hidden');
      document.getElementById('tgtTotalTarget').readOnly = true;
      document
        .getElementById('tgtTotalTarget')
        .classList.add('bg-gray-100', 'cursor-not-allowed');
      document.getElementById('tgtTotalTargetPanen').readOnly = true;
      document
        .getElementById('tgtTotalTargetPanen')
        .classList.add('bg-gray-100', 'cursor-not-allowed');

      const _populateJenisLTT = (list) => {

          targetData.details.forEach((d) =>
            tambahBarisJenisLTT(d.jenisLtt, d.luas, d.luasPanen),

          tambahBarisJenisLTT('LTT Reguler');
        }
      };
      if (jenisLTTCache['Padi']) {
        _populateJenisLTT(jenisLTTCache['Padi']);
      } else {
        google.script.run
          .withSuccessHandler((list) => {
            jenisLTTCache['Padi'] = list;

          .withFailureHandler(() => {
            /* jenis LTT gagal dimuat, biarkan kosong */

  function hitungTotalTargetOtomatis() {
    const container = document.getElementById('containerJenisLTT');
    if (!container) return;
    let totalTanam = 0;
    let totalPanen = 0;
    container.querySelectorAll('[name="jenisLttLuas"]').forEach((inp) => {
      totalTanam += _parseDesimal(inp.value);
    });
    container.querySelectorAll('[name="jenisLttLuasPanen"]').forEach((inp) => {
      totalPanen += _parseDesimal(inp.value);
    });
    document.getElementById('tgtTotalTarget').value =
      totalTanam > 0 ? totalTanam.toFixed(2).replace('.', ',') : '0,00';
    document.getElementById('tgtTotalTargetPanen').value =
      totalPanen > 0 ? totalPanen.toFixed(2).replace('.', ',') : '0,00';

  function simpanFormTarget(event) {
    event.preventDefault();
    const btn = document.getElementById('btnSimpanFormTarget');
    btn.disabled = true;
    btn.innerHTML =
      '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Menyimpan...';

    const details = [];
    const container = document.getElementById('containerJenisLTT');
    container.querySelectorAll('.parent-node').forEach((row) => {
      const jenis = row.querySelector('[name="jenisLttNama"]')?.value;
      const luas = _parseDesimal(
        row.querySelector('[name="jenisLttLuas"]')?.value,
      );
      const luasPanen = _parseDesimal(
        row.querySelector('[name="jenisLttLuasPanen"]')?.value,
      );
      if (jenis) details.push({ jenisLtt: jenis, luas, luasPanen });
    });

    const level = document.getElementById('tgtLevel').value;
    let namaGeo;
    let kecamatanVal = '';
    if (level === 'Kabupaten') {
      namaGeo = document.getElementById('tgtWilayahDisplay').textContent.trim();
    } else if (level === 'Kecamatan') {
      namaGeo = document.getElementById('tgtKecamatanFilter').value;
      kecamatanVal = namaGeo;
    } else {
      namaGeo = document.getElementById('tgtDesaSelect').value;
      kecamatanVal = document.getElementById('tgtKecamatanFilter').value;
    }
    if (!namaGeo) {
      btn.disabled = false;
      btn.innerHTML = 'Simpan Target';
      Swal.fire('Peringatan', 'Pilih wilayah terlebih dahulu.', 'warning');
      return;
    }

    const formData = {
      id: document.getElementById('tgtIdTarget').value,
      bulan: parseInt(document.getElementById('tgtBulan').value),
      level: document.getElementById('tgtLevel').value,
      namaGeografi: namaGeo,
      kecamatan: kecamatanVal,
      komoditas: document.getElementById('tgtKomoditas').value,
      totalTarget: _parseDesimal(
        document.getElementById('tgtTotalTarget').value,
      ),
      totalTargetPanen: _parseDesimal(
        document.getElementById('tgtTotalTargetPanen').value,
      ),
      ipEksisting: 0,
      luasBakuSawah: _parseDesimal(
        document.getElementById('tgtLuasBaku').value,
      ),
      luasStandingCrop: 0,
      pembuat: typeof userAktif !== 'undefined' ? userAktif.nama : 'Admin',
      details: details,
    };

    google.script.run
      .withSuccessHandler((res) => {
        btn.disabled = false;
        btn.innerHTML = 'Simpan Target';
        if (res.status === 'success') {
          tutupFormTarget();
          _invalidasiCacheTarget(targetKomoditasAktif, targetBulanAktif);
          muatDetailTargetBulan(true);
          muatTabelTargetBulan(true);
          Swal.fire({
            icon: 'success',
            title: 'Berhasil!',
            text: 'Target berhasil disimpan.',
            timer: 2000,
            showConfirmButton: false,
          });
        } else {
          Swal.fire('Gagal', res.message, 'error');
        }
      })
      .withFailureHandler((err) => {
        btn.disabled = false;
        btn.innerHTML = 'Simpan Target';
        Swal.fire('Error', err.message, 'error');
      })
      .simpanTargetBulanan(formData);
  }

    const tbody = document.getElementById('tabelBppTargetBulan');
    if (!tbody) return;

    const komoditas = bppTargetKomoditasAktif;
    const cacheEntry = cacheTargetSemua[komoditas];
    if (!forceRefresh && _isCacheValid(cacheEntry)) {
      renderBppTargetBulan(cacheEntry.data);
      return;
    }

    tbody.innerHTML = `<tr><td colspan="3" class="p-6 text-center text-gray-400">
            <i class="fa-solid fa-circle-notch fa-spin text-green-500 mr-2"></i>Memuat...</td></tr>`;

    google.script.run
      .withSuccessHandler((data) => {
        cacheTargetSemua[komoditas] = { data: data, ts: Date.now() };
        if (bppTargetKomoditasAktif === komoditas) renderBppTargetBulan(data);
      })
      .withFailureHandler((err) => {
        if (bppTargetKomoditasAktif === komoditas && tbody) {
          tbody.innerHTML = `<tr><td colspan="3" class="p-6 text-center text-red-400">${err.message}</td></tr>`;
        }
      })
      .ambilTargetBulanan({ bulan: 0, komoditas: komoditas });

  function renderBppTargetBulan(semua) {
    const kecamatan =
      typeof userAktif !== 'undefined' && userAktif.kecamatan
        ? userAktif.kecamatan.toLowerCase()
        : '';

    // Build per-bulan map: only Kecamatan & Desa rows relevant to BPP's kecamatan
    const perBulan = {};
    (semua || []).forEach((t) => {
      const b = t.bulan;
      const geoLow = t.namaGeografi.toLowerCase();
      if (!perBulan[b])
        perBulan[b] = {
          kec: 0,
          kecPanen: 0,
          desa: 0,
          desaPanen: 0,
          kecId: null,
        };

      if (t.level === 'Kecamatan' && geoLow === kecamatan) {
        perBulan[b].kec += t.totalTarget;
        perBulan[b].kecPanen += t.totalTargetPanen || 0;
        perBulan[b].kecId = t.id;
      } else if (
        t.level === 'Desa' &&
        t.kecamatan &&
        t.kecamatan.toLowerCase() === kecamatan
      ) {
        perBulan[b].desa += t.totalTarget;
        perBulan[b].desaPanen += t.totalTargetPanen || 0;
      }
    });

    const tbody = document.getElementById('tabelBppTargetBulan');
    if (!tbody) return;
    const NAMA_BULAN_BPP = [
      '',
      'Januari',
      'Februari',
      'Maret',
      'April',
      'Mei',
      'Juni',
      'Juli',
      'Agustus',
      'September',
      'Oktober',
      'November',
      'Desember',
    ];
    const fmt = (v) =>
      v > 0 ? _numId(v) + ' Ha' : '<span class="text-gray-300">—</span>';

    let html = '';
    for (let b = 1; b <= 12; b++) {
      const d = perBulan[b] || { kec: 0, kecPanen: 0, desa: 0, desaPanen: 0 };
      const hasData = d.kec > 0 || d.desa > 0;

      html += `<tr class="border-b border-gray-100 hover:bg-green-50/30 transition cursor-pointer" onclick="bukaBppDetailBulan(${b})">
                <td class="p-3">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-xl bg-green-100 text-green-700 flex items-center justify-center font-bold text-xs">${b}</div>
                        <span class="font-semibold text-gray-800 text-sm">${NAMA_BULAN_BPP[b]}</span>
                    </div>
                </td>
                <td class="p-3 text-center text-sm font-semibold text-gray-700">${fmt(d.kec)}</td>
                <td class="p-3 text-center text-sm font-semibold text-gray-700">${fmt(d.kecPanen)}</td>
                <td class="p-3 text-center">
                    <button onclick="event.stopPropagation(); bukaBppDetailBulan(${b})"
                        class="px-3 py-1.5 bg-white border border-green-200 text-green-700 rounded-lg text-xs font-bold hover:bg-green-50 transition">
                        <i class="fa-solid fa-eye mr-1"></i>Detail
                    </button>
                </td>
            </tr>`;
    }
    tbody.innerHTML = html;
  }

  function _nilaiProdValid(s) {

  function _isiPilihanTahun(selEl, tahunAktif) {
    if (!selEl || selEl.options.length) return;
    for (let t = tahunAktif + 1; t >= tahunAktif - 4; t--) {
      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t;
      if (t === tahunAktif) opt.selected = true;
      selEl.appendChild(opt);
    }
  }

  function _kirimProduktivitas(tahun, bulan, nilai) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler((res) => {
          if (res && res.status === 'success') resolve(res);
          else reject(new Error((res && res.message) || 'Gagal menyimpan'));
        })
        .withFailureHandler((err) => reject(err))
        .simpanProduktivitas({
          role: userAktif.role,
          nip: userAktif.nip,
          nama: userAktif.nama,
          kecamatan: userAktif.kecamatan,
          tahun: tahun,
          bulan: bulan,
          nilai: nilai,
        });
    });
  }

  function _prosesUnduhExcelProduktivitas(tahunDari, tahunSampai) {
    Swal.fire({ title: 'Menyiapkan Excel...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

    google.script.run
      .withSuccessHandler((data) => {
        _buatExcelProduktivitas(data, tahunDari, tahunSampai)
          .then((ada) => {
            if (ada) Swal.close();
            else Swal.fire('Kosong', `Belum ada data produktivitas tahun ${tahunDari}–${tahunSampai}.`, 'info');
          })
          .catch((err) => Swal.fire('Error', err.message || 'Gagal mengekspor Excel.', 'error'));
      })
      .withFailureHandler((err) => Swal.fire('Error', err.message || String(err), 'error'))
      .getProduktivitasSemua({ tahunDari: tahunDari, tahunSampai: tahunSampai });
  }

  async function _buatExcelProduktivitas(data, tahunDari, tahunSampai) {
    const rows = (data && data.rows) || [];
    if (rows.length === 0) return false;
    await loadExcelJS();

    // Kecamatan: daftar resmi + kecamatan lain yang kebetulan ada di data
    const kecList = [...(data.kecamatan || [])];
    rows.forEach((r) => {
      if (!kecList.includes(r[2])) kecList.push(r[2]);
    });

    // nilai[tahun][komoditas][kecamatan][bulan-1]
    const nilai = {};
    rows.forEach(([tahun, bulan, kec, kom, v]) => {
      nilai[tahun] = nilai[tahun] || {};
      nilai[tahun][kom] = nilai[tahun][kom] || {};
      nilai[tahun][kom][kec] = nilai[tahun][kom][kec] || new Array(12).fill(0);
      nilai[tahun][kom][kec][bulan - 1] = v;
    });
    const tahunList = Object.keys(nilai).map(Number).sort((a, b) => a - b);

    const BULAN_PENDEK = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    const border = {
      top: { style: 'thin', color: { argb: 'FFD1D5DB' } },
      bottom: { style: 'thin', color: { argb: 'FFD1D5DB' } },
      left: { style: 'thin', color: { argb: 'FFD1D5DB' } },
      right: { style: 'thin', color: { argb: 'FFD1D5DB' } },
    };
    const fill = (argb) => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });
    const NUM_FMT = '0.00';

    const wb = new ExcelJS.Workbook();

    tahunList.forEach((tahun) => {
      _KOMODITAS_PRODUKTIVITAS.forEach((kom) => {
        const ws = wb.addWorksheet(`${kom} ${tahun}`, {
          views: [{ state: 'frozen', xSplit: 2, ySplit: 2 }],
        });
        ws.columns = [{ width: 5 }, { width: 20 }].concat(BULAN_PENDEK.map(() => ({ width: 8 })));

        // Judul
        ws.mergeCells(1, 1, 1, 14);
        const judul = ws.getCell(1, 1);
        judul.value = `Produktivitas ${kom} Tahun ${tahun} (ton/ha)`;
        judul.font = { bold: true, size: 12, color: { argb: 'FFFFFFFF' } };
        judul.fill = fill('FF16A34A');
        judul.alignment = { horizontal: 'center', vertical: 'middle' };
        ws.getRow(1).height = 24;

        // Header
        const header = ws.addRow(['No', 'Kecamatan', ...BULAN_PENDEK]);
        header.height = 20;
        header.eachCell((c) => {
          c.font = { bold: true, color: { argb: 'FFFFFFFF' } };
          c.fill = fill('FF15803D');
          c.alignment = { horizontal: 'center', vertical: 'middle' };
          c.border = border;
        });

        // Data per kecamatan, zebra
        const perKom = (nilai[tahun] && nilai[tahun][kom]) || {};
        kecList.forEach((kec, i) => {
          const vals = perKom[kec] || new Array(12).fill(0);
          const row = ws.addRow([i + 1, kec, ...vals]);
          row.eachCell({ includeEmpty: true }, (c, ci) => {
            c.border = border;
            c.alignment = { vertical: 'middle', horizontal: ci === 2 ? 'left' : 'center' };
            if (ci >= 3) c.numFmt = NUM_FMT;
            if (i % 2 === 1) c.fill = fill('FFF0FDF4');
          });
        });

        // Rata-rata kabupaten per bulan (hanya kecamatan dengan nilai > 0)
        const rata = BULAN_PENDEK.map((_, b) => {
          const isi = kecList.map((kec) => (perKom[kec] ? perKom[kec][b] : 0)).filter((v) => v > 0);
          return isi.length ? Math.round((isi.reduce((s, v) => s + v, 0) / isi.length) * 100) / 100 : 0;
        });
        const rowRata = ws.addRow(['', 'Rata-rata Kabupaten', ...rata]);
        rowRata.eachCell({ includeEmpty: true }, (c, ci) => {
          c.font = { bold: true };
          c.fill = fill('FFDCFCE7');
          c.border = border;
          c.alignment = { vertical: 'middle', horizontal: ci === 2 ? 'left' : 'center' };
          if (ci >= 3) c.numFmt = NUM_FMT;
        });

        // Keterangan
        const ket = ws.addRow([]);
        ws.addRow(['', 'Catatan: 0 = tidak ada panen / belum diisi. Rata-rata hanya dari kecamatan bernilai > 0.']);
        ws.getRow(ket.number + 1).getCell(2).font = { italic: true, size: 9, color: { argb: 'FF6B7280' } };
      });
    });

    const now = new Date();
    const tgl = [
      now.getFullYear(),
      String(now.getMonth() + 1).padStart(2, '0'),
      String(now.getDate()).padStart(2, '0'),
    ].join('');

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], {
      type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const rentang = tahunDari === tahunSampai ? `${tahunDari}` : `${tahunDari}-${tahunSampai}`;
    a.download = `Produktivitas_${rentang}_${tgl}.xlsx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    return true;
  }

    const tbody = document.getElementById('tabelPplTargetBulan');
    if (!tbody) return;

    const komoditas = pplTargetKomoditasAktif;
    const cacheEntry = cacheTargetSemua[komoditas];
    if (!forceRefresh && _isCacheValid(cacheEntry)) {

      return;
    }

      .withSuccessHandler((data) => {

        if (pplTargetKomoditasAktif === komoditas) renderPplTargetBulan(data);
      })
      .withFailureHandler((err) => {

          tbody.innerHTML = `<tr><td colspan="3" class="p-6 text-center text-red-400">${err.message}</td></tr>`;

  function renderPplTargetBulan(semua) {
    // Get desa binaan (can be multiple, stored as comma or array)
    let desaList = [];
    if (typeof userAktif !== 'undefined' && userAktif.desa) {
      desaList = userAktif.desa
        .toString()
        .split(',')
        .map((d) => d.trim().toLowerCase());
    }

    const perBulan = {};
    (semua || []).forEach((t) => {
      const b = t.bulan;
      const geoLow = t.namaGeografi.toLowerCase().trim();
      if (t.level === 'Desa' && desaList.includes(geoLow)) {
        if (!perBulan[b]) perBulan[b] = { total: 0, totalPanen: 0, id: null };
        perBulan[b].total += t.totalTarget;
        perBulan[b].totalPanen += t.totalTargetPanen || 0;
        perBulan[b].id = t.id;
      }
    });

    const tbody = document.getElementById('tabelPplTargetBulan');
    if (!tbody) return;
    const NAMA_BULAN_PPL = [
      '',
      'Januari',
      'Februari',
      'Maret',
      'April',
      'Mei',
      'Juni',
      'Juli',
      'Agustus',
      'September',
      'Oktober',
      'November',
      'Desember',
    ];
    const fmt = (v) =>
      v > 0 ? _numId(v) + ' Ha' : '<span class="text-gray-300">—</span>';

    let html = '';
    for (let b = 1; b <= 12; b++) {
      const d = perBulan[b];
      const hasData = !!d;
      html += `<tr class="border-b border-gray-100 hover:bg-green-50/30 transition">
                <td class="p-3">
                    <div class="flex items-center gap-2">
                        <div class="w-7 h-7 rounded-lg bg-green-100 text-green-700 flex items-center justify-center font-bold text-xs">${b}</div>
                        <span class="font-semibold text-gray-800 text-sm">${NAMA_BULAN_PPL[b]}</span>
                    </div>
                </td>
                <td class="p-3 text-center text-sm font-semibold ${hasData ? 'text-green-700' : 'text-gray-300'}">${hasData ? fmt(d.total) : '<span class="text-gray-300">—</span>'}</td>
                <td class="p-3 text-center text-sm font-semibold ${hasData ? 'text-green-700' : 'text-gray-300'}">${hasData ? fmt(d.totalPanen) : '<span class="text-gray-300">—</span>'}</td>
                <td class="p-3 text-center">
                    <button onclick="bukaFormTargetPPL(${b}, ${hasData})"
                        class="px-3 py-1.5 ${hasData ? 'bg-blue-50 border border-blue-200 text-blue-600' : 'bg-green-600 text-white'} rounded-lg text-xs font-bold hover:opacity-80 transition">
                        <i class="fa-solid ${hasData ? 'fa-pen' : 'fa-plus'} mr-1"></i>${hasData ? 'Edit' : 'Input'}
                    </button>
                </td>
            </tr>`;
    }
    tbody.innerHTML = html;
  }

        })

          Swal.fire('Error', err.message || 'Gagal memuat data', 'error');
        })
        .ambilTargetBulanan({ bulan: 0, komoditas: komoditas });
      return;
    }
    const NAMA_BULAN_PPL = [
      '',
      'Januari',
      'Februari',
      'Maret',
      'April',
      'Mei',
      'Juni',
      'Juli',
      'Agustus',
      'September',
      'Oktober',
      'November',
      'Desember',
    ];

  function simpanBulkTargetPPL(event) {
    event.preventDefault();
    const btn = document.getElementById('btnSimpanBulkTargetPPL');
    btn.disabled = true;
    const oldHtml = btn.innerHTML;
    btn.innerHTML =
      '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i>Menyimpan...';

    const bulan = parseInt(document.getElementById('bulkTgtBulan').value);
    const komoditas = document.getElementById('bulkTgtKomoditas').value;

    const cards = document.querySelectorAll('#containerCardsDesa > div');
    const arrayData = [];

    cards.forEach((card) => {
      const desa = card.getAttribute('data-desa');
      const total = _parseDesimal(card.querySelector('.input-total').value);
      const totalPanen = _parseDesimal(
        card.querySelector('.input-total-panen').value,
      );
      const luasBaku = _parseDesimal(
        card.querySelector('.input-luas-baku').value,
      );

      const details = [];
      card.querySelectorAll('.row-ltt-item').forEach((row) => {
        const jenisLtt = row.querySelector('.select-ltt-jenis').value;
        const luas = _parseDesimal(row.querySelector('.input-ltt-luas').value);
        const luasPanen = _parseDesimal(
          row.querySelector('.input-ltt-luas-panen').value,
        );
        if (jenisLtt) {
          details.push({
            jenisLtt: jenisLtt,
            luas: luas,
            luasPanen: luasPanen,
          });
        }
      });

      arrayData.push({
        desa: desa,
        kecamatan: typeof userAktif !== 'undefined' ? userAktif.kecamatan : '',
        total: total,
        totalPanen: totalPanen,
        ip: 0,
        luasBaku: luasBaku,
        standing: 0,
        details: details,
      });
    });

    const pembuat = typeof userAktif !== 'undefined' ? userAktif.nama : 'PPL';

    google.script.run
      .withSuccessHandler((res) => {
        btn.disabled = false;
        btn.innerHTML = oldHtml;
        if (res.status === 'success') {
          tutupFormTargetPPL();
          delete cacheTargetSemua[pplTargetKomoditasAktif];
          if (_bppPplAktif) {
            _bppPplAktif = null;
            muatBppPPLList();
          } else {
            muatPplTargetBulan(true);
          }
          Swal.fire({
            icon: 'success',
            title: 'Tersimpan!',
            text: 'Semua target desa berhasil disimpan.',
            timer: 1800,
            showConfirmButton: false,
          });
        } else {
          Swal.fire('Gagal', res.message || 'Gagal menyimpan target.', 'error');
        }
      })
      .withFailureHandler((err) => {
        btn.disabled = false;
        btn.innerHTML = oldHtml;
        Swal.fire('Error', err.message || 'Terjadi kesalahan.', 'error');
      })
      .simpanBulkTargetDesa(bulan, komoditas, arrayData, pembuat);
  }

  function setRekapTipePeriode(tipe) {
    rekapTipeAktif = tipe;

    const btnHari = document.getElementById('rekapTipe-Hari');
    const btnBulan = document.getElementById('rekapTipe-Bulan');
    const filterHari = document.getElementById('rekapFilterHari');
    const filterPer = document.getElementById('rekapFilterPeriode');

    const active =
      'flex-1 py-2 text-xs font-bold rounded-lg bg-green-600 text-white transition-all';
    const inactive =
      'flex-1 py-2 text-xs font-bold rounded-lg text-gray-500 hover:bg-white transition-all';

    if (btnHari) btnHari.className = tipe === 'hari' ? active : inactive;
    if (btnBulan) btnBulan.className = tipe === 'bulan' ? active : inactive;

    if (tipe === 'hari') {
      if (filterHari) filterHari.classList.remove('hidden');
      if (filterPer) filterPer.classList.add('hidden');
      const tglInput = document.getElementById('rekapTanggalInput');
      if (tglInput) {

          now.getFullYear() +
          '-' +
          String(now.getMonth() + 1).padStart(2, '0') +
          '-' +
          String(now.getDate()).padStart(2, '0');
        const firstDayStr =
          now.getFullYear() +
          '-' +
          String(now.getMonth() + 1).padStart(2, '0') +
          '-01';
        tglInput.min = firstDayStr;
        tglInput.max = todayStr;
        if (!tglInput.value) tglInput.value = todayStr;

      _updateRekapThead('hari');

      if (filterHari) filterHari.classList.add('hidden');
      if (filterPer) filterPer.classList.remove('hidden');
      _updateRekapThead('bulanan');
      populateRekapPeriodeDropdown();

  function populateRekapPeriodeDropdown() {
    const select = document.getElementById('rekapPeriodeSelect');
    if (!select) return;

    select.innerHTML = '';
    const now = new Date();
    const currentYear = now.getFullYear();
    const currentMonth0 = now.getMonth();

    const NAMA_BULAN = [
      'Januari',
      'Februari',
      'Maret',
      'April',
      'Mei',
      'Juni',
      'Juli',
      'Agustus',
      'September',
      'Oktober',
      'November',
      'Desember',
    ];

    // 5 bulan terakhir termasuk bulan ini
    for (let i = 0; i < 5; i++) {
      let mIdx = currentMonth0 - i;
      let yr = currentYear;
      if (mIdx < 0) {
        mIdx += 12;
        yr -= 1;
      }
      const val = yr + '-' + (mIdx + 1);
      const text = NAMA_BULAN[mIdx] + ' ' + yr;
      const opt = document.createElement('option');
      opt.value = val;
      opt.textContent = text;
      select.appendChild(opt);
    }
  }

  function renderRekapTabel(res, bulanList, tahun) {
    const tbody = document.getElementById('tabelRekapBody');
    if (!tbody) return;
    lastRekapData = { res, bulanList, tahun };

    const desaList = res.desaList || [];
    const targets = res.targets || [];
    const reports = res.reports || [];

    if (desaList.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="12" class="p-8 text-center text-gray-400 font-medium">Tidak ada desa binaan yang terdaftar untuk akun Anda.</td></tr>';
      return;
    }

    const commodities = ['Padi', 'Jagung', 'Ubi Kayu'];
    let html = '';

    const fmtVal = (val, isTargetField = false) => {
      if (val === undefined || val === null || val === '') {
        return isTargetField ? '<span class="text-gray-400">—</span>' : '0,00';
      }
      const num = parseFloat(val);
      if (isNaN(num))
        return isTargetField ? '<span class="text-gray-400">—</span>' : '0,00';
      if (num === 0 && isTargetField)
        return '<span class="text-gray-400">—</span>';
      return _numId(num);
    };

    const fmtPct = (val) => {
      if (val === undefined || val === null || isNaN(val))
        return '<span class="text-gray-400">—</span>';
      return _numId(val);
    };

    commodities.forEach((kom) => {
      html +=
        '<tr class="bg-gray-50 font-bold border-t border-b border-gray-250"><td colspan="12" class="p-2 text-green-800 uppercase tracking-wider text-[10px]">Komoditas: ' +
        kom +
        '</td></tr>';

      let sumLBS = 0;
      let sumTargetTanam = 0;
      let sumRealisasiTanam = 0;
      let sumTargetPanen = 0;
      let sumRealisasiPanen = 0;

      let hasTargetTanam = false;
      let hasTargetPanen = false;
      let hasLBS = false;

      desaList.forEach((desaName, idx) => {
        const cleanDesa = desaName.toLowerCase().trim();
        let lbs = 0;
        let targetTanam = 0;
        let targetPanen = 0;

        targets.forEach((t) => {
          if (
            t.desa.toLowerCase().trim() === cleanDesa &&
            t.komoditas === kom
          ) {
            if (t.luasBakuSawah > 0) {
              lbs = t.luasBakuSawah;
              hasLBS = true;
            }
            if (t.totalTarget > 0) {
              targetTanam += t.totalTarget;
              hasTargetTanam = true;
            }
            if (t.totalTargetPanen > 0) {
              targetPanen += t.totalTargetPanen;
              hasTargetPanen = true;
            }
          }
        });

        let realisasiTanam = 0;
        let realisasiPanen = 0;

        reports.forEach((r) => {
          if (
            r.desa.toLowerCase().trim() === cleanDesa &&
            r.komoditas === kom
          ) {
            realisasiTanam += r.tanam;
            realisasiPanen += r.panen;
          }
        });

        sumLBS += lbs;
        sumTargetTanam += targetTanam;
        sumRealisasiTanam += realisasiTanam;
        sumTargetPanen += targetPanen;
        sumRealisasiPanen += realisasiPanen;

        const pctTanam =
          targetTanam > 0 ? (realisasiTanam / targetTanam) * 100 : undefined;
        const pctPanen =
          targetPanen > 0 ? (realisasiPanen / targetPanen) * 100 : undefined;

        html +=
          '<tr class="border-b border-gray-100 hover:bg-gray-50/50 transition">' +
          '<td class="p-2 text-center text-gray-500 font-medium">' +
          (idx + 1) +
          '</td>' +
          '<td class="p-2 font-semibold text-gray-800">' +
          desaName +
          '</td>' +
          '<td class="p-2 text-gray-600">' +
          kom +
          '</td>' +
          '<td class="p-2 text-right font-medium text-gray-700">' +
          (kom === 'Padi'
            ? fmtVal(lbs, !hasLBS)
            : '<span class="text-gray-300">—</span>') +
          '</td>' +
          '<td class="p-2 text-center text-gray-750 font-medium">0,00</td>' +
          '<td class="p-2 text-right font-medium text-gray-700">' +
          fmtVal(targetTanam, !hasTargetTanam) +
          '</td>' +
          '<td class="p-2 text-right font-semibold text-green-700">' +
          fmtVal(realisasiTanam) +
          '</td>' +
          '<td class="p-2 text-right font-bold text-green-800">' +
          fmtPct(pctTanam) +
          '</td>' +
          '<td class="p-2 text-center text-gray-400">—</td>' +
          '<td class="p-2 text-right font-medium text-gray-700">' +
          fmtVal(targetPanen, !hasTargetPanen) +
          '</td>' +
          '<td class="p-2 text-right font-semibold text-blue-700">' +
          fmtVal(realisasiPanen) +
          '</td>' +
          '<td class="p-2 text-right font-bold text-blue-800">' +
          fmtPct(pctPanen) +
          '</td>' +
          '</tr>';
      });

      const groupPctTanam =
        sumTargetTanam > 0
          ? (sumRealisasiTanam / sumTargetTanam) * 100
          : undefined;
      const groupPctPanen =
        sumTargetPanen > 0
          ? (sumRealisasiPanen / sumTargetPanen) * 100
          : undefined;

      html +=
        '<tr class="bg-green-50/40 font-bold border-b border-gray-250">' +
        '<td class="p-2 text-center text-green-800">—</td>' +
        '<td class="p-2 text-green-800">JUMLAH</td>' +
        '<td class="p-2 text-green-800">' +
        kom +
        '</td>' +
        '<td class="p-2 text-right text-green-800">' +
        (kom === 'Padi'
          ? fmtVal(sumLBS, !hasLBS)
          : '<span class="text-gray-300">—</span>') +
        '</td>' +
        '<td class="p-2 text-center text-green-800">0,00</td>' +
        '<td class="p-2 text-right text-green-800">' +
        fmtVal(sumTargetTanam, !hasTargetTanam) +
        '</td>' +
        '<td class="p-2 text-right text-green-700">' +
        fmtVal(sumRealisasiTanam) +
        '</td>' +
        '<td class="p-2 text-right text-green-800">' +
        fmtPct(groupPctTanam) +
        '</td>' +
        '<td class="p-2 text-center text-gray-400">—</td>' +
        '<td class="p-2 text-right text-green-800">' +
        fmtVal(sumTargetPanen, !hasTargetPanen) +
        '</td>' +
        '<td class="p-2 text-right text-blue-700">' +
        fmtVal(sumRealisasiPanen) +
        '</td>' +
        '<td class="p-2 text-right text-blue-800">' +
        fmtPct(groupPctPanen) +
        '</td>' +
        '</tr>';
    });

    tbody.innerHTML = html;
  }

  function downloadRekapExcel() {
    if (!lastRekapData) {
      Swal.fire('Info', 'Silakan muat data rekap terlebih dahulu.', 'info');
      return;
    }

    if (lastRekapData.tipe === 'hari') {
      _downloadRekapHarianExcel();
      return;
    }

    const doExport = async () => {
      await loadExcelJS();
      const { res } = lastRekapData;
      const desaList = res.desaList || [];
      const targets = res.targets || [];
      const reports = res.reports || [];
      const nama = userAktif ? userAktif.nama : '';
      const sel = document.getElementById('rekapPeriodeSelect');
      const periode =
        sel && sel.selectedIndex >= 0
          ? sel.options[sel.selectedIndex].text
          : '';

      const wb = new ExcelJS.Workbook();
      wb.calcProperties = { fullCalcOnLoad: true };
      const ws = wb.addWorksheet('Rekap LTT');
      ws.columns = [
        { width: 4 },
        { width: 22 },
        { width: 12 },
        { width: 10 },
        { width: 14 },
        { width: 13 },
        { width: 12 },
        { width: 16 },
        { width: 8 },
        { width: 13 },
        { width: 12 },
        { width: 16 },
      ];

      const solidFill = (argb) => ({
        type: 'pattern',
        pattern: 'solid',
        fgColor: { argb },
      });
      const border = {
        top: { style: 'thin' },
        bottom: { style: 'thin' },
        left: { style: 'thin' },
        right: { style: 'thin' },
      };

      // Baris 1 – judul
      const r1 = ws.addRow([`REKAP LAPORAN LTT – ${nama}`]);
      ws.mergeCells('A1:L1');
      const c1 = r1.getCell(1);
      c1.value = `REKAP LAPORAN LTT – ${nama}`;
      c1.font = { bold: true, size: 13, color: { argb: 'FFFFFFFF' } };
      c1.fill = solidFill('FF166534');
      c1.alignment = { horizontal: 'center', vertical: 'middle' };
      r1.height = 26;

      // Baris 2 – periode
      const r2 = ws.addRow([`Periode: ${periode}`]);
      ws.mergeCells('A2:L2');
      r2.getCell(1).font = { italic: true, color: { argb: 'FF374151' } };
      r2.height = 16;

      // Baris 3 – tanggal download
      const now = new Date();
      const tglDownload = now.toLocaleDateString('id-ID', {
        day: '2-digit',
        month: 'long',
        year: 'numeric',
      });
      const jamDownload = now.toLocaleTimeString('id-ID', {
        hour: '2-digit',
        minute: '2-digit',
      });
      const r3 = ws.addRow([`Diunduh pada: ${tglDownload}, ${jamDownload}`]);
      ws.mergeCells('A3:L3');
      r3.getCell(1).font = {
        italic: true,
        size: 9,
        color: { argb: 'FF6B7280' },
      };
      r3.height = 14;

      // Baris 4 – kosong
      ws.addRow([]);

      // Baris 5 – header kolom
      const hdrs = [
        'No',
        'Kampung',
        'Komoditas',
        'LBS (Ha)',
        'Standing Crop',
        'Target Tanam',
        'Realisasi Tanam',
        'Capaian Tanam (%)',
        'Bera',
        'Target Panen',
        'Realisasi Panen',
        'Capaian Panen (%)',
      ];
      const hRow = ws.addRow(hdrs);
      hRow.height = 22;
      hRow.eachCell((c) => {
        c.font = { bold: true, color: { argb: 'FFFFFFFF' } };
        c.fill = solidFill('FF166534');
        c.alignment = {
          horizontal: 'center',
          vertical: 'middle',
          wrapText: true,
        };
        c.border = border;
      });

      const commodities = ['Padi', 'Jagung', 'Ubi Kayu'];
      commodities.forEach((kom) => {
        const groupStart = ws.lastRow.number + 1;

        // Bulatkan max 2 desimal, hapus trailing zero di JS sebelum ditulis ke sel
        const rnd = (v) => parseFloat((parseFloat(v) || 0).toFixed(2));
        const capaian = (tgt, real) =>
          tgt === 0 ? '' : Math.round((real / tgt) * 10000) / 100;

        let groupTgtTanam = 0,
          groupRealTanam = 0,
          groupTgtPanen = 0,
          groupRealPanen = 0;

        desaList.forEach((desaName, idx) => {
          const key = desaName.toLowerCase().trim();
          let lbs = 0,
            tgtTanam = 0,
            tgtPanen = 0,
            realTanam = 0,
            realPanen = 0;
          targets.forEach((t) => {
            if (t.desa.toLowerCase().trim() === key && t.komoditas === kom) {
              if (t.luasBakuSawah > 0) lbs = t.luasBakuSawah;
              if (t.totalTarget > 0) tgtTanam += t.totalTarget;
              if (t.totalTargetPanen > 0) tgtPanen += t.totalTargetPanen;
            }
          });
          reports.forEach((r) => {
            if (r.desa.toLowerCase().trim() === key && r.komoditas === kom) {
              realTanam += r.tanam;
              realPanen += r.panen;
            }
          });

          groupTgtTanam += tgtTanam;
          groupRealTanam += realTanam;
          groupTgtPanen += tgtPanen;
          groupRealPanen += realPanen;

          const dRow = ws.addRow([
            idx + 1,
            desaName,
            kom,
            kom === 'Padi' ? rnd(lbs) : '',
            '',
            rnd(tgtTanam),
            rnd(realTanam),
            0,
            '',
            rnd(tgtPanen),
            rnd(realPanen),
            0,
          ]);
          const rn = dRow.number;
          dRow.getCell(8).value = {
            formula: `IF(F${rn}=0,"",ROUND(G${rn}/F${rn}*100,2))`,
            result: capaian(rnd(tgtTanam), rnd(realTanam)),
          };
          dRow.getCell(12).value = {
            formula: `IF(J${rn}=0,"",ROUND(K${rn}/J${rn}*100,2))`,
            result: capaian(rnd(tgtPanen), rnd(realPanen)),
          };
          dRow.eachCell((c) => {
            c.border = border;
            c.alignment = { vertical: 'middle' };
          });
          dRow.getCell(1).alignment = {
            horizontal: 'center',
            vertical: 'middle',
          };
          [4, 6, 7, 10, 11, 8, 12].forEach((ci) => {
            dRow.getCell(ci).alignment = {
              horizontal: 'right',
              vertical: 'middle',
            };
          });
        });

        // Baris subtotal dengan SUM
        const groupEnd = ws.lastRow.number;
        const sRow = ws.addRow([
          '',
          'JUMLAH',
          kom,
          0,
          '',
          0,
          0,
          0,
          '',
          0,
          0,
          0,
        ]);
        const sr = sRow.number;
        sRow.getCell(4).value = {
          formula: `SUM(D${groupStart}:D${groupEnd})`,
          result: 0,
        };
        sRow.getCell(6).value = {
          formula: `SUM(F${groupStart}:F${groupEnd})`,
          result: rnd(groupTgtTanam),
        };
        sRow.getCell(7).value = {
          formula: `SUM(G${groupStart}:G${groupEnd})`,
          result: rnd(groupRealTanam),
        };
        sRow.getCell(8).value = {
          formula: `IF(F${sr}=0,"",ROUND(G${sr}/F${sr}*100,2))`,
          result: capaian(rnd(groupTgtTanam), rnd(groupRealTanam)),
        };
        sRow.getCell(10).value = {
          formula: `SUM(J${groupStart}:J${groupEnd})`,
          result: rnd(groupTgtPanen),
        };
        sRow.getCell(11).value = {
          formula: `SUM(K${groupStart}:K${groupEnd})`,
          result: rnd(groupRealPanen),
        };
        sRow.getCell(12).value = {
          formula: `IF(J${sr}=0,"",ROUND(K${sr}/J${sr}*100,2))`,
          result: capaian(rnd(groupTgtPanen), rnd(groupRealPanen)),
        };
        sRow.eachCell((c) => {
          c.font = { bold: true };
          c.fill = solidFill('FFF0FDF4');
          c.border = {
            top: { style: 'thin' },
            bottom: { style: 'medium' },
            left: { style: 'thin' },
            right: { style: 'thin' },
          };
        });
        [4, 6, 7, 10, 11, 8, 12].forEach((ci) => {
          sRow.getCell(ci).alignment = {
            horizontal: 'right',
            vertical: 'middle',
          };
        });
      });

      const buf = await wb.xlsx.writeBuffer();
      const blob = new Blob([buf], {
        type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Rekap_LTT_${nama.replace(/\s+/g, '_')}_${periode.replace(/\s+/g, '_')}.xlsx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    doExport().catch((err) =>
      Swal.fire('Error', err.message || 'Gagal ekspor Excel.', 'error'),
    );
  }

  /** Muat data laporan LTT dari GAS */
  function muatLaporanLTT(force = false) {
    const iconRefresh = document.getElementById('iconRefreshLaporan');
    if (iconRefresh) iconRefresh.classList.add('fa-spin');

    document.getElementById('tbodyLaporanLTT').innerHTML =
      '<tr><td colspan="14" class="p-12 text-center text-gray-400 italic"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-green-500 mb-3 block"></i>Memuat data laporan...</td></tr>';

    // Set tanggal ke hari ini jika belum diisi
    const tglMulaiEl = document.getElementById('filterTglMulaiLaporan');
    const tglSelesaiEl = document.getElementById('filterTglSelesaiLaporan');
    const now = new Date();
    const todayStr =
      now.getFullYear() +
      '-' +
      String(now.getMonth() + 1).padStart(2, '0') +
      '-' +
      String(now.getDate()).padStart(2, '0');

    if (tglMulaiEl && !tglMulaiEl.value) {
      tglMulaiEl.value = todayStr;
    }
    if (tglSelesaiEl && !tglSelesaiEl.value) {
      tglSelesaiEl.value = todayStr;
    }

    const tglMulai = tglMulaiEl ? tglMulaiEl.value : '';
    const tglSelesai = tglSelesaiEl ? tglSelesaiEl.value : '';

    // Validasi rentang tanggal
    if (tglMulai && tglSelesai) {
      if (tglMulai > tglSelesai) {
        if (iconRefresh) iconRefresh.classList.remove('fa-spin');
        Swal.fire(
          'Error',
          'Tanggal mulai tidak boleh melebihi tanggal selesai.',
          'error',
        );
        _renderTabelLaporan(_laporanLTTData);
        return;
      }
      if (tglMulai.substring(0, 7) !== tglSelesai.substring(0, 7)) {
        if (iconRefresh) iconRefresh.classList.remove('fa-spin');
        Swal.fire(
          'Peringatan',
          'Tanggal mulai dan selesai harus berada dalam bulan yang sama.',
          'warning',
        );
        _renderTabelLaporan(_laporanLTTData);
        return;
      }
    }

    const params = {};
    if (tglMulai) params.tanggalMulai = tglMulai;
    if (tglSelesai) params.tanggalSelesai = tglSelesai;
    const kom = document.getElementById('filterKomLaporan').value;
    const kec = document.getElementById('filterKecLaporan').value;
    const desa = (
      document.getElementById('filterDesaLaporan').value || ''
    ).trim();
    const metode = document.getElementById('filterMetodeLaporan') ? document.getElementById('filterMetodeLaporan').value : '';
    params.komoditas = kom || 'Padi';
    if (kec) params.kecamatan = kec;
    if (desa) params.desa = desa;
    if (metode) params.metode = metode;

    // Juga muat dropdown kecamatan kalau belum diisi
    _muatDropdownKecLaporan();

    const myReqId = ++_laporanLTTReqId;

    google.script.run
      .withSuccessHandler(function (res) {
        if (myReqId !== _laporanLTTReqId) return; // abaikan response lama
        if (iconRefresh) iconRefresh.classList.remove('fa-spin');
        if (res.status !== 'success') {
          document.getElementById('tbodyLaporanLTT').innerHTML =
            '<tr><td colspan="14" class="p-10 text-center text-red-400"><i class="fa-solid fa-triangle-exclamation mr-2"></i>' +
            (res.message || 'Gagal memuat data') +
            '</td></tr>';
          return;
        }
        _laporanLTTData = res.data || [];
        _laporanLTTLoaded = true;
        _laporanLTTPage = 1;
        _updateStat();
        _applySearchAndRender();
      })
      .withFailureHandler(function (err) {
        if (myReqId !== _laporanLTTReqId) return;
        if (iconRefresh) iconRefresh.classList.remove('fa-spin');
        document.getElementById('tbodyLaporanLTT').innerHTML =
          '<tr><td colspan="14" class="p-10 text-center text-red-400"><i class="fa-solid fa-triangle-exclamation mr-2"></i>Error: ' +
          (err.message || err) +
          '</td></tr>';
      })
      .getLaporanLTT(params);
  }

  /** Muat dropdown kecamatan sekali saja */
  let _kecLaporanLoaded = false;
  function _muatDropdownKecLaporan() {
    if (_kecLaporanLoaded) return;
    google.script.run
      .withSuccessHandler(function (list) {
        _kecLaporanLoaded = true;
        const sel = document.getElementById('filterKecLaporan');
        if (!sel) return;
        const current = sel.value;
        sel.innerHTML = '<option value="">Semua Kecamatan</option>';
        (list || []).forEach((k) => {
          sel.innerHTML += `<option value="${k}" ${k === current ? 'selected' : ''}>${k}</option>`;
        });
      })
      .withFailureHandler(function () {
        /* gagal tidak masalah */
      })
      .getKecamatanLaporan();
  }

  /** Saat kecamatan dipilih: muat dropdown desa sesuai kecamatan */
  function onKecLaporanChange() {
    const kec = document.getElementById('filterKecLaporan').value;
    const selDesa = document.getElementById('filterDesaLaporan');
    if (!kec) {
      selDesa.disabled = true;
      selDesa.innerHTML = '<option value="">— Pilih Kecamatan dulu —</option>';
      return;
    }
    selDesa.disabled = true;
    selDesa.innerHTML = '<option value="">Memuat desa...</option>';
    google.script.run
      .withSuccessHandler(function (list) {
        selDesa.innerHTML = '<option value="">Semua Desa</option>';
        (list || []).forEach((d) => {
          selDesa.innerHTML += `<option value="${d}">${d}</option>`;
        });
        selDesa.disabled = false;
      })
      .withFailureHandler(function () {
        selDesa.innerHTML = '<option value="">Semua Desa</option>';
        selDesa.disabled = false;
      })
      .getDesaLaporan(kec);
  }

  /** Terapkan filter dari form filter bar lalu fetch ulang ke GAS */
  function terapkanFilterLaporan() {
    _laporanLTTLoaded = false;
    muatLaporanLTT(true);
  }

  /** Reset filter ke default */
  function resetFilterLaporan() {
    const now = new Date();
    const todayStr =
      now.getFullYear() +
      '-' +
      String(now.getMonth() + 1).padStart(2, '0') +
      '-' +
      String(now.getDate()).padStart(2, '0');
    if (document.getElementById('filterTglMulaiLaporan')) {
      document.getElementById('filterTglMulaiLaporan').value = todayStr;
    }
    if (document.getElementById('filterTglSelesaiLaporan')) {
      document.getElementById('filterTglSelesaiLaporan').value = todayStr;
    }
    document.getElementById('filterKomLaporan').value = '';
    if (document.getElementById('filterMetodeLaporan')) {
      document.getElementById('filterMetodeLaporan').value = '';
    }
    document.getElementById('filterKecLaporan').value = '';
    const selDesa = document.getElementById('filterDesaLaporan');
